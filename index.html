/* ---------- keep the floating song picker centered on wherever the cover
   art actually is, not just the raw middle of the screen -- on phones
   especially, the header and the (now two-row) scrubber eat up uneven
   amounts of space, so the stage's real visual center isn't the same as
   50% of the full viewport. without this, the picker can drift away from
   the cover entirely on some screens. ---------- */
function positionTrackPanel(){
  if (!stage || !trackPanel) return;
  const r = stage.getBoundingClientRect();
  trackPanel.style.left = (r.left + r.width / 2) + 'px';
  trackPanel.style.top = (r.top + r.height / 2) + 'px';
}
positionTrackPanel();
window.addEventListener('resize', positionTrackPanel);
window.addEventListener('orientationchange', () => setTimeout(positionTrackPanel, 300));

function trackRowHeight(){
  const row = trackPanel.querySelector('.track-row');
  return (row && row.offsetHeight) || 100;
}

/* ---------- the song list is driven entirely by JS transforms now --
   no native overflow-scroll, no scroll-snap, no touch-action tug-of-war
   with the browser. This is the exact same technique the fullscreen
   track list already uses successfully: a physics position (spring when
   settling, friction when flicked) drives translateY on each row every
   frame. Native scrolling inside a position:fixed, touch-action:none
   element is a well-known rough spot on iOS Safari specifically --
   sidestepping native scroll entirely avoids that whole class of bugs. ---------- */
let homeTrackFlowPos = 0;
let homeTrackVelocity = 0;
let homeTrackTargetPos = null;
let homeTrackDragging = false;
let homeTrackDragStartY = 0, homeTrackDragStartPos = 0;
let homeTrackCenteredIdx = null;
let homeTrackWheelSnapTimer = null;

function homeTrackMaxIdx(){
  // count whatever rows are actually rendered right now, rather than
  // assuming it's always the active album's own track list -- the Loved
  // Songs view puts a completely different set of rows in here, and using
  // the wrong count is what made scrolling feel broken/stuck in that view
  const n = trackPanel.querySelectorAll('.track-row').length;
  return n ? n - 1 : 0;
}
function layoutHomeTrackListAt(pos){
  const rows = trackPanel.querySelectorAll('.track-row');
  if (!rows.length) return;
  const stepPx = trackRowHeight();
  rows.forEach((row, i) => {
    const offset = i - pos;
    const dist = Math.abs(offset);
    const scale = Math.max(0.74, 1 - dist * 0.34);
    const opacity = dist > 3.2 ? 0 : Math.max(0.42, 1 - dist * 0.72);
    row.style.transform = `translate(-50%,-50%) translateY(${offset * stepPx}px) scale(${scale})`;
    row.style.opacity = String(opacity);
    row.style.zIndex = String(Math.round(100 - dist * 10));
    row.style.pointerEvents = dist > 0.6 ? 'none' : 'auto';
  });
  const nearestIdx = Math.max(0, Math.min(homeTrackMaxIdx(), Math.round(pos)));
  if (homeTrackCenteredIdx !== null && nearestIdx !== homeTrackCenteredIdx){
    playRolodexClick();
  }
  homeTrackCenteredIdx = nearestIdx;
}
function snapTrackPanelTo(idx){
  homeTrackFlowPos = idx;
  homeTrackTargetPos = null;
  homeTrackVelocity = 0;
  homeTrackCenteredIdx = idx; // this jump is programmatic (new album, etc) -- no click sound for it
  layoutHomeTrackListAt(homeTrackFlowPos);
  positionTrackPanel();
  revealTrackPanel();
}
/* called every frame from the main tick() loop below */
function homeTrackTick(){
  if (!homeTrackDragging){
    const maxIdx = homeTrackMaxIdx();
    if (homeTrackTargetPos !== null){
      const diff = homeTrackTargetPos - homeTrackFlowPos;
      homeTrackFlowPos += diff * SPRING;
      if (Math.abs(diff) < 0.002){ homeTrackFlowPos = homeTrackTargetPos; homeTrackTargetPos = null; }
    } else if (Math.abs(homeTrackVelocity) > 0.0004){
      homeTrackFlowPos += homeTrackVelocity;
      homeTrackVelocity *= FRICTION;
      if (homeTrackFlowPos <= 0 || homeTrackFlowPos >= maxIdx){
        homeTrackFlowPos = Math.max(0, Math.min(maxIdx, homeTrackFlowPos));
        homeTrackVelocity = 0;
        homeTrackTargetPos = Math.round(homeTrackFlowPos);
      } else if (Math.abs(homeTrackVelocity) < 0.006){
        homeTrackVelocity = 0;
        homeTrackTargetPos = Math.round(homeTrackFlowPos);
      }
    }
  }
  layoutHomeTrackListAt(homeTrackFlowPos);
}
function homeTrackDragStart(y){
  homeTrackDragging = true;
  homeTrackTargetPos = null;
  homeTrackVelocity = 0;
  homeTrackDragStartY = y;
  homeTrackDragStartPos = homeTrackFlowPos;
}
function homeTrackDragMove(y){
  if (!homeTrackDragging) return;
  const rowH = trackRowHeight();
  const dy = y - homeTrackDragStartY;
  const maxIdx = homeTrackMaxIdx();
  let p = homeTrackDragStartPos - dy / rowH;
  if (p < 0) p = p * 0.4;
  if (p > maxIdx) p = maxIdx + (p - maxIdx) * 0.4;
  homeTrackFlowPos = p;
}
function homeTrackDragEnd(){
  if (!homeTrackDragging) return;
  homeTrackDragging = false;
  const maxIdx = homeTrackMaxIdx();
  homeTrackTargetPos = Math.round(Math.max(0, Math.min(maxIdx, homeTrackFlowPos)));
}

/* ---------- let a horizontal swipe that starts over the (transparent) track
   panel fall straight through to the cover flow underneath, so you can always
   scroll left/right through the covers, even right on top of the song text
   -- only a vertical drag is claimed by the song list itself.

   this uses touch/mouse events (same model the cover flow itself uses)
   instead of Pointer Events + setPointerCapture. capturing the pointer was
   fighting the browser's native momentum scrolling on the song list, which
   is what caused the "latching on" / scrolling-by-itself glitchiness --
   touch events keep targeting their original element for the whole
   gesture on their own, so nothing needs to be captured. the direction
   check also now requires a clearer, larger horizontal lean before
   committing, so an ordinary vertical scroll can't misfire a phantom
   horizontal drag.

   both directions are driven entirely by hand -- horizontal forwards to
   the cover flow, vertical drives the song list's own JS physics
   (homeTrackDragStart/Move/End). Native scrolling is not used at all
   here anymore, which sidesteps a whole class of iOS Safari quirks
   around touch-action + position:fixed + overflow:auto interacting badly.

   tapping a song to play it is also handled explicitly here on
   touchend/mouseup, rather than relying on the browser's own synthesized
   "click" -- inside a container with custom touchmove listeners, that
   synthetic click can be delayed or dropped entirely on some browsers,
   which is why taps were sometimes silent. ---------- */
(function setupTrackPanelHorizontalPassthrough(){
  let startX = 0, startY = 0, lastX = 0, lastY = 0, decided = null, forwarding = false;

  function reset(x, y){ startX = lastX = x; startY = lastY = y; decided = null; forwarding = false; }
  function decide(x, y){
    if (decided !== null) return;
    const dx = x - startX, dy = y - startY;
    const adx = Math.abs(dx), ady = Math.abs(dy);
    if (adx < 6 && ady < 6) return; // ignore tiny jitter
    if (adx >= ady){
      decided = 'x';
      forwarding = true;
      onDragStart(startX);
      hideTrackPanelNow(); // let the covers be seen clearly while browsing
    } else {
      decided = 'y';
      homeTrackDragStart(startY);
    }
  }
  // a tap that lands inside the (mostly transparent) track panel but doesn't
  // hit an actual song row -- e.g. the padding around the peeking neighbor
  // songs -- should still act like it hit whatever cover is visible there
  function fallbackCoverTap(x, y){
    const prevPE = trackPanel.style.pointerEvents;
    trackPanel.style.pointerEvents = 'none';
    const hit = document.elementFromPoint(x, y);
    trackPanel.style.pointerEvents = prevPE;
    const wrap = hit ? hit.closest('.cover-wrap') : null;
    if (!wrap) return;
    const idx = parseInt(wrap.dataset.index, 10);
    ensureAudioCtx();
    targetPos = idx;
    velocity = 0;
    alCoverTapPlay(idx);   // one screen: play / pause right here
  }
  function finish(x, y, targetEl){
    const totalDist = Math.hypot(x - startX, y - startY);
    const wasTap = totalDist < 12; // genuine tap regardless of which direction got locked in along the way
    if (forwarding) onDragEnd(x);
    if (decided === 'y') homeTrackDragEnd();
    decided = null; forwarding = false;
    if (wasTap && targetEl){
      if (targetEl.closest('.track-heart')) return; // that handles its own tap
      const row = targetEl.closest ? targetEl.closest('.track-row') : null;
      if (row && row.dataset.relIdx !== undefined){
        ensureAudioCtx();
        const r = parseInt(row.dataset.relIdx, 10);
        const t = parseInt(row.dataset.trackIdx, 10);
        // tapping a song here -- whether it's the current album's list or the
        // Loved Songs list -- plays it and jumps into fullscreen, same as
        // tapping an album cover does on the main screen
        playTrack(r, t);
      } else {
        fallbackCoverTap(x, y);
      }
    } else if (!wasTap) {
      revealTrackPanel();
    }
  }

  // ---- touch: both axes handled by hand for reliable direction detection ----
  trackPanel.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    reset(t.clientX, t.clientY);
  }, { passive:true });
  trackPanel.addEventListener('touchmove', (e) => {
    const t = e.touches[0];
    decide(t.clientX, t.clientY);
    if (decided === 'x' && forwarding){
      onDragMove(t.clientX);
    } else if (decided === 'y'){
      homeTrackDragMove(t.clientY);
    }
    lastX = t.clientX; lastY = t.clientY;
    e.preventDefault();
  }, { passive:false });
  trackPanel.addEventListener('touchend', (e) => {
    const t = e.changedTouches[0];
    finish(t.clientX, t.clientY, e.target);
  }, { passive:true });
  trackPanel.addEventListener('touchcancel', () => finish(startX, startY, null), { passive:true });

  // ---- mouse: horizontal forwards to the cover flow, vertical scrolls the
  // song list by hand since a plain div doesn't do click-drag scrolling on its own ----
  let mouseActive = false;
  trackPanel.addEventListener('mousedown', (e) => {
    mouseActive = true;
    reset(e.clientX, e.clientY);
  });
  window.addEventListener('mousemove', (e) => {
    if (!mouseActive) return;
    decide(e.clientX, e.clientY);
    if (decided === 'x' && forwarding){
      onDragMove(e.clientX);
    } else if (decided === 'y'){
      homeTrackDragMove(e.clientY);
    }
    lastX = e.clientX; lastY = e.clientY;
  });
  window.addEventListener('mouseup', (e) => {
    if (!mouseActive) return;
    mouseActive = false;
    finish(e.clientX, e.clientY, e.target);
  });
})();

/* ---------- playback ---------- */
function guessImageMime(url){
  const u = url.toLowerCase();
  if (u.endsWith('.png')) return 'image/png';
  if (u.endsWith('.webp')) return 'image/webp';
  return 'image/jpeg';
}

function updateMediaSessionMetadata(rel, track){
  if (!('mediaSession' in navigator)) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: track.title,
      artist: 'Awesome Love',
      album: rel.title,
      artwork: rel.cover ? [
        { src: rel.cover, sizes: '512x512', type: guessImageMime(rel.cover) },
        { src: rel.cover, sizes: '256x256', type: guessImageMime(rel.cover) },
        { src: rel.cover, sizes: '96x96', type: guessImageMime(rel.cover) }
      ] : []
    });
  } catch(err){ /* lockscreen metadata is a nice-to-have, never block playback on it */ }
}

function playTrack(relIdx, trackIdx, onResult){
  const rel = releases[relIdx];
  const track = rel.tracks[trackIdx];
  currentTrack = { relIdx, trackIdx };
  updateMediaSessionMetadata(rel, track);
  updatePlayheadPlays();

  if (!track.src) {
    nowPlaying.innerHTML = `<strong>${track.title}</strong> -- no audio file linked yet for this song. Add a "src" path in the code to enable playback.`;
    fitNowPlayingSize();
    isPlaying = false;
    updatePlayIcon();
    if (showingFavorites) renderFavorites(); else renderTracks();
    if (onResult) onResult(false);
    return;
  }

  if (typeof alPrepareVolumeRouting === 'function') alPrepareVolumeRouting(track.src);
  audio.src = track.src;
  audio.play().then(() => {
    isPlaying = true;
    updatePlayIcon();
    recordPlay(relIdx, trackIdx);
    if (onResult) onResult(true);
  }).catch((err) => {
    isPlaying = false;
    updatePlayIcon();
    // a NotAllowedError here just means the browser blocked autoplay without
    // a direct tap -- that's not a broken file, so don't show a scary message
    if (!err || err.name !== 'NotAllowedError'){
      nowPlaying.innerHTML = `<strong>${track.title}</strong> -- couldn't play this file. Check the src path.`;
      fitNowPlayingSize();
    }
    if (onResult) onResult(false);
  });
  nowPlaying.innerHTML = `<strong>${track.title}</strong>`;
  fitNowPlayingSize();
}


/* ---------- record-player start and stop ----------
   Starting a song: it begins slow and deep and speeds up to normal over
   3 seconds, like a turntable getting up to speed. Stopping: it slows down
   and drops in pitch over 3 seconds, fading out at the very end, then pauses. */
const alTurntable = (function(){
  const RAMP_MS = 3000;
  const SLOW = 0.5;                      // the slowest the record turns (browsers sound rough much below this)
  const STEP_MS = 60;                    // about 16 small speed steps a second -- smooth enough to glide, but far
                                         // fewer than every frame (each change makes the browser hiccup a little,
                                         // and 60 a second added up to a wobbly tremolo)
  let lastStepAt = 0;
  let raf = null, mode = null, from = 1, to = 1, start = 0, dur = 0, onDone = null;
  let savedVol = null;
  try { audio.preservesPitch = false; } catch(e){}
  try { audio.webkitPreservesPitch = false; } catch(e){}
  try { audio.mozPreservesPitch = false; } catch(e){}
  // a gentle S-curve for both ways: no big jumps at the start or end, so every step is small
  const easeOut = t => 0.5 - 0.5 * Math.cos(Math.PI * t);
  const easeIn  = t => 0.5 - 0.5 * Math.cos(Math.PI * t);
  function setRate(r){
    r = Math.round(r * 100) / 100;        // small, even 0.01 steps
    if (Math.abs((audio.playbackRate || 1) - r) < 0.001) return;
    try { audio.playbackRate = r; } catch(e){}
  }
  // stepped by a timer instead of the screen's animation clock: the animation
  // clock stops completely while a tab is hidden or a phone screen is off, which
  // could freeze the speed part-way and leave a whole song playing tuned up or down
  function stop(){ if (raf) clearTimeout(raf); raf = null; }
  const nextStep = () => setTimeout(() => frame(performance.now()), STEP_MS);
  function restoreVolume(){
    if (savedVol !== null){ try { audio.volume = savedVol; } catch(e){} savedVol = null; }
  }
  function frame(now){
    const t = dur ? Math.min(1, (now - start) / dur) : 1;
    // between speed steps only the fade moves; the speed itself waits for the next step
    const stepNow = t >= 1 || now - lastStepAt >= STEP_MS;
    if (stepNow) lastStepAt = now;
    if (!stepNow && mode === 'up'){ raf = nextStep(); return; }
    if (mode === 'up'){
      setRate(from + (to - from) * easeOut(t));
    } else if (mode === 'down'){
      if (stepNow) setRate(from + (to - from) * easeIn(t));
      // a gentle fade over the last part so it doesn't cut off
      if (savedVol !== null){
        const fade = t < 0.55 ? 1 : 1 - (t - 0.55) / 0.45;
        try { audio.volume = Math.max(0, savedVol * fade); } catch(e){}
      }
    }
    if (t < 1){ raf = nextStep(); return; }
    raf = null;
    const done = onDone; onDone = null;
    const was = mode; mode = null;
    if (was === 'up') setExactRate(1);
    if (done) done();
  }
  function run(m, target, ms, cb){
    stop();
    mode = m; from = audio.playbackRate || 1; to = target; onDone = cb || null;
    lastStepAt = 0;
    dur = ms; start = performance.now();
    raf = nextStep();
  }
  function spinUp(fresh){
    if (mode === 'down'){ restoreVolume(); }
    if (fresh) setRate(SLOW);
    const left = Math.abs(1 - (audio.playbackRate || 1)) / (1 - SLOW);
    run('up', 1, RAMP_MS * Math.max(0.15, Math.min(1, left)));
    audio.dispatchEvent(new Event('alspinup'));
  }
  function spinDown(){
    if (audio.paused){ return; }
    if (mode !== 'down'){ savedVol = audio.volume; }
    const left = Math.abs((audio.playbackRate || 1) - SLOW) / (1 - SLOW);
    run('down', SLOW, RAMP_MS * Math.max(0.15, Math.min(1, left)), () => {
      audio.pause();
      setExactRate(1);
      restoreVolume();
    });
    audio.dispatchEvent(new Event('alspindown'));
  }
  function cancel(){
    stop(); mode = null; onDone = null;
    restoreVolume();
    setRate(1);
  }
  // every fresh start of a song speeds up from slow
  audio.addEventListener('play', () => { if (mode !== 'down') spinUp(true); });
  // a new song being loaded, or a sudden stop, ends any slow-down in progress
  audio.addEventListener('loadstart', () => { if (mode === 'down') cancel(); });
  audio.addEventListener('pause', () => { if (mode === 'up') cancel(); });
  // leaving the tab / locking the phone mid-change: finish the change right away
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden || !mode) return;
    stop();
    const was = mode, done = onDone;
    mode = null; onDone = null;
    if (was === 'up') setExactRate(1);
    if (done) done();
  });
  // safety net: whenever no speed change is happening, the song is at exactly normal speed
  function setExactRate(r){ try { if (audio.playbackRate !== r) audio.playbackRate = r; } catch(e){} }
  setInterval(() => { if (!mode && audio.playbackRate !== 1) setExactRate(1); }, 1000);
  audio.addEventListener('playing', () => { if (!mode && audio.playbackRate !== 1) setExactRate(1); });
  return { spinUp, spinDown, cancel, isSpinningDown: () => mode === 'down' };
})();

/* tapping an album cover on the one screen: the cover that's already playing
   pauses / plays again; any other cover starts its first song */
function alCoverTapPlay(idx){
  const rel = releases[idx];
  if (!rel || !rel.tracks || !rel.tracks.length) return;
  if (currentTrack.relIdx === idx && audio.src) togglePlay();
  else playTrack(idx, 0);
}
function togglePlay(){
  if (currentTrack.relIdx === -1) {
    if (releases[activeIndex].tracks.length) playTrack(activeIndex, 0);
    return;
  }
  if (!audio.src) { playTrack(currentTrack.relIdx, currentTrack.trackIdx); return; }
  if (isPlaying){
    isPlaying = false;
    alTurntable.spinDown();             // slows down over 3 seconds, then stops
  } else {
    if (alTurntable.isSpinningDown()) alTurntable.spinUp(false);   // changed your mind: speed right back up
    else audio.play().catch(()=>{});  // the 'play' event starts the 3 second speed-up
    isPlaying = true;
  }
  updatePlayIcon();
  if (showingFavorites) renderFavorites(); else renderTracks();
}

function updatePlayIcon(){
  playIcon.innerHTML = isPlaying ? ICON_PAUSE : ICON_PLAY;
}

function stepTrack(dir){
  if (currentTrack.relIdx === -1) return;
  const rel = releases[currentTrack.relIdx];
  let next = currentTrack.trackIdx + dir;
  if (next < 0) next = 0;
  if (next >= rel.tracks.length) next = rel.tracks.length - 1;
  playTrack(currentTrack.relIdx, next);
}

/* ---------- helpers ---------- */
function parseDuration(str){
  const p = str.split(':').map(Number);
  if (p.length === 3) return p[0] * 3600 + p[1] * 60 + p[2];
  return p[0] * 60 + p[1];
}
function formatDuration(totalSecs){
  const h = Math.floor(totalSecs / 3600);
  const m = Math.floor((totalSecs % 3600) / 60);
  if (h > 0) return `${h}h ${m}m`;
  return `${m}m`;
}
function formatTime(s){
  s = Math.floor(s || 0);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  if (h > 0) return `${h}:${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
  return `${m}:${sec.toString().padStart(2,'0')}`;
}

/* ---------- transport events ---------- */
playBtn.addEventListener('click', togglePlay);

audio.addEventListener('timeupdate', () => {
  if (!audio.duration) return;
  if (window.alScrubHold && window.alScrubHold()) return;   // your finger is in charge while dragging
  const pct = (audio.currentTime / audio.duration * 100);
  setPlayheadPct(pct);
  renderTimeDigits(curTimeEl, alSlowTime(audio.currentTime));
  renderTimeDigits(durTimeEl, alSlowTime(audio.duration));
  if ('mediaSession' in navigator && navigator.mediaSession.setPositionState){
    try {
      navigator.mediaSession.setPositionState({
        duration: audio.duration,
        playbackRate: audio.playbackRate,
        position: audio.currentTime
      });
    } catch(err){ /* some browsers reject this mid-seek -- ignore */ }
  }
});
audio.addEventListener('ended', () => {
  if (currentTrack.relIdx === -1) return;
  const rel = releases[currentTrack.relIdx];
  if (currentTrack.trackIdx < rel.tracks.length - 1) {
    stepTrack(1);
  } else {
    isPlaying = false;
    updatePlayIcon();
    if (showingFavorites) renderFavorites(); else renderTracks();
  }
});

/* keep isPlaying in sync no matter what triggered the change -- our own
   buttons, the lock screen, headphone controls, or the OS pausing us */
audio.addEventListener('play', () => {
  isPlaying = true;
  updatePlayIcon();
  if (showingFavorites) renderFavorites(); else renderTracks();
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
});
audio.addEventListener('pause', () => {
  isPlaying = false;
  updatePlayIcon();
  if (showingFavorites) renderFavorites(); else renderTracks();
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
});

/* ---------- lock-screen / headphone controls (MediaSession API) ---------- */
if ('mediaSession' in navigator){
  navigator.mediaSession.setActionHandler('play', () => { audio.play().catch(() => {}); });
  navigator.mediaSession.setActionHandler('pause', () => { isPlaying = false; alTurntable.spinDown(); updatePlayIcon(); });
  navigator.mediaSession.setActionHandler('previoustrack', () => stepTrack(-1));
  navigator.mediaSession.setActionHandler('nexttrack', () => stepTrack(1));
  try {
    navigator.mediaSession.setActionHandler('seekto', (details) => {
      if (details.fastSeek && 'fastSeek' in audio){ audio.fastSeek(details.seekTime); return; }
      audio.currentTime = details.seekTime;
    });
  } catch(err){ /* seekto isn't supported everywhere -- fine without it */ }
}

setupScrubbing(progressBar);

/* ---------- drag: covers attached to your hand ---------- */
let dragStartX = 0, dragStartPos = 0, lastX = 0, lastT = 0, pxVelocity = 0;
let coverStepPx = 260;

function getStepPx(){
  const w = flow.firstElementChild;
  const cw = w ? w.getBoundingClientRect().width : 260;
  return cw * 1.15;
}

function onDragStart(clientX){
  ensureAudioCtx();
  isDragging = true;
  targetPos = null;       // grabbing mid-glide takes over immediately
  velocity = 0;
  dragStartX = clientX;
  dragStartPos = flowPos;
  lastX = clientX;
  lastT = performance.now();
  pxVelocity = 0;
  coverStepPx = getStepPx();
  stage.classList.add('grabbing');
  hideTrackPanelNow(); // let the covers be seen clearly while browsing
}

function onDragMove(clientX){
  if (!isDragging) return;
  const now = performance.now();
  const dt = now - lastT;
  if (dt > 0){
    pxVelocity = (clientX - lastX) / dt; // px per ms
    lastX = clientX;
    lastT = now;
  }
  const dx = clientX - dragStartX;
  // soft resistance past the ends instead of a hard stop
  let p = dragStartPos - dx / coverStepPx;
  if (p < 0) p = p * 0.3;
  if (p > MAX_IDX) p = MAX_IDX + (p - MAX_IDX) * 0.3;
  flowPos = p;
}

function onDragEnd(clientX){
  if (!isDragging) return;
  isDragging = false;
  stage.classList.remove('grabbing');
  revealTrackPanel(); // browsing's done -- bring the song list back for a few seconds

  flowPos = clampPos(flowPos);
  const totalMoved = Math.abs(clientX - dragStartX);
  if (totalMoved < 6){
    // simple tap -- click handler picks the exact cover
    targetPos = Math.round(flowPos);
    return;
  }
  // hand the release velocity to the physics loop (px/ms -> covers/frame)
  velocity = -(pxVelocity * 16.7) / coverStepPx;
  if (Math.abs(velocity) < 0.008){
    velocity = 0;
    targetPos = Math.round(flowPos);
  }
}

/* ---------- subtle heart trail while dragging the cover flow ---------- */
let lastTrailX = 0, lastTrailY = 0, trailInited = false;
function maybeSpawnTrailHeart(x, y){
  if (!trailInited){
    lastTrailX = x; lastTrailY = y; trailInited = true;
    spawnTrailHeart(x, y); // instant feedback right on press, not just after moving
    return;
  }
  const dist = Math.hypot(x - lastTrailX, y - lastTrailY);
  if (dist < 8) return; // throttle by distance so it stays a trail, not a smear
  lastTrailX = x; lastTrailY = y;
  spawnTrailHeart(x, y);
}
function spawnTrailHeart(x, y){
  if (!burstLayer){
    burstLayer = document.createElement('div');
    burstLayer.className = 'burst-layer';
    document.body.appendChild(burstLayer);
  }
  const el = document.createElement('img');
  el.className = 'trail-heart';
  el.src = HEART_COLOR_IMG_SRCS[Math.floor(Math.random() * HEART_COLOR_IMG_SRCS.length)];
  el.alt = '';
  const size = 9 + Math.random() * 8;
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  el.style.width = size + 'px';
  el.style.setProperty('--tx', (Math.random() * 14 - 7) + 'px');
  el.style.setProperty('--ty', (-8 - Math.random() * 12) + 'px');
  burstLayer.appendChild(el);
  setTimeout(() => el.remove(), 900);
}

/* ---------- draggable progress bar scrubbing, with a heart trail along the thumb ---------- */
function setupScrubbing(barEl){
  /* dragging the heart along the love meter to choose a part of the song.
     - pointer events (one path for mouse, touch and pen), captured, so the drag
       keeps working wherever the finger wanders, and an interrupted touch can't
       leave the meter stuck "held"
     - while dragging, the heart and the time follow the finger instantly, and
       the song itself only jumps a few times a second (plus once at the end) --
       streaming songs stutter if they're asked to jump on every tiny movement
     - the song's own position reports are ignored until the final jump lands,
       so nothing can pull the heart backward under the finger */
  let scrubbing = false, pointerId = null;
  let targetPct = 0, lastSeekAt = 0, holdUntil = 0;
  const SEEK_EVERY_MS = 220;
  window.alScrubHold = () => scrubbing || performance.now() < holdUntil;
  function pctAt(clientX){
    const rect = barEl.getBoundingClientRect();
    return Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
  }
  function preview(pct){
    setPlayheadPct(pct * 100);
    if (audio.duration && typeof renderTimeDigits === 'function') renderTimeDigits(curTimeEl, alSlowTime(pct * audio.duration));
  }
  function seekNow(){
    if (!audio.duration) return;
    lastSeekAt = performance.now();
    try { audio.currentTime = targetPct * audio.duration; } catch(e){}
  }
  function track(clientX, clientY){
    targetPct = pctAt(clientX);
    preview(targetPct);
    if (performance.now() - lastSeekAt > SEEK_EVERY_MS && !audio.seeking) seekNow();
    maybeSpawnTrailHeart(clientX, clientY);
  }
  function finish(){
    if (!scrubbing) return;
    scrubbing = false;
    pointerId = null;
    seekNow();                                   // land exactly where the finger let go
    holdUntil = performance.now() + 1500;        // ...and wait for that jump to land
    progressThumb.classList.remove('no-transition');
    if (typeof alThumbBounceStop === 'function') alThumbBounceStop();
  }
  audio.addEventListener('seeked', () => { if (!scrubbing) holdUntil = 0; });
  barEl.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault();
    e.stopPropagation();
    ensureAudioCtx();
    scrubbing = true;
    pointerId = e.pointerId;
    try { barEl.setPointerCapture(e.pointerId); } catch(err){}
    progressThumb.classList.add('no-transition');   // instant tracking while dragging
    trailInited = false;
    lastSeekAt = 0;
    track(e.clientX, e.clientY);
    if (typeof alThumbBounceStart === 'function') alThumbBounceStart();
  });
  barEl.addEventListener('pointermove', (e) => {
    if (!scrubbing || e.pointerId !== pointerId) return;
    track(e.clientX, e.clientY);
  });
  barEl.addEventListener('pointerup', (e) => { if (e.pointerId === pointerId) finish(); });
  barEl.addEventListener('pointercancel', (e) => { if (e.pointerId === pointerId) finish(); });
  barEl.addEventListener('lostpointercapture', () => finish());
  // the meter's own clicks/taps never reach anything behind it
  barEl.addEventListener('click', (e) => e.stopPropagation());
}

/* ---------- holding the heart: it bounces fast, then over 6 seconds speeds up
   to super duper fast while changing colors, then over 6 more seconds eases back
   to bouncing fast ---------- */
let alThumbBounceStart, alThumbBounceStop;
(function(){
  const FAST = 3.2, SUPER = 11;        // bounces per second
  const UP = 6, DOWN = 6;              // seconds
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const ease = x => x <= 0 ? 0 : x >= 1 ? 1 : 0.5 - 0.5 * Math.cos(Math.PI * x);
  let raf = null, t0 = 0, last = 0, phase = 0, huePhase = 0;
  function intensity(t){                // 0 = fast, 1 = super duper fast
    if (t < UP) return ease(t / UP);
    if (t < UP + DOWN) return 1 - ease((t - UP) / DOWN);
    return 0;
  }
  function frame(now){
    raf = requestAnimationFrame(frame);
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    const t = (now - t0) / 1000;
    const k = intensity(t);
    const freq = FAST + (SUPER - FAST) * k;
    phase += dt * freq;                 // keeps every bounce smooth while the speed changes
    huePhase += dt * (0.25 + 1.6 * k);  // colors turn faster as it speeds up
    const u = phase % 1;
    const size = progressThumb.offsetHeight || 40;
    const height = size * (0.42 - 0.17 * k);           // quick bounces are a little lower
    const lift = Math.sin(Math.PI * u);
    const land = Math.max(0, 1 - Math.min(u, 1 - u) / 0.12);   // a squish when it lands
    progressThumb.style.marginTop = (-height * lift).toFixed(1) + 'px';
    progressThumb.style.scale = (1 + 0.16 * land) + ' ' + (1 - 0.18 * land);
    const hue = (huePhase * 360) % 360;
    progressThumb.style.filter =
      'drop-shadow(0 2px 5px rgba(0,0,0,0.55)) hue-rotate(' + (hue * k).toFixed(0) + 'deg) saturate(' + (1 + 0.9 * k).toFixed(2) + ') brightness(' + (1 + 0.25 * k).toFixed(2) + ') drop-shadow(0 0 ' + (4 + 12 * k).toFixed(1) + 'px hsla(' + hue.toFixed(0) + ',100%,65%,' + (0.25 + 0.6 * k).toFixed(2) + '))';
  }
  alThumbBounceStart = function(){
    if (reduce) return;
    if (raf) cancelAnimationFrame(raf);
    t0 = last = performance.now(); phase = 0; huePhase = 0;
    progressThumb.classList.add('al-holding');
    raf = requestAnimationFrame(frame);
  };
  alThumbBounceStop = function(){
    if (raf) cancelAnimationFrame(raf);
    raf = null;
    progressThumb.classList.remove('al-holding');
    progressThumb.style.marginTop = '';
    progressThumb.style.scale = '';
    progressThumb.style.filter = '';
  };
})();

stage.addEventListener('mousedown', (e) => { e.preventDefault(); onDragStart(e.clientX); trailInited = false; });
window.addEventListener('mousemove', (e) => { if (isDragging){ onDragMove(e.clientX); maybeSpawnTrailHeart(e.clientX, e.clientY); } });
window.addEventListener('mouseup', (e) => { if (isDragging) onDragEnd(e.clientX); });

/* touch on the home screen now does double duty: swipe sideways to browse
   covers (as before), or swipe up/down to change the volume -- the two
   never fight because we wait for the first few pixels of movement to
   decide which axis this particular gesture belongs to, then commit to
   that mode for the rest of the gesture. */
let stageTouchStartX = 0, stageTouchStartY = 0, stageTouchMode = null, stageTouchVolStart = 0;
stage.addEventListener('touchstart', (e) => {
  stageTouchStartX = e.touches[0].clientX;
  stageTouchStartY = e.touches[0].clientY;
  stageTouchMode = null;
  trailInited = false;
}, {passive:true});
stage.addEventListener('touchmove', (e) => {
  const x = e.touches[0].clientX, y = e.touches[0].clientY;
  if (stageTouchMode === null){
    const dx = x - stageTouchStartX, dy = y - stageTouchStartY;
    if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return; // not enough movement to tell yet
    stageTouchMode = Math.abs(dx) > Math.abs(dy) ? 'browse' : 'volume';
    if (stageTouchMode === 'browse'){
      onDragStart(stageTouchStartX);
    } else if (showingFavorites){
      // Loved Songs is open -- a vertical swipe here is someone scrolling
      // that list through the gaps around it, not a volume gesture
      stageTouchMode = 'ignore';
    } else {
      ensureAudioCtx();
      stageTouchVolStart = getVolume();
      showVolumeIndicator();
    }
  }
  if (stageTouchMode === 'browse'){
    onDragMove(x);
    maybeSpawnTrailHeart(x, y);
  } else if (stageTouchMode === 'volume'){
    // swipe up raises volume, swipe down lowers it
    setVolume(stageTouchVolStart + (stageTouchStartY - y) / 550);   // gentler: the numbers glide slowly
  }
}, {passive:true});
stage.addEventListener('touchend', (e) => {
  if (stageTouchMode === 'browse') onDragEnd(e.changedTouches[0].clientX);
  else if (stageTouchMode === 'volume') scheduleHideVolumeIndicator();
  stageTouchMode = null;
}, {passive:true});

/* tap a specific cover -- fly to it and go straight into the fullscreen
   now-playing view. If nothing's playing yet, it also starts that album's
   first song; but if music is already going, a tap should just carry you
   into fullscreen to see/browse from there, not interrupt what's playing
   by jumping to some other album's track 1. This is now the only way to
   get into an album from the home screen: there's no more song list
   sitting over the covers, just the coverflow itself (still browsable by
   dragging, per the heart-trail) and a tap to dive in. */
flow.addEventListener('click', (e) => {
  if (Math.abs(lastX - dragStartX) > 6) return;
  const hit = document.elementFromPoint(e.clientX, e.clientY);
  const wrap = hit ? hit.closest('.cover-wrap') : null;
  if (!wrap) return;
  const idx = parseInt(wrap.dataset.index);
  ensureAudioCtx();
  targetPos = idx;
  velocity = 0;
  alCoverTapPlay(idx);   // one screen: play / pause right here
});

/* trackpad / mouse wheel / Magic Mouse: horizontal browses covers (as
   before); vertical now controls volume instead of doing nothing. A
   Magic Mouse has no physical wheel, but swiping on its touch surface
   fires the same wheel events (with deltaY) as a trackpad or scroll
   wheel would, so it needs no special handling here -- it just works. */
let wheelSnapTimer = null;
let wheelVolHideTimer = null;
stage.addEventListener('wheel', (e) => {
  if (Math.abs(e.deltaX) >= Math.abs(e.deltaY)){
    e.preventDefault();
    ensureAudioCtx();
    targetPos = null;
    velocity = 0;
    flowPos = clampPos(flowPos + e.deltaX / 220);
    clearTimeout(wheelSnapTimer);
    wheelSnapTimer = setTimeout(() => { targetPos = Math.round(flowPos); }, 120);
  } else {
    if (showingFavorites) return; // don't hijack a Loved Songs list scroll as a volume change
    e.preventDefault();
    ensureAudioCtx();
    // note: with "natural scrolling" (the Mac default, incl. Magic Mouse),
    // swiping down reports a NEGATIVE deltaY -- so we add here, not
    // subtract, to keep swipe down = volume down, swipe up = volume up
    setVolume(getVolume() + e.deltaY / 2250);   // gentler: the numbers glide slowly
    showVolumeIndicator();
    clearTimeout(wheelVolHideTimer);
    wheelVolHideTimer = setTimeout(scheduleHideVolumeIndicator, 90);
  }
}, {passive:false});

/* keyboard */
document.addEventListener('keydown', (e) => {
  const fsOpen = fsOverlay && fsOverlay.classList.contains('open');

  if (fsOpen){
    if (e.key === 'ArrowLeft'){
      e.preventDefault(); ensureAudioCtx(); fsVelocity = 0;
      fsTargetPos = Math.max(0, (fsTargetPos ?? Math.round(fsFlowPos)) - 1);
    }
    if (e.key === 'ArrowRight'){
      e.preventDefault(); ensureAudioCtx(); fsVelocity = 0;
      fsTargetPos = Math.min(MAX_IDX, (fsTargetPos ?? Math.round(fsFlowPos)) + 1);
    }
    if (e.key === 'ArrowUp'){
      e.preventDefault(); ensureAudioCtx(); fsTrackVelocity = 0;
      fsTrackTargetPos = Math.max(0, (fsTrackTargetPos ?? Math.round(fsTrackFlowPos)) - 1);
      fsRevealText();
    }
    if (e.key === 'ArrowDown'){
      e.preventDefault(); ensureAudioCtx(); fsTrackVelocity = 0;
      fsTrackTargetPos = Math.min(fsTrackMaxIdx(), (fsTrackTargetPos ?? Math.round(fsTrackFlowPos)) + 1);
      fsRevealText();
    }
  } else {
    // up/down track-switching only makes sense inside fullscreen now -- the
    // main screen has no song list to move a selection through anymore
    if (e.key === 'ArrowLeft'){ ensureAudioCtx(); velocity = 0; targetPos = Math.max(0, (targetPos ?? Math.round(flowPos)) - 1); hideTrackPanelNow(); }
    if (e.key === 'ArrowRight'){ ensureAudioCtx(); velocity = 0; targetPos = Math.min(MAX_IDX, (targetPos ?? Math.round(flowPos)) + 1); hideTrackPanelNow(); }
  }
  if (e.key === ' '){ e.preventDefault(); togglePlay(); }
});

let storyTypeTimeouts = [];
function clearStoryTyping(){
  storyTypeTimeouts.forEach(id => clearTimeout(id));
  storyTypeTimeouts = [];

/* ---------- remembering how far a story had typed out ----------
   so reopening a story (even after closing the whole page and coming
   back) picks up right where the letters had gotten to, instead of
   re-typing the whole thing from the top every time. Progress is kept
   per-story (keyed by its position in the releases list, since a
   couple of stories happen to share the same title) as a plain letter
   count in localStorage. */
const STORY_PROGRESS_KEY = 'al_story_progress_v3';
function loadStoryProgress(key){
  try {
    const all = JSON.parse(localStorage.getItem(STORY_PROGRESS_KEY) || '{}');
    const n = all[key];
    return (typeof n === 'number' && n > 0) ? n : 0;
  } catch(e){ return 0; }
}
function saveStoryProgress(key, count){
  if (!key) return;
  try {
    const all = JSON.parse(localStorage.getItem(STORY_PROGRESS_KEY) || '{}');
    all[key] = count;
    localStorage.setItem(STORY_PROGRESS_KEY, JSON.stringify(all));
  } catch(e){}
}
// the story currently on screen -- tracked so we can save its progress
// the instant it's closed (or another story replaces it)
let currentStoryKey = null;
let currentStoryRevealed = 0;
let currentStoryTotalChars = 0;
function commitCurrentStoryProgress(){
  if (currentStoryKey && currentStoryTotalChars > 0){
    saveStoryProgress(currentStoryKey, currentStoryRevealed);
  }
}
/* a simple, honest keyword read on a paragraph's emotional weight -- not a
   real sentiment model, just enough to tell "this part is heavy" from
   "this part is neutral or good" so the two can be styled differently.
   Defaults to happy/neutral unless it actually finds heavy language. */
const STORY_HEAVY_WORDS = [
  'loss','lost','losing','death','died','dying','grief','grieving','dementia',
  'alone','lonely','loneliness','hurt','hurting','pain','painful','cry','crying',
  'tears','sad','sadness','struggl','ridicule','judge','judged','judging','mock',
  'mocked','alcohol','depress','suicid','hate','hated','abuse','cruel','cruelty',
  'mean','broke','broken','breaking','dark','darkness','fear','afraid','anxious',
  'anxiety','trauma','sick','illness','ill ','bad place','worst','worse','ashamed',
  'shame','regret','angry','anger','rage','fight','fighting','divorce','died',
  'funeral','goodbye','miss you','missing','scared','hopeless','give up'
];
function classifyStoryTone(text){
  const lower = text.toLowerCase();
  return STORY_HEAVY_WORDS.some(w => lower.includes(w)) ? 'heavy' : 'happy';
}
/* words joyful enough to earn a little floating heart-balloon of their own

  'happy','happiness','hope','hopeful','peace','peaceful','heart','hearts',
  'joy','joyful','amazing','magical','bright','shine','shining','smile',
  'smiling','kind','kindness','grateful','gratitude','blessed','sweet',
  'sweetheart','wonder','wonders','glorious','miracle','miraculous',
  'warm','warmth','dream','dreams','music','alive','free','freedom',
  'graceful','gentle','phenomenal','remarkable','exceptional','unbreakable',
  'unstoppable','unforgettable','possible','inspirational','sensational',
  'incredible','wonderous','marvelous','fabulous','gorgeous','prosperous',
  'generous','gracious','courageous','tremendous','courteous','glamorous',
  'comforting','uplifting','mesmerizing','believe','agree','elite','treat',
  'sexy','devine','summertime','sunshine','fine','fantastic','majestic',
  'enthusiastic','romantic','euphoric','dope','relief','ease','heal','real',
  'forgive','live','give','relaxation','elation','healthy','wealthy',
  'comfort','good','great','nice','like','glad','fearless','wholesome',
  'purpose','superb','steller','uplifted','pleasing','splendid','recieve',
  'brilliant','charity','breathtaking','immaculate','motivated','prosperity',
  'enthusiasm','positivity','extraordinary'
];
function isBalloonWord(word){
  const cleaned = word.toLowerCase().replace(/[^a-z]/g, '');
  return STORY_BALLOON_WORDS.includes(cleaned);
}
// balloon colors taken from Al's balloon inspiration picture, turned up extra vibrant
const STORY_BALLOON_COLORS = ['#ffd21a', '#c6f04a', '#3fe07a', '#00c2ff', '#1f7bff', '#8a4dff', '#e02bd0', '#ff3d8b', '#ff8a2a'];
// happy / neutral writing: shades of red, pink, orange, blue and green
const STORY_HAPPY_COLORS = ['#ff3b3b', '#ff5d7a', '#ff7eb6', '#ff4f9a', '#ff9a3c', '#ffb347', '#4fa8ff', '#38c6ff', '#4cd97b', '#7ee36a'];
// sad / heavy writing: black, navy, deep dark red, and more black
const STORY_SAD_COLORS = ['#000000', '#000000', '#04060d', '#0b1433', '#101d4a', '#3d0008', '#55000c', '#000000'];
const HAPPY_CHAR_FX = ['spin-happy', 'twirl-happy', 'bounce-happy', 'enlarge-happy'];
/* pops one little colored heart-balloon up from wherever the given word
   currently sits on screen, then lets it float up and fade away */
let alBalloonUid = 0;
function spawnLoveBalloon(wordSpan){
  if (!wordSpan || !wordSpan.isConnected) return;
  const rect = wordSpan.getBoundingClientRect();
  if (rect.width === 0 && rect.height === 0) return;
  // a little bunch of shiny balloons tied together, all strings meeting at one knot
  const n = 3 + Math.floor(Math.random() * 3);
  const cols = STORY_BALLOON_COLORS.slice().sort(() => Math.random() - 0.5).slice(0, n);
  const uid = 'alb' + (++alBalloonUid);
  const KX = 60, KY = 166;
  const spots = [[60,42],[34,58],[86,58],[47,30],[73,30],[60,70]].sort(() => Math.random() - 0.5).slice(0, n);
  let defs = '', strings = '', bodies = '';
  spots.forEach(([cx, cy], k) => {
    cx += Math.random() * 6 - 3; cy += Math.random() * 6 - 3;
    const c = cols[k], rx = 16 + Math.random() * 3, ry = rx * 1.22;
    const tilt = ((cx - KX) * 0.35).toFixed(1);
    defs += '<radialGradient id="' + uid + 'g' + k + '" cx="35%" cy="30%" r="75%">' +
      '<stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>' +
      '<stop offset="0.18" stop-color="' + c + '" stop-opacity="1"/>' +
      '<stop offset="0.8" stop-color="' + c + '"/>' +
      '<stop offset="1" stop-color="#000" stop-opacity="0.35"/></radialGradient>';
    const bx = cx, by = cy + ry;
    strings += '<path d="M' + bx.toFixed(1) + ' ' + (by + 3).toFixed(1) + ' Q' + ((bx + KX) / 2 + (Math.random() * 10 - 5)).toFixed(1) + ' ' + ((by + KY) / 2).toFixed(1) + ' ' + KX + ' ' + KY + '" />';
    bodies += '<g transform="rotate(' + tilt + ' ' + cx.toFixed(1) + ' ' + cy.toFixed(1) + ')">' +
      '<ellipse cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" rx="' + rx.toFixed(1) + '" ry="' + ry.toFixed(1) + '" fill="url(#' + uid + 'g' + k + ')"/>' +
      // a soft swirl, like the patterns on Al's balloons
      '<path d="M' + (cx - rx * 0.55).toFixed(1) + ' ' + (cy + ry * 0.15).toFixed(1) + ' q' + (rx * 0.5).toFixed(1) + ' ' + (-ry * 0.55).toFixed(1) + ' ' + (rx * 1.05).toFixed(1) + ' ' + (-ry * 0.1).toFixed(1) + ' t' + (rx * 0.1).toFixed(1) + ' ' + (ry * 0.45).toFixed(1) + '" fill="none" stroke="#fff" stroke-opacity="0.38" stroke-width="2" stroke-linecap="round"/>' +
      '<ellipse cx="' + (cx - rx * 0.38).toFixed(1) + '" cy="' + (cy - ry * 0.42).toFixed(1) + '" rx="' + (rx * 0.22).toFixed(1) + '" ry="' + (ry * 0.16).toFixed(1) + '" fill="#fff" fill-opacity="0.85" transform="rotate(-30 ' + (cx - rx * 0.38).toFixed(1) + ' ' + (cy - ry * 0.42).toFixed(1) + ')"/>' +
      '<path d="M' + (bx - 3).toFixed(1) + ' ' + (by + 4).toFixed(1) + ' L' + bx.toFixed(1) + ' ' + (by - 1).toFixed(1) + ' L' + (bx + 3).toFixed(1) + ' ' + (by + 4).toFixed(1) + 'Z" fill="' + c + '"/>' +
      '</g>';
  });
  const svg = '<svg viewBox="0 0 120 170" width="74" height="105" aria-hidden="true"><defs>' + defs + '</defs>' +
    '<g fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="1.1">' + strings + '</g>' + bodies + '</svg>';
  const bunch = document.createElement('div');
  bunch.className = 'story-balloon';
  bunch.style.left = (rect.left + rect.width / 2) + 'px';
  bunch.style.top = rect.top + 'px';
  bunch.style.setProperty('--drift', Math.round(Math.random() * 70 - 35) + 'px');
  bunch.style.setProperty('--sway', (Math.random() < 0.5 ? -1 : 1) * (4 + Math.random() * 5) + 'deg');
  bunch.innerHTML = svg;
  document.body.appendChild(bunch);
  setTimeout(() => bunch.remove(), 3700);
}
/* builds the story body out of individually-spanned characters (grouped
   into word-wrappers so normal line-wrapping still works), reveals them
   one at a time typewriter-style, then starts the post-typing quirks once
   it's all typed out */
// true once the currently-open story has fully finished typing itself out
// -- the small cover in the story header only replays the story from the
// beginning once this is true, so a tap mid-type doesn't interrupt it
let storyTypingComplete = false;
// each heart emoji in a story becomes Al's own hand-drawn heart in that color
function storyHeartSrc(ch){
  const c = ch.replace(/\uFE0F/g, '');
  const map = {
    '\u2764': HEART_COLOR_RED, '\u{1F9E1}': HEART_COLOR_ORANGE, '\u{1F49B}': HEART_COLOR_YELLOW,
    '\u{1F49A}': HEART_COLOR_GREEN, '\u{1F499}': HEART_COLOR_BLUE, '\u{1F49C}': HEART_COLOR_PURPLE
  };
  return map[c] || null;
}
function typeOutStory(paragraphs, storyKey, restart){
  commitCurrentStoryProgress(); // save whatever story was previously open
  clearStoryTyping();
  storyTypingComplete = false;
  // clear the old story text but keep the cover / name / AL line on top
  [...storyBody.children].forEach(c => { if (!c.classList.contains('story-head') && c.id !== 'storyMetaLine') c.remove(); });
  storyBody.scrollTop = 0;
  document.querySelectorAll('.story-balloon').forEach(b => b.remove());
  const allChars = [];
  const balloonWords = []; // { span, lastIndex } -- fires once its last letter types in
  paragraphs.forEach(text => {
    const tone = classifyStoryTone(text);
    const p = document.createElement('p');
    p.classList.add('tone-' + tone);
    const words = text.split(' ');
    words.forEach((word, wi) => {
      const wordSpan = document.createElement('span');
      wordSpan.className = 'story-word';
      wordSpan.dataset.tone = tone;
      const wantsBalloon = isBalloonWord(word);
      // pick the balloon's color up front so the word itself can be dyed
      // the exact same color the moment it's done typing -- word and
      // balloon always match
      const balloonColor = wantsBalloon
        ? STORY_BALLOON_COLORS[Math.floor(Math.random() * STORY_BALLOON_COLORS.length)]
        : null;
      for (const ch of alChars(word)){
        const charSpan = document.createElement('span');
        charSpan.className = 'story-char';
        const heartSrc = storyHeartSrc(ch);
        if (heartSrc){
          charSpan.classList.add('story-heart');
          charSpan.innerHTML = '<span class="al-sr">' + ch + '</span><img src="' + heartSrc + '" alt="">';
          charSpan.dataset.tone = tone;
          wordSpan.appendChild(charSpan);
          allChars.push(charSpan);
          continue;
        }
        if (balloonColor){
          charSpan.style.color = STORY_BALLOON_COLORS[Math.floor(Math.random() * STORY_BALLOON_COLORS.length)];
        } else {
          const pal = tone === 'heavy' ? STORY_SAD_COLORS : STORY_HAPPY_COLORS;
          charSpan.style.color = pal[Math.floor(Math.random() * pal.length)];
        }
        if (typeof AL_DIGITS !== 'undefined' && AL_DIGITS[ch]){
          // Al's own colored hand-drawn numbers (and dancing !) inside the story too
          charSpan.classList.add('story-al-glyph');
          charSpan.innerHTML = '<span class="al-sr">' + ch + '</span>' + alDigitSVG(ch);
        } else {
          charSpan.textContent = ch;
        }
        charSpan.dataset.tone = tone;
        wordSpan.appendChild(charSpan);
        allChars.push(charSpan);
      }
      if (wantsBalloon) wordSpan.classList.add('awesome-word');
      if (wantsBalloon && wordSpan.childElementCount){
        balloonWords.push({ span: wordSpan, lastIndex: allChars.length - 1, color: balloonColor });
      }
      p.appendChild(wordSpan);
      if (wi < words.length - 1) p.appendChild(document.createTextNode(' '));
    });
    storyBody.appendChild(p);
  });
  if (allChars.length === 0) return;
  currentStoryKey = storyKey;
  currentStoryTotalChars = allChars.length;
  // pick up right where a previous visit to this same story left off --
  // unless this is a forced restart (tapping the glowing cover once the
  // story's done typing), in which case it always replays from character 0
  const resumeAt = restart ? 0 : Math.min(loadStoryProgress(storyKey), allChars.length);
  currentStoryRevealed = resumeAt;
  // a single steady per-character pace (not a length-scaled total) so a
  // one-line story and the longest album story both type at the exact same
  // comfortable speed -- previously the "reasonable total time" clamp gave
  // short stories a much slower per-letter pace than long ones. 68.4ms/char
  // is the pace that reads well on the longest story ("Awesome"), used here
  // as the pace for every story. A small floor keeps the very shortest
  // stories from finishing near-instantly; a generous cap just protects
  // against a future story being extremely long.
  const PER_CHAR_MS = 68.4;
  const totalTypeMs = Math.min(Math.max(allChars.length * PER_CHAR_MS, 900), 240000);
  const perCharMs = totalTypeMs / allChars.length;
  const remainingMs = (allChars.length - resumeAt) * perCharMs;
  // everything up through the saved progress just appears instantly, no
  // typing flourish -- it already "happened" on a previous visit
  allChars.forEach((span, i) => {
    if (i < resumeAt){
      span.classList.add('revealed');
      return;
    }
    storyTypeTimeouts.push(setTimeout(() => {
      span.classList.add('revealed');
      currentStoryRevealed = i + 1;
      // only an occasional letter gets the bigger flourish while typing --
      // most just do the plain pop-in, so it reads as sparkle, not chaos
      if (Math.random() < 0.16){
        span.classList.toggle('al-rev', Math.random() < 0.5);   // twirl one way or the other
        if (span.dataset.tone === 'heavy'){
          span.classList.add('flip');
        } else {
          span.classList.add(HAPPY_CHAR_FX[Math.floor(Math.random() * HAPPY_CHAR_FX.length)]);
        }
      }
    }, (i - resumeAt) * perCharMs));
  });
  balloonWords.forEach(({ span, lastIndex, color }) => {
    // a word that had already finished typing on a previous visit doesn't
    // need to pop its balloon again
    if (lastIndex < resumeAt) return;
    storyTypeTimeouts.push(setTimeout(() => spawnLoveBalloon(span, color), (lastIndex - resumeAt) * perCharMs + perCharMs + 90));
  });
  storyTypeTimeouts.push(setTimeout(() => {
    storyTypingComplete = true;
    startStoryQuirks(allChars, balloonWords);
  }, remainingMs + 150));
}

/* two small, ongoing quirks once the story has finished typing -- both
   infrequent and limited to a couple of letters/one word at a time, so the
   text stays fully readable throughout:
   1) random letters take a quick 3D flip, like a flip-clock digit or a
      puzzle piece turning over, then settle right back into place
   2) every so often, one whole word gets "reconsidered" -- quietly
      backspaced and retyped, like a curious second thought */
function startStoryQuirks(allChars, balloonWords){
  // true only if the element is currently visible within the story body's
  // own scrollable viewport -- i.e. the part actually being read right now
  function isInReadingView(el){
    const bodyRect = storyBody.getBoundingClientRect();
    const elRect = el.getBoundingClientRect();
    return elRect.bottom > bodyRect.top + 6 && elRect.top < bodyRect.bottom - 6;
  }

  const scheduleFlip = () => {
    const delay = 1100 + Math.random() * 1400;
    storyTypeTimeouts.push(setTimeout(() => {
      const visible = allChars.filter(ch => ch.textContent.trim() && isInReadingView(ch));
      const count = Math.min(visible.length, 3 + Math.floor(Math.random() * 3));
      for (let i = 0; i < count; i++){
        const ch = visible[Math.floor(Math.random() * visible.length)];
        ch.classList.remove('flip', ...HAPPY_CHAR_FX);
        void ch.offsetWidth; // restart the animation even if one's still mid-play
        ch.classList.toggle('al-rev', Math.random() < 0.5);     // twirl one way or the other
        if (ch.dataset.tone === 'heavy'){
          ch.classList.add('flip');
        } else {
          ch.classList.add(HAPPY_CHAR_FX[Math.floor(Math.random() * HAPPY_CHAR_FX.length)]);
        }
      }
      scheduleFlip();
    }, delay));
  };

  const scheduleRetype = () => {
    const delay = 4800 + Math.random() * 3400;
    storyTypeTimeouts.push(setTimeout(() => {
      const words = [...storyBody.querySelectorAll('.story-word')]
        .filter(w => w.querySelectorAll('.story-char').length <= 9 && isInReadingView(w));
      if (words.length){
        const word = words[Math.floor(Math.random() * words.length)];
        if (word.dataset.tone === 'heavy'){
          const chars = [...word.querySelectorAll('.story-char')];
          // backspace, last letter first
          chars.slice().reverse().forEach((ch, i) => {
            storyTypeTimeouts.push(setTimeout(() => ch.classList.remove('revealed'), i * 45));
          });
          const eraseMs = chars.length * 45;
          // a curious little pause, then retype it back in
          storyTypeTimeouts.push(setTimeout(() => {
            chars.forEach((ch, i) => {
              storyTypeTimeouts.push(setTimeout(() => ch.classList.add('revealed'), i * 55));
            });
          }, eraseMs + 260));
        } else {
          // happy tone: no erasing -- just one warm little bounce on the whole word
          word.classList.remove('word-bounce-happy');
          void word.offsetWidth;
          word.classList.add('word-bounce-happy');
        }
      }
      scheduleRetype();
    }, delay));
  };

  // every 10 seconds after the story's done typing, pop another little
  // heart-balloon from one of its positive words -- picked from whichever
  // of those words are currently visible in the reading view, so the
  // hearts keep drifting up the whole time the story sits open
  const scheduleBalloonPop = () => {
    storyTypeTimeouts.push(setTimeout(() => {
      const visible = balloonWords.filter(({ span }) => span && span.isConnected && isInReadingView(span));
      if (visible.length){
        const pick = visible[Math.floor(Math.random() * visible.length)];
        spawnLoveBalloon(pick.span, pick.color);
      }
      scheduleBalloonPop();
    }, 10000));
  };

  scheduleFlip();
  scheduleRetype();
  scheduleBalloonPop();
}

// lights the small header cover with a triple-colored glow pulled from that
// album's own extracted palette (the same palette the room's spotlight beams
// use), so the glow always matches the art on screen rather than being a
// fixed color. This just stores the colors -- the actual animating happens
// in the requestAnimationFrame loop below, so updating these mid-loop (e.g.
// browsing to a different album while a story sits open) just changes what
// color the very next frame paints, with nothing to restart.
let storyGlowColors = ['rgba(255,255,255,0.3)', 'rgba(255,255,255,0.3)', 'rgba(255,255,255,0.3)'];
function applyStoryCoverGlow(i){
  const rel = releases[i];
  const fallbackPair = rel.gradient ? [rel.gradient[0], rel.gradient[1]] : ['#3d7fe0', '#173a7a'];
  const palette = (albumColors[i] || fallbackPair).map(vividizeColor);
  const c1 = palette[0];
  const c2 = palette[1] || palette[0];
  const c3 = palette[2] || palette[1] || palette[0];
  storyGlowColors = [toGlowRgba(c1, 0.55), toGlowRgba(c2, 0.55), toGlowRgba(c3, 0.55)];
}

/* the small story cover's breathing scale + colored glow, driven by a single
   requestAnimationFrame loop rather than CSS @keyframes. Every frame reads
   real elapsed time (performance.now() minus a start timestamp) and computes
   fresh transform/box-shadow values directly from it -- there's no internal
   "animation timeline" that a backgrounded tab, a paused renderer, or a
   class-toggle race can leave stuck partway through. Whatever the browser
   was doing a second ago, the very next frame just asks "what time is it"
   and paints the mathematically correct frame for right now. This replaced
   an earlier CSS-animation version that kept reportedly stalling after the
   first story view in some browsers. */
let storyCoverRAF = null;
let storyCoverAnimStart = 0;
const STORY_BREATHE_MS = 3500; // one full swell-and-settle cycle
const STORY_GLOW_MS = 12000;   // one full color-intensity cycle
function storyCoverAnimFrame(now){
  const t = now - storyCoverAnimStart;

  const breathePhase = (t % STORY_BREATHE_MS) / STORY_BREATHE_MS;
  const breatheEase = 0.5 - 0.5 * Math.cos(breathePhase * Math.PI * 2); // 0..1..0
  const scale = 1 + 0.22 * breatheEase;
  storyCoverArt.style.transform = `scale(${scale})`;

  const glowPhase = (t % STORY_GLOW_MS) / STORY_GLOW_MS;
  const glowEase = 0.5 - 0.5 * Math.cos(glowPhase * Math.PI * 2); // 0..1..0
  const blur = 12 + 16 * glowEase;
  const spread = 7 * glowEase;
  const off = 1 + 0.55 * glowEase;
  const [c1, c2, c3] = storyGlowColors;
  storyCover.style.boxShadow =
    `${(-7 * off).toFixed(1)}px ${(-5 * off).toFixed(1)}px ${blur.toFixed(1)}px ${spread.toFixed(1)}px ${c1}, ` +
    `${(7 * off).toFixed(1)}px ${(3 * off).toFixed(1)}px ${blur.toFixed(1)}px ${spread.toFixed(1)}px ${c2}, ` +
    `0px ${(9 * off).toFixed(1)}px ${blur.toFixed(1)}px ${spread.toFixed(1)}px ${c3}`;

}
function startStoryCoverAnim(){
  if (storyCoverRAF) return; // already running -- let it keep its own timeline
  storyCoverAnimStart = performance.now();
  storyCoverRAF = requestAnimationFrame(storyCoverAnimFrame);
}
function stopStoryCoverAnim(){
  if (storyCoverRAF) cancelAnimationFrame(storyCoverRAF);
  storyCoverRAF = null;
}

// the same year / type / song count / time line the album view already
// builds (see renderInfo) -- reused here so the story opens with that
// context up top before your own words start
function buildStoryMetaLine(rel){
  const totalSecs = rel.tracks.reduce((sum, t) => sum + parseDuration(t.duration), 0);
  const trackWord = rel.tracks.length === 1 ? 'song' : 'songs';
  // AL year · Song/Double/Triple/Album · the length in words -- all in Al's font
  const parts = [alYear(rel.year), alTypeWord(rel)];
  if (rel.tracks.length >= 4) parts.push(rel.tracks.length + ' Songs');
  parts.push(alLengthWords(totalSecs));
  return parts.map(x => '<span class="al-meta-part">' + alHandText(x) + '</span>').join('<span class="al-meta-dot">&middot;</span>');
}

function fitStoryTitle(){
  const el = storyAlbum;
  if (!el || !storyOverlay.classList.contains('open')) return;
  const avail = el.clientWidth;
  if (!avail) return;
  el.style.whiteSpace = 'nowrap';
  const maxSize = Math.max(28, Math.min(170, avail * 0.22, window.innerHeight * 0.14));
  let size = maxSize;
  el.style.fontSize = size + 'px';
  const inner = el.querySelector(':scope > .al-fit') || el;
  for (let pass = 0; pass < 8; pass++){
    const w = inner.scrollWidth || inner.offsetWidth;
    const target = avail * 0.92;
    if (w <= target) break;
    size = Math.max(26, Math.floor(size * (target / w)));
    el.style.fontSize = size + 'px';
    if (size <= 26) break;
  }
  // a really long name gets to wrap instead of shrinking into nothing
  const w2 = inner.scrollWidth || inner.offsetWidth;
  if (w2 > avail) el.style.whiteSpace = 'normal';

/* ---------- swipe between stories while one is open ----------
   swipe left = the next story, swipe right = the one before (the same
   direction the cover wheel goes). Left / right arrow keys do the same on a
   computer. The cover wheel quietly follows along, so closing the story lands
   on the album you were just reading. */
let storySwapBusy = false;
function storyNeighbor(dir){
  for (let i = storyRelIdx + dir; i >= 0 && i < releases.length; i += dir){
    if (releases[i] && releases[i].story) return i;
  }
  return -1;
}
/* ---------- cover-flow motion for swiping between stories and keys ----------
   the page is a card in a 3D cover flow: as you drag, it slides with your
   finger and turns away in depth, shrinking and dimming a little; let go and
   it flies off around the curve while the next one swings in from the other
   side and settles softly into place */
function alFlowPoseFrames(f){
  const w = window.innerWidth || 400;
  const a = Math.max(-1.2, Math.min(1.2, f));
  return {
    translate: (a * w * 0.92).toFixed(1) + 'px 0 ' + (-Math.abs(a) * 260).toFixed(1) + 'px',
    rotate: 'y ' + (-a * 58).toFixed(2) + 'deg',
    scale: String((1 - Math.min(1, Math.abs(a)) * 0.2).toFixed(3)),
    opacity: String(Math.max(0, 1 - Math.abs(a) * 0.75).toFixed(3))
  };
}
function alFlowSetPose(el, f){
  const p = alFlowPoseFrames(f);
  el.style.translate = p.translate; el.style.rotate = p.rotate; el.style.scale = p.scale; el.style.opacity = p.opacity;
}
function alFlowClear(el){ el.style.translate = ''; el.style.rotate = ''; el.style.scale = ''; el.style.opacity = ''; }
function alFlowCurrentF(el){
  const w = window.innerWidth || 400;
  const m = /^(-?[\d.]+)px/.exec(el.style.translate || '');
  return m ? parseFloat(m[1]) / (w * 0.92) : 0;
}
// fly the current page off toward -dir, swap the content, swing the next one in
function alFlowSwap(el, dir, swapContent){
  const f0 = alFlowCurrentF(el);
  alFlowClear(el);
  const outMs = Math.round(230 + 170 * (1 - Math.min(1, Math.abs(f0))));
  const out = el.animate([alFlowPoseFrames(f0), alFlowPoseFrames(-dir * 1.15)],
    { duration:outMs, easing:'cubic-bezier(0.4, 0, 0.9, 0.6)', fill:'forwards' });
  setTimeout(() => {
    try { swapContent(); } finally {
      out.cancel();
      el.animate([alFlowPoseFrames(dir * 1.05), alFlowPoseFrames(dir * 0.12), alFlowPoseFrames(0)],
        { duration:820, easing:'cubic-bezier(0.16, 1, 0.3, 1)', offsets:undefined });
    }
  }, outMs);
  return outMs + 300;
}
// let go without switching: glide softly back to the middle
function alFlowSpringBack(el){
  const f0 = alFlowCurrentF(el);
  alFlowClear(el);
  if (Math.abs(f0) > 0.001) el.animate([alFlowPoseFrames(f0), alFlowPoseFrames(0)], { duration:520, easing:'cubic-bezier(0.22, 1.25, 0.36, 1)' });
}
function swapStory(dir){
  if (storySwapBusy || !storyOverlay.classList.contains('open')) return;
  const next = storyNeighbor(dir);
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (next === -1){
    // the very first or last story: a soft little nudge instead
    if (!reduce){ if (alFlowCurrentF(storyBody)) alFlowSpringBack(storyBody); else storyBody.animate([alFlowPoseFrames(0), alFlowPoseFrames(-dir * 0.08), alFlowPoseFrames(0)], { duration:520, easing:'cubic-bezier(0.22, 1, 0.36, 1)' }); }
    return;
  }
  storySwapBusy = true;
  // the wheel behind follows along
  try {
    if (fsOverlay && fsOverlay.classList.contains('open')){ fsVelocity = 0; fsTargetPos = next; }
    else { velocity = 0; targetPos = next; }
  } catch(e){}
  if (reduce){ alFlowClear(storyBody); openStory(next); storySwapBusy = false; return; }
  const ms = alFlowSwap(storyBody, dir, () => openStory(next));
  setTimeout(() => { storySwapBusy = false; }, ms);
}
/* ---------- a sturdy sideways swipe for phones ----------
   watches the finger the whole way: once it's clearly moving sideways the
   page is held still (so the browser doesn't turn it into a scroll and cancel
   the touch), and even a cancelled touch still counts from its last spot */
function alAttachSwipe(el, onSwipe, follow){
  // follow: an element that slides along with the finger / mouse while dragging,
  // so you can see the swipe catching before you let go
  let sx = 0, sy = 0, lx = 0, ly = 0, st = 0, tracking = false, sideways = false, mouse = false;
  let vx = 0, lt = 0;
  const slide = (dx) => {
    if (!follow || !sideways) return;
    const w = window.innerWidth || 400;
    alFlowSetPose(follow, dx / (w * 0.92));
  };
  const begin = (x, y, isMouse) => { tracking = true; sideways = false; mouse = isMouse; sx = lx = x; sy = ly = y; st = Date.now(); vx = 0; lt = 0; };
  const move = (x, y) => {
    const now = performance.now();
    if (lt) vx = vx * 0.6 + 0.4 * ((x - lx) / Math.max(1, now - lt));   // px per ms, smoothed
    lt = now;
    lx = x; ly = y;
    const dx = lx - sx, dy = ly - sy;
    if (!sideways && Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy) * 1.1) sideways = true;
    if (Math.hypot(dx, dy) > 8) el._alDraggedAt = Date.now();     // a drag, not a tap
    slide(dx);
  };
  const finish = (x, y) => {
    if (!tracking) return; tracking = false;
    const dx = x - sx, dy = y - sy;
    if (Math.hypot(dx, dy) > 8) el._alDraggedAt = Date.now();
    const wasSideways = sideways; sideways = false;
    const w = window.innerWidth || 400;
    // a quick flick counts even if short; a slow drag needs to pass about a fifth of the screen
    const flick = Math.abs(vx) > 0.45 && Math.abs(dx) > 24 && Math.sign(vx) === Math.sign(dx);
    const go = (Math.abs(dx) > Math.min(w * 0.2, 130) || flick) && Math.abs(dx) > Math.abs(dy) * 1.2;
    if (go) onSwipe(dx < 0 ? 1 : -1);
    else if (follow && wasSideways) alFlowSpringBack(follow);
    else if (follow) alFlowClear(follow);
  };
  // fingers
  el.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1){ tracking = false; return; }
    begin(e.touches[0].clientX, e.touches[0].clientY, false);
  }, { passive:true });
  el.addEventListener('touchmove', (e) => {
    if (!tracking || mouse || e.touches.length !== 1) return;
    move(e.touches[0].clientX, e.touches[0].clientY);
    if (sideways && e.cancelable) e.preventDefault();
  }, { passive:false });
  el.addEventListener('touchend', (e) => {
    if (mouse) return;
    const t = e.changedTouches && e.changedTouches[0];
    finish(t ? t.clientX : lx, t ? t.clientY : ly);

  el.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    if (e.sourceCapabilities && e.sourceCapabilities.firesTouchEvents) return;   // a phone's pretend mouse
    begin(e.clientX, e.clientY, true);
  });
  window.addEventListener('mousemove', (e) => {
    if (!tracking || !mouse) return;
    move(e.clientX, e.clientY);
    if (sideways){ e.preventDefault(); if (window.getSelection) try { window.getSelection().removeAllRanges(); } catch(err){} }
  });
  window.addEventListener('mouseup', (e) => { if (tracking && mouse) finish(e.clientX, e.clientY); });
}

function alJustDragged(el){ return el && el._alDraggedAt && Date.now() - el._alDraggedAt < 400; }

function fsFitTrackNameSize(text){
  // never taller than a row of the song list (112px apart), so neighbouring songs can't crowd each other

    if (fsFitCtx.measureText(text).width <= maxWidth) break;
    size -= 2;
  }
  return Math.max(minSize, size);
}

/* ---------- the song name, every so often, very slowly swells bigger like
   it's under a magnifying glass while its colors get richer, more vivid and
   drift through new hues -- then settles gently back ---------- */
(function(){

    requestAnimationFrame(frame);

  const rel = releases[fsNamesRelIdx];

  const fallbackPair = rel.gradient ? [rel.gradient[0], rel.gradient[1]] : ['#ff7ac8', '#7ad7ff'];
  let cols = albumColors[fsNamesRelIdx] || fallbackPair;
  if (!Array.isArray(cols)) cols = [cols];
  cols = cols.filter(Boolean);

  const key = fsNamesRelIdx + ':' + cols.join(',');

  fsNamesColorKey = key;
  const pick = k => {
    try { return toGlowRgba(vividizeColor(cols[k % cols.length]), 1); } catch(e){ return cols[k % cols.length]; }

  for (let k = 0; k < 4; k++) fsTrackListViewport.style.setProperty('--fsn' + (k + 1), pick(k));

      if (moving && hasList) lastMove = now;
