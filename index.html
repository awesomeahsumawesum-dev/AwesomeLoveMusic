    } else if (fsOverlay && fsOverlay.classList.contains('fs-choosing')){
      fsOverlay.classList.remove('fs-choosing');
      lastPos = null;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

/* ---------- physics for the fullscreen strip: same spring/friction feel as the main flow ---------- */
let fsFlowPos = 0;
let fsVelocity = 0;
let fsTargetPos = null;
let fsIsDragging = false;
let fsDragStartX = 0, fsDragStartPos = 0, fsLastX = 0, fsLastT = 0, fsPxVelocity = 0, fsCoverStepPx = 300;
let fsRafActive = false;

function getFsCoverStepPx(){
  const el = fsMiniCovers[0];
  const w = el ? el.getBoundingClientRect().width : 300;
  return w * 1.08; // matches the 108% spacing used in layoutFsAt
}

let fsCenterGlowIdx = -1;
function setFsCenterGlow(idx){
  if (idx === fsCenterGlowIdx) return;
  fsCenterGlowIdx = idx;
  const rel = releases[idx];
  if (!rel) return;
  const fallbackPair = rel.gradient ? [rel.gradient[0], rel.gradient[1]] : ['#3d7fe0', '#173a7a'];
  const colors = albumColors[idx] || fallbackPair;
  const [c1, c2, c3, c4] = Array.isArray(colors)
    ? [colors[0], colors[1] || colors[0], colors[2] || colors[1] || colors[0], colors[3] || colors[2] || colors[1] || colors[0]]
    : [colors, colors, colors, colors];
  fsOverlay.style.setProperty('--center-glow-bright', toGlowRgba(c1, 0.85));
  fsOverlay.style.setProperty('--center-glow-mid', toGlowRgba(c2, 0.42));
  if (fsGlow){
    fsGlow.style.setProperty('--beam-bright', toGlowRgba(c1, 0.88));
    fsGlow.style.setProperty('--beam-mid', toGlowRgba(c2, 0.46));
  }
  // the strobe rig's four beams, lit directly from this cover's own palette
  fsOverlay.style.setProperty('--strobe-c1', toGlowRgba(vividizeColor(c1), 0.95));
  fsOverlay.style.setProperty('--strobe-c2', toGlowRgba(vividizeColor(c2), 0.95));
  fsOverlay.style.setProperty('--strobe-c3', toGlowRgba(vividizeColor(c3), 0.95));
  fsOverlay.style.setProperty('--strobe-c4', toGlowRgba(vividizeColor(c4), 0.95));
}

function layoutFsAt(pos){
  fsMiniCovers.forEach((el, i) => {
    const offset = i - pos;
    const abs = Math.abs(offset);
    el.style.transform = `translate(-50%,-50%) translateX(${offset * 108}%)`;
    el.style.opacity = abs > 3.5 ? '0' : String(Math.max(0.35, 1 - abs * 0.42));
    el.style.zIndex = String(Math.round(100 - abs * 10));
    el.style.pointerEvents = abs > 3.5 ? 'none' : 'auto';
    const centered = abs < 0.5;
    if (centered && !el.classList.contains('fs-centered')){
      // each time a cover comes to the center it randomly picks which way its
      // twirls go first -- and every cycle after that turns the other way around
      const art = el.querySelector('.fs-mini-art');
      if (art) art.style.setProperty('--al-twirl-dir', Math.random() < 0.5 ? 'alternate' : 'alternate-reverse');
    }
    el.classList.toggle('fs-centered', centered);
  });
  setFsCenterGlow(Math.round(pos));
}

/* ---------- physics for the vertical tracklist: same spring/friction feel, just up-and-down ---------- */
const FS_TRACK_ROW_PX = 112;
let fsTrackFlowPos = 0;
let fsTrackVelocity = 0;
let fsTrackTargetPos = null;
let fsTrackIsDragging = false;
let fsTrackDragStartY = 0, fsTrackDragStartPos = 0, fsTrackLastY = 0, fsTrackLastT = 0, fsTrackPxVelocity = 0;

function fsTrackMaxIdx(){
  const rel = releases[fsViewIdx];
  return (rel && rel.tracks && rel.tracks.length) ? rel.tracks.length - 1 : 0;
}

function layoutTrackListAt(pos){
  fsTrackNameEls.forEach((el, i) => {
    const offset = i - pos;
    const abs = Math.abs(offset);
    const scale = Math.max(0.6, 1 - abs * 0.24);
    el.style.transform = `translate(-50%,-50%) translateY(${offset * FS_TRACK_ROW_PX}px) scale(${scale})`;
    el.style.opacity = abs > 3 ? '0' : String(Math.max(0, 1 - abs * 0.4));
    el.style.fontWeight = abs < 0.5 ? '700' : '600';
    el.style.zIndex = String(Math.round(100 - abs * 10));
  });
}

/* whichever track we land on when an album becomes centered: keep following
   playback if this is the playing album, otherwise start at track 1 */
function fsDefaultTrackIdxFor(relIdx){
  return relIdx === nowPlayingRelIdx() ? nowPlayingTrackIdx() : 0;
}

/* ---------- track title always fades 2 seconds after the last time you touched
   it -- browsing, playing, or pausing all count, it just needs to sit idle ---------- */
let fsTextFadeTimer = null;
function fsRevealText(){
  clearTimeout(fsTextFadeTimer);
  fsText.style.opacity = '1';
  fsTextFadeTimer = setTimeout(() => { fsText.style.opacity = '0'; }, 2000);
  fsRevealClose(); // any interaction that wakes the title also wakes the close button
}
function fsScheduleTextFade(delay){
  clearTimeout(fsTextFadeTimer);
  fsTextFadeTimer = setTimeout(() => { fsText.style.opacity = '0'; }, delay || 2000);
}

/* ---------- the fullscreen close (X) button fades to a faint, blurred whisper
   after 6 seconds of no interaction, so it doesn't compete with the artwork --
   it's still fully tappable while faded, just visually out of the way. Any
   tap/click/drag anywhere in the fullscreen view brings it right back. ---------- */
let fsCloseFadeTimer = null;
function fsRevealClose(){
  clearTimeout(fsCloseFadeTimer);
  fsClose.classList.remove('faded');
  fsCloseFadeTimer = setTimeout(() => fsClose.classList.add('faded'), 6000);
}

function fsSyncNearest(){
  const n = Math.max(0, Math.min(MAX_IDX, Math.round(fsFlowPos)));
  if (n === fsViewIdx) return;
  fsViewIdx = n;
  buildFsTrackList(n);
  // a new album's tracklist is a different list entirely, so land on the
  // right song immediately rather than gliding over from the old position
  fsViewTrackIdx = fsDefaultTrackIdxFor(n);
  fsTrackFlowPos = fsViewTrackIdx;
  fsTrackTargetPos = null;
  fsTrackVelocity = 0;
  layoutTrackListAt(fsTrackFlowPos);
  playRolodexClick();
  renderFullscreenNow();
}

function fsTrackSyncNearest(){
  const n = Math.max(0, Math.min(fsTrackMaxIdx(), Math.round(fsTrackFlowPos)));
  if (n === fsViewTrackIdx) return;
  fsViewTrackIdx = n;
  playRolodexClick();
  fsRevealText();
  renderFullscreenNow();
}

function fsTick(){
  if (!fsIsDragging){
    if (fsTargetPos !== null){
      const diff = fsTargetPos - fsFlowPos;
      fsFlowPos += diff * SPRING;
      if (Math.abs(diff) < 0.002){ fsFlowPos = fsTargetPos; fsTargetPos = null; }
    } else if (Math.abs(fsVelocity) > 0.0004){
      fsFlowPos += fsVelocity;
      fsVelocity *= FRICTION;
      if (fsFlowPos <= 0 || fsFlowPos >= MAX_IDX){
        fsFlowPos = Math.max(0, Math.min(MAX_IDX, fsFlowPos));
        fsVelocity = 0;
        fsTargetPos = Math.round(fsFlowPos);
      } else if (Math.abs(fsVelocity) < 0.006){
        fsVelocity = 0;
        fsTargetPos = Math.round(fsFlowPos);
      }
    }
  }
  layoutFsAt(fsFlowPos);
  fsSyncNearest();

  const trackMax = fsTrackMaxIdx();
  if (!fsTrackIsDragging){
    if (fsTrackTargetPos !== null){
      const diff = fsTrackTargetPos - fsTrackFlowPos;
      fsTrackFlowPos += diff * SPRING;
      if (Math.abs(diff) < 0.002){ fsTrackFlowPos = fsTrackTargetPos; fsTrackTargetPos = null; }
    } else if (Math.abs(fsTrackVelocity) > 0.0004){
      fsTrackFlowPos += fsTrackVelocity;
      fsTrackVelocity *= FRICTION;
      if (fsTrackFlowPos <= 0 || fsTrackFlowPos >= trackMax){
        fsTrackFlowPos = Math.max(0, Math.min(trackMax, fsTrackFlowPos));
        fsTrackVelocity = 0;
        fsTrackTargetPos = Math.round(fsTrackFlowPos);
      } else if (Math.abs(fsTrackVelocity) < 0.006){
        fsTrackVelocity = 0;
        fsTrackTargetPos = Math.round(fsTrackFlowPos);
      }
    }
  }
  layoutTrackListAt(fsTrackFlowPos);
  fsTrackSyncNearest();

  if (fsOverlay.classList.contains('open')){
    requestAnimationFrame(fsTick);
  } else {
    fsRafActive = false;
  }
}
function startFsTick(){
  if (fsRafActive) return;
  fsRafActive = true;
  requestAnimationFrame(fsTick);
}

function onFsDragStart(clientX){
  fsIsDragging = true;
  fsTargetPos = null;
  fsVelocity = 0;
  fsDragStartX = clientX;
  fsDragStartPos = fsFlowPos;
  fsLastX = clientX;
  fsLastT = performance.now();
  fsPxVelocity = 0;
  fsCoverStepPx = getFsCoverStepPx();
  fsCoverScroll.classList.add('grabbing');
}
function onFsDragMove(clientX){
  if (!fsIsDragging) return;
  const now = performance.now();
  const dt = now - fsLastT;
  if (dt > 0){ fsPxVelocity = (clientX - fsLastX) / dt; fsLastX = clientX; fsLastT = now; }
  const dx = clientX - fsDragStartX;
  let p = fsDragStartPos - dx / fsCoverStepPx;
  if (p < 0) p = p * 0.3;
  if (p > MAX_IDX) p = MAX_IDX + (p - MAX_IDX) * 0.3;
  fsFlowPos = p;
}
function onFsDragEnd(clientX){
  if (!fsIsDragging) return;
  fsIsDragging = false;
  fsCoverScroll.classList.remove('grabbing');
  fsFlowPos = Math.max(0, Math.min(MAX_IDX, fsFlowPos));
  const totalMoved = Math.abs(clientX - fsDragStartX);
  if (totalMoved < 6){
    fsTargetPos = Math.round(fsFlowPos);
    return;
  }
  fsVelocity = -(fsPxVelocity * 16.7) / fsCoverStepPx;
  if (Math.abs(fsVelocity) < 0.008){ fsVelocity = 0; fsTargetPos = Math.round(fsFlowPos); }
}

function onFsTrackDragStart(clientY){
  fsRevealText();
  fsTrackIsDragging = true;
  fsTrackTargetPos = null;
  fsTrackVelocity = 0;
  fsTrackDragStartY = clientY;
  fsTrackDragStartPos = fsTrackFlowPos;
  fsTrackLastY = clientY;
  fsTrackLastT = performance.now();
  fsTrackPxVelocity = 0;
  fsTrackListViewport.classList.add('grabbing');
}
function onFsTrackDragMove(clientY){
  if (!fsTrackIsDragging) return;
  const now = performance.now();
  const dt = now - fsTrackLastT;
  if (dt > 0){ fsTrackPxVelocity = (clientY - fsTrackLastY) / dt; fsTrackLastY = clientY; fsTrackLastT = now; }
  const dy = clientY - fsTrackDragStartY;
  const maxIdx = fsTrackMaxIdx();
  let p = fsTrackDragStartPos - dy / FS_TRACK_ROW_PX;
  if (p < 0) p = p * 0.3;
  if (p > maxIdx) p = maxIdx + (p - maxIdx) * 0.3;
  fsTrackFlowPos = p;
}
function onFsTrackDragEnd(clientY){
  if (!fsTrackIsDragging) return;
  fsTrackIsDragging = false;
  fsTrackListViewport.classList.remove('grabbing');
  const maxIdx = fsTrackMaxIdx();
  fsTrackFlowPos = Math.max(0, Math.min(maxIdx, fsTrackFlowPos));
  const totalMoved = Math.abs(clientY - fsTrackDragStartY);
  if (totalMoved < 6){
    fsTrackTargetPos = Math.round(fsTrackFlowPos);
    return;
  }
  fsTrackVelocity = -(fsTrackPxVelocity * 16.7) / FS_TRACK_ROW_PX;
  if (Math.abs(fsTrackVelocity) < 0.008){ fsTrackVelocity = 0; fsTrackTargetPos = Math.round(fsTrackFlowPos); }
}

/* ---------- gestures over the cover strip: first few px of movement decide whether
   this is a horizontal album-browse or a vertical track-browse, then that mode
   owns the rest of the gesture. Pointer events cover mouse, touch, and pen alike. ---------- */
let fsPointerActive = false;
let fsPointerMode = null; // null (down, undecided) | 'h' | 'v'
let fsPointerStartX = 0, fsPointerStartY = 0;

fsCoverScroll.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  fsPointerActive = true;
  fsPointerMode = null;
  fsPointerStartX = e.clientX;
  fsPointerStartY = e.clientY;
  trailInited = false;
  try { fsCoverScroll.setPointerCapture(e.pointerId); } catch(err){}
});
fsCoverScroll.addEventListener('pointermove', (e) => {
  if (!fsPointerActive) return;
  if (fsPointerMode === null){
    const dx = e.clientX - fsPointerStartX;
    const dy = e.clientY - fsPointerStartY;
    if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
    fsPointerMode = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
    if (fsPointerMode === 'h') onFsDragStart(fsPointerStartX); else onFsTrackDragStart(fsPointerStartY);
  }
  if (fsPointerMode === 'h'){
    onFsDragMove(e.clientX);
    maybeSpawnTrailHeart(e.clientX, e.clientY);
  } else if (fsPointerMode === 'v'){
    onFsTrackDragMove(e.clientY);
    maybeSpawnTrailHeart(e.clientX, e.clientY);
  }
});
function endFsCoverPointer(e){
  if (!fsPointerActive) return;
  fsPointerActive = false;
  if (fsPointerMode === 'h') onFsDragEnd(e.clientX);
  else if (fsPointerMode === 'v') onFsTrackDragEnd(e.clientY);
  fsPointerMode = null;
}
fsCoverScroll.addEventListener('pointerup', endFsCoverPointer);
fsCoverScroll.addEventListener('pointercancel', endFsCoverPointer);

/* tap the front-and-center cover to play/pause it; tap any other cover to bring
   it to center first (that alone doesn't start playback) */
fsCoverScroll.addEventListener('click', (e) => {
  const dist = Math.hypot(e.clientX - fsPointerStartX, e.clientY - fsPointerStartY);
  if (dist > 6) return;
  const hit = document.elementFromPoint(e.clientX, e.clientY);
  const wrap = hit ? hit.closest('.fs-mini-cover') : null;
  if (!wrap) return;
  const idx = parseInt(wrap.dataset.index);
  if (idx === fsViewIdx && fsOverlay.classList.contains('al-select')){
    alPageTurnBackSound();         // tap the blurred cover: the whoosh back...
    closeFullscreen();             // ...home, nothing changed
  } else if (idx === fsViewIdx){
    if (fsViewIdx === nowPlayingRelIdx() && fsViewTrackIdx === nowPlayingTrackIdx()){
      togglePlay();
      renderFullscreenNow();
      fsRevealText();
    } else {
      playTrack(fsViewIdx, fsViewTrackIdx);
    }
  } else {
    fsTargetPos = idx;
    fsVelocity = 0;
  }
});

/* trackpad / wheel, anywhere in the fullscreen view (the album art, the title,
   the controls -- all of it): horizontal continuously browses albums, vertical
   continuously browses tracks */
let fsWheelSnapTimer = null;
let fsTrackWheelSnapTimer = null;
fsOverlay.addEventListener('wheel', (e) => {
  e.preventDefault();
  if (Math.abs(e.deltaX) >= Math.abs(e.deltaY)){
    fsTargetPos = null;
    fsVelocity = 0;
    fsFlowPos = Math.max(0, Math.min(MAX_IDX, fsFlowPos + e.deltaX / 220));
    clearTimeout(fsWheelSnapTimer);
    fsWheelSnapTimer = setTimeout(() => { fsTargetPos = Math.round(fsFlowPos); }, 120);
  } else {
    fsRevealText();
    fsTrackTargetPos = null;
    fsTrackVelocity = 0;
    const maxIdx = fsTrackMaxIdx();
    fsTrackFlowPos = Math.max(0, Math.min(maxIdx, fsTrackFlowPos + e.deltaY / 90));
    clearTimeout(fsTrackWheelSnapTimer);
    fsTrackWheelSnapTimer = setTimeout(() => { fsTrackTargetPos = Math.round(fsTrackFlowPos); }, 120);
  }
}, { passive:false });

/* drag anywhere else in the fullscreen view (over the title, etc) also browses --
   vertical drags flip through tracks, horizontal drags flip through albums, same
   as dragging directly on the cover strip. Skipped over the cover strip itself
   and the bottom controls, since those are already handled separately. */
let fsContentPointerActive = false;
let fsContentPointerMode = null; // null (undecided) | 'v' | 'h'
let fsContentPointerStartX = 0, fsContentPointerStartY = 0;
let fsContentPointerOnTrackList = false;

fsContent.addEventListener('pointerdown', (e) => {
  if (e.target.closest('.fs-cover-scroll, .fs-bottom-controls')) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  fsContentPointerActive = true;
  fsContentPointerMode = null;
  fsContentPointerStartX = e.clientX;
  fsContentPointerStartY = e.clientY;
  fsContentPointerOnTrackList = !!e.target.closest('.fs-track-list-viewport');
  try { fsContent.setPointerCapture(e.pointerId); } catch(err){}
});
fsContent.addEventListener('pointermove', (e) => {
  if (!fsContentPointerActive) return;
  if (fsContentPointerMode === null){
    const dx = e.clientX - fsContentPointerStartX;
    const dy = e.clientY - fsContentPointerStartY;
    if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
    fsContentPointerMode = Math.abs(dy) >= Math.abs(dx) ? 'v' : 'h';
    if (fsContentPointerMode === 'v') onFsTrackDragStart(fsContentPointerStartY);
    else onFsDragStart(fsContentPointerStartX);
  }
  if (fsContentPointerMode === 'v') onFsTrackDragMove(e.clientY);
  else if (fsContentPointerMode === 'h') onFsDragMove(e.clientX);
});
/* tap the song title / track list to play or pause whatever is centered there --
   handled here directly (rather than a separate "click" listener) because
   fsContent's pointer capture retargets click events away from its children,
   so a listener on the track list itself would silently never fire */
function endFsContentPointer(e){
  if (!fsContentPointerActive) return;
  fsContentPointerActive = false;
  if (fsContentPointerMode === 'v') onFsTrackDragEnd(e.clientY);
  else if (fsContentPointerMode === 'h') onFsDragEnd(e.clientX);
  else if (fsContentPointerMode === null && fsContentPointerOnTrackList && fsOverlay.classList.contains('al-select')){
    // choosing from the ALBUM selection: play the song you tapped (or keep the one
    // already playing) and glide back home
    const same = fsViewIdx === nowPlayingRelIdx() && fsViewTrackIdx === nowPlayingTrackIdx();
    if (!(same && isPlaying)) { if (same) togglePlay(); else playTrack(fsViewIdx, fsViewTrackIdx); }
    setTimeout(closeFullscreen, 380);
  }
  else if (fsContentPointerMode === null && fsContentPointerOnTrackList){
    if (fsViewIdx === nowPlayingRelIdx() && fsViewTrackIdx === nowPlayingTrackIdx()){
      togglePlay();
      renderFullscreenNow();
      fsRevealText();
    } else {
      playTrack(fsViewIdx, fsViewTrackIdx);
    }
  }
  fsContentPointerMode = null;
}
fsContent.addEventListener('pointerup', endFsContentPointer);
fsContent.addEventListener('pointercancel', endFsContentPointer);

function renderFullscreenNow(){
  const relIdx = fsViewIdx;
  const rel = releases[relIdx];

  if (rel.cover){
    fsBg.style.background = '';
    fsBg.style.backgroundImage = `url("${rel.cover}")`;
  } else {
    fsBg.style.backgroundImage = 'none';
    fsBg.style.background = `linear-gradient(155deg, ${rel.gradient[0]}, ${rel.gradient[1]})`;
  }
}

let fsEntranceCleanupTimer = null;
let fsFlyerEl = null;

/* ---------- shared native browser-fullscreen + orientation helpers --
   used both by the rotate-to-fullscreen handler below and by
   closeFullscreen() itself, so that closing the fullscreen view (tap X,
   Escape) while the phone is still physically sideways also drops any real
   browser fullscreen and, where the platform allows it, snaps the page
   back to portrait rather than leaving it stranded in landscape. ---------- */
function requestNativeFullscreen(){
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
  if (req){ try { req.call(el); } catch(e){} }
}
function exitNativeFullscreen(){
  const isFs = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
  if (!isFs) return;
  const exit = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
  if (exit){ try { exit.call(document); } catch(e){} }
}
function isLandscapeNow(){
  return !!(window.matchMedia && window.matchMedia('(orientation: landscape)').matches);
}
// screen.orientation.lock() only actually works on a handful of browsers
// (mainly Android Chrome, and usually only while in real fullscreen), and
// isn't supported at all on iOS Safari -- there's no way for a webpage to
// force an iPhone to physically rotate. Where it IS supported though, this
// snaps the rendered page back to portrait immediately instead of waiting
// for the person to turn their phone, then releases the lock shortly after
// so a genuine rotation later still works normally.
function tryReturnToPortrait(){
  exitNativeFullscreen();
  if (!(screen && screen.orientation && screen.orientation.lock)) return;
  try {
    const p = screen.orientation.lock('portrait');
    if (p && typeof p.then === 'function'){
      p.then(() => { setTimeout(() => { try { screen.orientation.unlock(); } catch(e){} }, 600); })
       .catch(() => {});
    }
  } catch(e){}
}

function openFullscreen(overrideIdx){
  fsRevealClose(); // start every visit to fullscreen with the close button fully visible
  if (!fsMiniCovers.length) buildFsCoverScroll();
  // land on whatever you're currently looking at in the main coverflow -- not
  // necessarily whatever else happens to be playing in the background --
  // unless a specific album was explicitly requested (e.g. a shared song link)
  fsViewIdx = (overrideIdx !== undefined && overrideIdx !== null) ? overrideIdx : (activeIndex !== -1 ? activeIndex : 0);
  buildFsTrackList(fsViewIdx);
  fsViewTrackIdx = fsDefaultTrackIdxFor(fsViewIdx);
  fsFlowPos = fsViewIdx;
  fsTargetPos = null;
  fsVelocity = 0;
  fsTrackFlowPos = fsViewTrackIdx;
  fsTrackTargetPos = null;
  fsTrackVelocity = 0;
  renderFullscreenNow();
  // keep the title hidden through the entrance animation so the flying cover
  // gets full attention -- reveal it (if appropriate) only once that settles
  clearTimeout(fsTextFadeTimer);
  fsText.style.transition = 'none';
  fsText.style.opacity = '0';
  requestAnimationFrame(() => { fsText.style.transition = ''; });
  const alreadyPlayingThis = fsViewIdx === nowPlayingRelIdx() && fsViewTrackIdx === nowPlayingTrackIdx() && isPlaying;

  // the actual tapped cover art flies smoothly from wherever it's sitting on the
  // home screen into its fullscreen spot; everything else just fades in behind it
  const activeWrap = flow.children[fsViewIdx];
  const sourceArt = activeWrap ? activeWrap.querySelector('.cover-art') : null;

  clearTimeout(fsEntranceCleanupTimer);
  if (fsFlyerEl){ fsFlyerEl.remove(); fsFlyerEl = null; }

  fsOverlay.classList.add('open');
  layoutFsAt(fsFlowPos);
  layoutTrackListAt(fsTrackFlowPos);

  const destArt = fsMiniCovers[fsViewIdx] ? fsMiniCovers[fsViewIdx].querySelector('.fs-mini-art') : null;

  if (sourceArt && destArt && !fsOverlay.classList.contains('al-select')){
    const srcRect = sourceArt.getBoundingClientRect();
    const destRect = destArt.getBoundingClientRect();
    const flyer = document.createElement('div');
    flyer.className = 'fs-fly-cover';
    // only set one or the other -- setting the "background" shorthand to an
    // empty string after "backgroundImage" silently wipes it back out
    if (sourceArt.style.backgroundImage){
      flyer.style.backgroundImage = sourceArt.style.backgroundImage;
    } else if (sourceArt.style.background){
      flyer.style.background = sourceArt.style.background;
    }
    // sized and positioned at the FINAL (fullscreen) spot from the start...
    flyer.style.left = destRect.left + 'px';
    flyer.style.top = destRect.top + 'px';
    flyer.style.width = destRect.width + 'px';
    flyer.style.height = destRect.height + 'px';
    // ...then shifted/scaled with a transform so it visually starts out sitting
    // exactly where the real cover is on the home screen
    const scaleX = srcRect.width / destRect.width;
    const scaleY = srcRect.height / destRect.height;
    const dx = srcRect.left - destRect.left;
    const dy = srcRect.top - destRect.top;
    flyer.style.transition = 'none';
    flyer.style.transform = `translate(${dx}px, ${dy}px) scale(${scaleX}, ${scaleY})`;
    document.body.appendChild(flyer);
    fsFlyerEl = flyer;
    destArt.style.opacity = '0';

    // change it -- otherwise the two writes can get coalesced into one and
    // the cover just jumps to fullscreen instead of visibly flying there
    void flyer.getBoundingClientRect();

    requestAnimationFrame(() => {
      flyer.style.transition = 'transform 3s cubic-bezier(0.22,1,0.36,1)';
      flyer.style.transform = 'translate(0,0) scale(1,1)';
    });

    fsEntranceCleanupTimer = setTimeout(() => {
      flyer.remove();
      if (fsFlyerEl === flyer) fsFlyerEl = null;
      destArt.style.opacity = '';

/* ---------- Al's hand-drawn back arrow ----------
   used for getting back from full screen and out of a story: it does a slow
   360-degree back flip every 4 seconds, and pressing it plays the sound of
   pages turning back */
const AL_BACK_ARROW = 'https://pub-1a1abd4855a54958bf82eeb2e0f254e6.r2.dev/Awesome%20Love%20Images/Awesome%20Love%20Images/back-arrow.webp';
function alPageTurnBackSound(){
  // a smooth, soft noise that swells up (a crescendo) and then gently lets go,
  // drifting from right to left -- going back
  const ctx = ensureAudioCtx();
  if (!ctx) return;
  try {
    const now = ctx.currentTime + 0.01;
    const SWELL = 1.15;     // seconds of rising
    const RELEASE = 0.6;    // seconds of letting go
    const DUR = SWELL + RELEASE;
    const sr = ctx.sampleRate;
    const buf = ctx.createBuffer(1, Math.ceil(sr * (DUR + 0.1)), sr);
    const d = buf.getChannelData(0);
    // smooth "pink-ish" noise: softer and rounder than plain static
    let b0 = 0, b1 = 0, b2 = 0;
    for (let i = 0; i < d.length; i++){
      const w = Math.random() * 2 - 1;
      b0 = 0.99765 * b0 + w * 0.0990460;
      b1 = 0.96300 * b1 + w * 0.2965164;
      b2 = 0.57000 * b2 + w * 1.0526913;
      d[i] = (b0 + b1 + b2 + w * 0.1848) * 0.18;
    }
    const src = ctx.createBufferSource(); src.buffer = buf;
    // the crescendo: starts nearly silent, swells smoothly, then releases
    const amp = ctx.createGain();
    amp.gain.setValueAtTime(0.0001, now);
    amp.gain.exponentialRampToValueAtTime(0.06, now + SWELL * 0.45);
    amp.gain.exponentialRampToValueAtTime(0.62, now + SWELL);
    // a soft glide down rather than a sudden drop
    amp.gain.exponentialRampToValueAtTime(0.18, now + SWELL + RELEASE * 0.4);
    amp.gain.exponentialRampToValueAtTime(0.0001, now + DUR);
    // as it swells it also opens up and brightens, like a wave rising
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 0.7;
    lp.frequency.setValueAtTime(500, now);
    lp.frequency.exponentialRampToValueAtTime(5200, now + SWELL);
    lp.frequency.exponentialRampToValueAtTime(1800, now + DUR);
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 120;
    src.connect(hp); hp.connect(lp); lp.connect(amp);
    let tail = amp;
    if (ctx.createStereoPanner){
      const pan = ctx.createStereoPanner();
      pan.pan.setValueAtTime(0.6, now);
      pan.pan.linearRampToValueAtTime(-0.6, now + DUR);
      amp.connect(pan); tail = pan;
    }
    const out = ctx.createGain(); out.gain.value = 0.9;
    tail.connect(out); out.connect(alSfxOut(ctx));
    src.start(now); src.stop(now + DUR + 0.05);
  } catch(e){}
}

/* ---------- Al's hand-drawn play / pause button ----------
   Press play and the green spiral slowly draws itself in, from the center
   out, over about 6 seconds. Pause and it keeps flowing outward and away,
   leaving just the blue circle -- then grows back in on the next play. */
function setupSpiralPlayButton(btn, path, onPress){
  if (!btn || !path) return;
  const GROW_MS = 6000;
  // 1 = not drawn yet, 0 = fully drawn, -1 = flowed away
  let v = 1, from = 1, to = 1, start = 0, dur = 0, raf = null;
  const ease = t => t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;
  function paint(){ path.style.strokeDashoffset = v; }
  function frame(now){
    const t = dur ? Math.min(1, (now - start) / dur) : 1;
    v = from + (to - from) * ease(t);
    paint();
    if (t < 1) raf = requestAnimationFrame(frame); else raf = null;
  }
  function goTo(target){
    if (target === 0 && v <= -0.999){ v = 1; paint(); } // start a fresh grow
    from = v; to = target;
    dur = GROW_MS * Math.min(1, Math.abs(to - from));
    start = performance.now();
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches){ v = to; paint(); return; }
    if (!raf) raf = requestAnimationFrame(frame);
  }
  function sync(){
    const playing = !audio.paused && !!audio.src && !(typeof alTurntable !== 'undefined' && alTurntable.isSpinningDown());
    btn.classList.toggle('is-playing', playing);
    btn.setAttribute('aria-label', playing ? 'Pause' : 'Play');
    if (playing && to !== 0) goTo(0);
    else if (!playing && to === 0) goTo(-1);
  }
  audio.addEventListener('play', sync);
  audio.addEventListener('playing', sync);
  audio.addEventListener('pause', sync);
  audio.addEventListener('ended', sync);
  audio.addEventListener('alspindown', sync);
  audio.addEventListener('alspinup', sync);
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    onPress();
    setTimeout(sync, 0);
  });
  paint();
  sync();
  return sync;
}

const TAU_NP = Math.PI * 2;
/* random but steady for the whole length of one spin: +1 or -1 */
function alSpinWay(n, seed){
  // a little integer hash so every spin truly flips a fair coin
  let h = (Math.imul((n | 0) + 1, 2654435761) ^ Math.imul(Math.round(seed * 1000) | 0, 1597334677)) >>> 0;
  h ^= h >>> 15; h = Math.imul(h, 2246822519) >>> 0; h ^= h >>> 13;
  return (h & 1) ? 1 : -1;
}

   and Albums -- the ones with songs to choose from), softly fading in and out.
   Every 30 seconds you spend looking at that album it swells up to about the
   size of the album art, then settles back. Tap it to bring up the blurred
   song selection. */
const AL_ALBUM_WORD = 'https://pub-1a1abd4855a54958bf82eeb2e0f254e6.r2.dev/Awesome%20Love%20Images/Awesome%20Love%20Images/album-word.webp';
/* true while the "Do You Love Music?" landing page or the mood picker is still up */
function alOnLandingPages(){
  const up = id => {
    const el = document.getElementById(id);
    if (!el || el.style.display === 'none') return false;
    if (el.classList.contains('intro-hide') || el.classList.contains('mood-leaving')) return false;
    const cs = getComputedStyle(el);
    return cs.display !== 'none' && cs.visibility !== 'hidden' && +cs.opacity > 0.05;
  };
  return up('introOverlay') || up('moodOverlay');
}
function alOpenSongSelect(idx){
  fsOverlay.classList.add('al-select');
  openFullscreen(idx);
}
// leaving the selection (any way at all) ends selection mode
new MutationObserver(() => {
  // (only touch it when it's actually there -- removing an absent class still
  //  counts as a change, which would wake this watcher again forever)
  if (!fsOverlay.classList.contains('open') && fsOverlay.classList.contains('al-select')) fsOverlay.classList.remove('al-select');
}).observe(fsOverlay, { attributes:true, attributeFilter:['class'] });
(function(){
  const badge = document.createElement('button');
  badge.className = 'al-album-badge';
  badge.setAttribute('aria-label', 'Choose a song from this album');
  badge.innerHTML = '<span class="al-album-float"><img src="' + AL_ALBUM_WORD + '" alt="" draggable="false"></span>';
  document.body.appendChild(badge);
  badge.addEventListener('pointerdown', e => e.stopPropagation());
  badge.addEventListener('click', (e) => {
    e.stopPropagation();
    if (typeof ensureAudioCtx === 'function') ensureAudioCtx();
    alOpenSongSelect(activeIndex);
  });
  const BIG_EVERY = 30;                 // seconds of looking before each big moment
  const RISE = 1.8, HOLD = 2.6, FALL = 1.8;
  const smooth = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  let lookIdx = -2, lookStart = 0, hiddenAt = null;
  (function frame(now){
    requestAnimationFrame(frame);
    const rel = releases[activeIndex];
    const busy = fsOverlay.classList.contains('open') || storyOverlay.classList.contains('open') ||
                 (typeof showingFavorites !== 'undefined' && showingFavorites) || alOnLandingPages();
    const show = !!(rel && rel.tracks && rel.tracks.length > 1) && !busy;
    badge.classList.toggle('show', show);
    // the 30-second clock only counts while you're actually looking at this album
    if (activeIndex !== lookIdx){ lookIdx = activeIndex; lookStart = now; }
    if (document.hidden || !show){ if (hiddenAt === null) hiddenAt = now; return; }
    if (hiddenAt !== null){ lookStart += now - hiddenAt; hiddenAt = null; }
    const w = document.querySelector('.cover-wrap.al-center');
    const art = w && (w.querySelector('.cover-art') || w);
    const r = art ? art.getBoundingClientRect() : null;
    // never show it until it knows exactly where its album is
    if (!r || !r.width){ badge.classList.remove('show'); return; }
    const baseW = Math.max(70, Math.min(190, r.width * 0.36));
    const ASPECT = 280 / 900;           // the Album word's height for its width (Awesome AL font)
    const bh = baseW * ASPECT;
    // sits just below the cover, but never down into the song meter
    const meter = document.querySelector('.progress-wrap');
    const floorY = meter ? meter.getBoundingClientRect().top - 8 : innerHeight - 90;
    const baseCx = r.left + r.width / 2;
    const baseCy = Math.min(r.bottom + 14 + bh / 2, floorY - bh / 2);
    // the big moment: swell to about the album art's size, right over the cover
    let env = 0;
    const t = (now - lookStart) / 1000;
    if (!reduce && t >= BIG_EVERY){
      const ph = (t - BIG_EVERY) % BIG_EVERY;
      if (ph < RISE) env = smooth(ph / RISE);
      else if (ph < RISE + HOLD) env = 1;
      else if (ph < RISE + HOLD + FALL) env = 1 - smooth((ph - RISE - HOLD) / FALL);
    }
    // it grows by simply getting wider (no zooming), so every browser agrees on
    // exactly where it is: at its biggest it's as wide as the album art, centered on it
    const bigW = r.width * 0.96;
    const wNow = baseW + (bigW - baseW) * env;
    const hNow = wNow * ASPECT;
    const cx = baseCx, cy = baseCy + ((r.top + r.height / 2) - baseCy) * env;
    badge.style.width = wNow.toFixed(1) + 'px';
    badge.style.height = hNow.toFixed(1) + 'px';
    badge.style.transform = 'translate(' + (cx - wNow / 2).toFixed(1) + 'px, ' + (cy - hNow / 2).toFixed(1) + 'px)';
    badge.classList.toggle('al-big', env > 0.02);
    badge.style.setProperty('--al-big', env.toFixed(3));
  })(performance.now());
})();


/* ---------- Al's TIME button ----------
   dances in the bottom-right corner, glowing through every color (a new color
   fades in every 6 seconds, around a 24-second cycle). Press it and the love
   meter and the counting time numbers fold gracefully away for a clean,
   minimal look; press again and they come back. */
(function(){
  const transport = document.querySelector('.transport');
  if (!transport) return;
  const btn = document.createElement('button');
  btn.className = 'al-time-btn';
  btn.setAttribute('aria-label', 'Show or hide the song meter and time');
  btn.setAttribute('aria-pressed', 'false');
  btn.innerHTML = '<span class="al-time-ink" aria-hidden="true"></span>';
  btn.querySelector('.al-time-ink').style.setProperty('--al-time-img', 'url("https://pub-1a1abd4855a54958bf82eeb2e0f254e6.r2.dev/Awesome%20Love%20Images/Awesome%20Love%20Images/time-ink.webp")');
  transport.appendChild(btn);
  document.body.classList.add('al-has-time-btn');
  // the TIME watch stays hidden until the first song plays, then appears for good
  const showWatch = () => document.body.classList.add('al-time-ready');
  audio.addEventListener('playing', showWatch, { once:true });
  audio.addEventListener('alspinup', showWatch, { once:true });
  // the love meter starts tucked away inside the TIME button -- a surprise to discover
  document.body.classList.add('al-time-min');
  btn.setAttribute('aria-pressed', 'true');
  const wrap = document.querySelector('.progress-wrap');
  const GENIE_OUT_MS = 5000, GENIE_IN_MS = 3000;
  const reduceGenie = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  /* the genie, worked out fresh every frame from one smooth formula (no fixed poses
     to jump between), using only moving, stretching and fading -- the things a
     browser can draw smoothly. u goes 0 (inside the bottle) -> 1 (the full meter). */
  const sm = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * x * (x * (x * 6 - 15) + 10);   // extra-smooth step
  const cl = x => x < 0 ? 0 : x > 1 ? 1 : x;
  function geniePose(u){
    const rise  = sm(cl(u / 0.5));                    // the wisp climbs up out of the bottle
    const bloom = sm(cl((u - 0.22) / 0.62));          // ...then widens into its full shape
    const calm  = 1 - sm(cl((u - 0.15) / 0.85));      // the swirling gently fades away
    const swirl = Math.sin(Math.PI * 2 * 1.35 * u);   // one smooth, continuous swirl
    const sx = 0.025 + 0.975 * bloom;
    const sy = (0.06 + 0.94 * rise) * (1 + 0.06 * Math.sin(Math.PI * cl((u - 0.7) / 0.3)) * (1 - bloom * 0.5));
    return {
      sx, sy,
      skew: 24 * calm * swirl,
      rot: 5 * calm * Math.sin(Math.PI * 2 * 1.35 * u + 1.1),
      op: sm(cl(u / 0.22)),
    };
  }
  let genieRaf = null;
  function paintGenie(u){
    // the bottle is wherever the TIME button is, measured fresh as the space opens
    // (measured from where the meter sits un-stretched -- its own on-screen box is
    //  already squeezed by the genie, which would throw the aim off)
    const bR = btn.getBoundingClientRect();
    const par = wrap.offsetParent || document.body, pR = par.getBoundingClientRect();
    const wl = pR.left + wrap.offsetLeft, wt = pR.top + wrap.offsetTop;
    const ox = bR.left + bR.width / 2 - wl, oy = bR.top + bR.height * 0.25 - wt;
    const g = geniePose(u);
    wrap.style.transformOrigin = ox.toFixed(1) + 'px ' + oy.toFixed(1) + 'px';
    wrap.style.transform = 'rotate(' + g.rot.toFixed(3) + 'deg) skewX(' + g.skew.toFixed(3) + 'deg) scale(' + g.sx.toFixed(4) + ', ' + g.sy.toFixed(4) + ')';
    wrap.style.opacity = g.op.toFixed(3);
  }
  function clearGenie(){
    wrap.style.transform = ''; wrap.style.transformOrigin = ''; wrap.style.opacity = '';
  }
  function runGenie(from, to, ms, done){
    if (genieRaf) cancelAnimationFrame(genieRaf);
    const t0 = performance.now();
    (function frame(now){
      const k = cl((now - t0) / ms);
      // gentle at both ends of the journey
      const e = 0.5 - 0.5 * Math.cos(Math.PI * k);
      paintGenie(from + (to - from) * e);
      if (k < 1){ genieRaf = requestAnimationFrame(frame); return; }
      genieRaf = null;
      done && done();
    })(t0);
  }
  /* ---------- out of the watch and back in, the catch-and-release way:
     OUT: the watch wiggles, hops, flashes open, a beam of light shoots out and the
          meter appears as pure glowing light, popping out bouncy, then its colors fill in.
     IN:  the meter turns to light and zips back down the beam into the watch,
          the watch wobbles... wobbles... wobbles... and clicks shut with a sparkle. ---------- */
  const POKE_OPEN_DELAY = 620, POKE_OPEN_MS = 1300, POKE_IN_MS = 950;
  let pokeBusy = false;
  const easeOutBack = x => { const c1 = 1.55, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
  function watchCenter(){
    const r = btn.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }
  function paintPoke(scale, op, light, wobble){
    const bR = btn.getBoundingClientRect();
    const par = wrap.offsetParent || document.body, pR = par.getBoundingClientRect();
    const wl = pR.left + wrap.offsetLeft, wt = pR.top + wrap.offsetTop;
    const ox = bR.left + bR.width / 2 - wl, oy = bR.top + bR.height * 0.4 - wt;
    wrap.style.transformOrigin = ox.toFixed(1) + 'px ' + oy.toFixed(1) + 'px';
    const sx = Math.max(0.001, scale * (1 + (wobble || 0))), sy = Math.max(0.001, scale * (1 - (wobble || 0)));
    wrap.style.transform = 'scale(' + sx.toFixed(4) + ', ' + sy.toFixed(4) + ')';
    wrap.style.opacity = op.toFixed(3);
    wrap.style.filter = light > 0.01
      ? 'brightness(' + (1 + 7 * light).toFixed(2) + ') saturate(' + (1 - light).toFixed(2) + ') blur(' + (3.5 * light).toFixed(2) + 'px) drop-shadow(0 0 ' + (18 * light).toFixed(1) + 'px rgba(255,255,255,' + (0.9 * light).toFixed(2) + '))'
      : '';
  }
  function clearPoke(){ wrap.style.filter = ''; clearGenie(); }
  function runFrames(ms, fn, done){
    if (genieRaf) cancelAnimationFrame(genieRaf);
    const t0 = performance.now();
    (function frame(now){
      const k = cl((now - t0) / ms);
      fn(k);
      if (k < 1){ genieRaf = requestAnimationFrame(frame); return; }
      genieRaf = null;
      done && done();
    })(t0);
  }
  // a burst of white light right at the watch
  function watchFlash(big){
    const c = watchCenter();
    const f = document.createElement('div');
    const d = big ? 140 : 70;
    f.style.cssText = 'position:fixed;left:' + (c.x - d / 2) + 'px;top:' + (c.y - d / 2) + 'px;width:' + d + 'px;height:' + d + 'px;border-radius:50%;pointer-events:none;z-index:10030;' +
      'background:radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(255,255,255,0.85) 22%, rgba(190,230,255,0.45) 45%, rgba(255,255,255,0) 70%);mix-blend-mode:screen;';
    document.body.appendChild(f);
    f.animate([
      { transform: 'scale(0.1)', opacity: 1 },
      { transform: 'scale(' + (big ? 2.4 : 1.6) + ')', opacity: 0.9, offset: 0.35 },
      { transform: 'scale(' + (big ? 3.2 : 2) + ')', opacity: 0 }
    ], { duration: big ? 750 : 450, easing: 'ease-out', fill: 'forwards' }).onfinish = () => f.remove();
  }
  // a beam of light between the watch and the middle of the meter
  function watchBeam(outward, ms){
    const c = watchCenter();
    const m = wrap.getBoundingClientRect();
    const tx = m.left + m.width / 2, ty = m.top + m.height / 2;
    const dx = tx - c.x, dy = ty - c.y, len = Math.max(30, Math.hypot(dx, dy)), ang = Math.atan2(dy, dx) * 180 / Math.PI;
    const b = document.createElement('div');
    b.style.cssText = 'position:fixed;left:' + c.x + 'px;top:' + (c.y - 5) + 'px;width:' + len + 'px;height:10px;border-radius:10px;pointer-events:none;z-index:10029;' +
      'transform-origin:0 50%;background:linear-gradient(to right, rgba(255,255,255,1), rgba(200,235,255,0.85) 60%, rgba(255,255,255,0));' +
      'box-shadow:0 0 18px 6px rgba(255,255,255,0.55);mix-blend-mode:screen;';
    document.body.appendChild(b);
    const rot = 'rotate(' + ang.toFixed(1) + 'deg) ';
    b.animate(outward ? [
      { transform: rot + 'scaleX(0)', opacity: 1 },
      { transform: rot + 'scaleX(1)', opacity: 1, offset: 0.45 },
      { transform: rot + 'scaleX(1) scaleY(0.2)', opacity: 0 }
    ] : [
      { transform: rot + 'scaleX(1) scaleY(0.3)', opacity: 0 },
      { transform: rot + 'scaleX(1)', opacity: 1, offset: 0.3 },
      { transform: rot + 'scaleX(0)', opacity: 0.9 }
    ], { duration: ms, easing: 'ease-in-out', fill: 'forwards' }).onfinish = () => b.remove();
  }
  // the watch's wiggle before it opens, and its three wobbles once it's caught the meter
  function wiggleWatch(){
    return btn.animate([
      { transform: 'rotate(0deg) translateY(0)' },
      { transform: 'rotate(-16deg) translateY(0)', offset: 0.18 },
      { transform: 'rotate(14deg) translateY(0)', offset: 0.38 },
      { transform: 'rotate(-8deg) translateY(0)', offset: 0.55 },
      { transform: 'rotate(0deg) translateY(-14px) scale(1.12)', offset: 0.82 },
      { transform: 'rotate(0deg) translateY(0) scale(1)' }
    ], { duration: POKE_OPEN_DELAY + 120, easing: 'ease-in-out' });
  }
  function wobbleThrice(done){
    const one = (n) => {
      if (n >= 3){ done && done(); return; }
      btn.animate([
        { transform: 'rotate(0deg)' },
        { transform: 'rotate(-22deg)', offset: 0.3 },
        { transform: 'rotate(16deg)', offset: 0.62 },
        { transform: 'rotate(0deg)' }
      ], { duration: 420, easing: 'ease-in-out' }).onfinish = () => setTimeout(() => one(n + 1), 260);
    };
    setTimeout(() => one(0), 120);
  }
  function clickShut(){
    const c = watchCenter();
    btn.animate([
      { transform: 'scale(1)' }, { transform: 'scale(0.86)', offset: 0.3 }, { transform: 'scale(1.1)', offset: 0.65 }, { transform: 'scale(1)' }
    ], { duration: 380, easing: 'ease-out' });
    watchFlash(false);
    if (typeof spawnHeartBurst === 'function' && typeof ALL_HEARTS_IMG_SRCS !== 'undefined'){
      try { spawnHeartBurst(c.x, c.y, { imgSrcs: ALL_HEARTS_IMG_SRCS, count: 27, minDist: 30, maxDist: 110, minSize: 10, maxSize: 22, dur: 1.8 }); } catch(e){}
    }
  }

  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (!wrap || pokeBusy) return;
    const body = document.body;
    const opening = body.classList.contains('al-time-min') || body.classList.contains('al-genie-in');
    if (opening){
      body.classList.remove('al-genie-in');
      btn.setAttribute('aria-pressed', 'false');
      if (reduceGenie){ body.classList.remove('al-time-min'); return; }
      pokeBusy = true;
      // the room quietly opens (still empty) while the watch wiggles and hops...
      body.classList.add('al-genie-out');
      body.classList.remove('al-time-min');
      paintPoke(0, 0, 1, 0);
      wiggleWatch();
      setTimeout(() => {
        // ...then it flashes open and out comes the meter as pure light,
        // with the lighter, airier swell of love
        alLoveSwell(true);
        watchFlash(true);
        requestAnimationFrame(() => watchBeam(true, 700));
        runFrames(POKE_OPEN_MS, (k) => {
          const grow = easeOutBack(cl(k / 0.62));
          const wob = 0.07 * Math.sin(Math.PI * 3 * cl((k - 0.3) / 0.7)) * (1 - cl((k - 0.3) / 0.7));
          const light = 1 - sm(cl((k - 0.4) / 0.6));
          paintPoke(grow, sm(cl(k / 0.12)), light, wob);
        }, () => {
          clearPoke(); body.classList.remove('al-genie-out');
          body.classList.add('al-glow-back');
          setTimeout(() => body.classList.remove('al-glow-back'), 1300);
          pokeBusy = false;
        });
      }, POKE_OPEN_DELAY);
    } else {
      // back in: it turns to light and zips down the beam into the watch...
      alLoveSwell(false);
      body.classList.remove('al-genie-out');
      body.classList.add('al-genie-in');
      btn.setAttribute('aria-pressed', 'true');
      if (reduceGenie){ body.classList.add('al-time-min'); body.classList.remove('al-genie-in'); return; }
      pokeBusy = true;
      setTimeout(() => watchBeam(false, 700), POKE_IN_MS * 0.3);
      runFrames(POKE_IN_MS, (k) => {
        const light = sm(cl(k / 0.35));
        const shrink = k < 0.35 ? 1 + 0.06 * sm(k / 0.35) : 1.06 * (1 - Math.pow(cl((k - 0.35) / 0.65), 2.2));
        const op = 1 - sm(cl((k - 0.85) / 0.15));
        paintPoke(shrink, op, light, 0);
      }, () => {
        body.classList.add('al-time-min');
        body.classList.remove('al-genie-in');
        requestAnimationFrame(() => requestAnimationFrame(clearPoke));
        watchFlash(false);
        // ...wobble, wobble, wobble... click!
        wobbleThrice(() => { clickShut(); pokeBusy = false; });
      });
    }
    // the song name can use the room once things have settled
    setTimeout(() => { if (typeof fitNowPlayingSize === 'function') fitNowPlayingSize(); }, 1900);
  });
  // walking around and dancing: a bob, a sway, little side steps, and every so
  // often a twirl, turning either way
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const TAU = Math.PI * 2;
  (function dance(now){
    requestAnimationFrame(dance);
    if (reduce || document.hidden) return;
    const t = now / 1000;
    const SPIN_EVERY = 13, SPIN = 2.4;
    const ph = (t + 5) % SPIN_EVERY, n = Math.floor((t + 5) / SPIN_EVERY);
    if (ph < SPIN){
      const e = 0.5 - 0.5 * Math.cos(Math.PI * ph / SPIN);
      btn.style.rotate = 'y ' + (e * 360 * alSpinWay(n, 31.3)).toFixed(1) + 'deg';
    } else {
      btn.style.rotate = 'z ' + (7 * Math.sin(TAU * (ph - SPIN) / 4.4)).toFixed(2) + 'deg';
    }
    btn.style.translate = (7 * Math.sin(TAU * t / 6.1)).toFixed(1) + 'px ' + (-5 * Math.abs(Math.sin(TAU * t / 2.2))).toFixed(1) + 'px';
  })(performance.now());
})();


/* ---------- when the music starts or stops, Al's thumbprint play button plays its
   spiral big across the whole screen (growing in to start, flowing away to stop),
   then shrinks down like a genie into its spot beside the song that's playing.
   The genie is drawn in thin slices that each slide and squeeze on their own,
   bottom first, so it pours down like a genie into a lamp. ---------- */
(function(){
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const src = document.querySelector('#fsPlayBtn .fs-play-svg');
  if (!src) return;
  const IMG_PLAYED = new Image(); IMG_PLAYED.src = 'https://pub-1a1abd4855a54958bf82eeb2e0f254e6.r2.dev/Awesome%20Love%20Images/Awesome%20Love%20Images/play-button-played.webp';
  const IMG_PAUSED = new Image(); IMG_PAUSED.src = src.querySelector('image').getAttribute('href');
  const SHOW_IN = 450, SPIRAL = 3000, HOLD = 250, GENIE = 1700;
  // each picture, also prepared at half, quarter, eighth... size: drawing small from a
  // picture that's already near the right size is what keeps the genie smooth, not pixely
  function mipChain(img){
    const levels = [img];
    let w = img.naturalWidth, h = img.naturalHeight, prev = img;
    while (w > 48){
      w = Math.round(w / 2); h = Math.round(h / 2);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const x = c.getContext('2d'); x.imageSmoothingEnabled = true; x.imageSmoothingQuality = 'high';
      x.drawImage(prev, 0, 0, w, h);
      levels.push(c); prev = c;
    }
    return levels;
  }
  const mips = new Map();
  function levelFor(img, drawW){
    if (!img.naturalWidth) return img;
    if (!mips.has(img)) mips.set(img, mipChain(img));
    const levels = mips.get(img), need = drawW * (window.devicePixelRatio || 1);
    let pick = levels[0];
    for (const l of levels){ if (l.width >= need) pick = l; else break; }
    return pick;
  }
  const layer = document.createElement('div');
  layer.className = 'al-big-play';
  layer.setAttribute('aria-hidden', 'true');
  layer.innerHTML = '<div class="al-big-play-veil"></div>' + src.outerHTML
    .replace('id="fsSpiralMask"', 'id="bigSpiralMask"')
    .replace('url(#fsSpiralMask)', 'url(#bigSpiralMask)')
    .replace('id="fsSpiralPath"', 'id="bigSpiralPath"')
    .replace('class="fs-play-svg"', 'class="fs-play-svg al-big-play-svg"') + '<canvas class="al-big-play-genie"></canvas>';
  document.body.appendChild(layer);
  const svg = layer.querySelector('.al-big-play-svg');
  const path = layer.querySelector('#bigSpiralPath');
  const canvas = layer.querySelector('canvas');
  const ctx = canvas.getContext('2d');
  let raf = null, run = 0;
  const ease = t => t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;
  const clamp01 = x => x < 0 ? 0 : x > 1 ? 1 : x;
  function stop(){ if (raf) cancelAnimationFrame(raf); raf = null; }
  function target(){
    const b = document.getElementById('npPlayBtn');
    if (b){
      const r = b.getBoundingClientRect();
      if (r.width) return r;
    }
    const n = document.getElementById('nowPlaying');
    const r = n ? n.getBoundingClientRect() : null;
    return r && r.width ? { left:r.left + r.width/2 - 24, top:r.top + r.height/2 - 24, width:48, height:48 }
                        : { left:innerWidth/2 - 24, top:innerHeight - 80, width:48, height:48 };
  }
  function show(playing){
    if (reduce) return;
    stop();
    const me = ++run;
    const small = document.getElementById('npPlayBtn');
    if (small) small.classList.add('al-genie-hidden');
    layer.classList.remove('al-genie-phase');
    layer.classList.add('on');
    const from = playing ? 1 : 0, to = playing ? 0 : -1;
    path.style.strokeDashoffset = from;
    const t0 = performance.now();
    let big = null;
    function frame(now){
      if (me !== run) return;
      const t = now - t0;
      // 1) the spiral plays big, in the middle of the screen
      if (t < SHOW_IN + SPIRAL + HOLD){
        const u = clamp01((t - SHOW_IN * 0.5) / SPIRAL);
        path.style.strokeDashoffset = (from + (to - from) * ease(u)).toFixed(4);
        raf = requestAnimationFrame(frame);
        return;
      }
      // 2) the genie: down into the little button beside the song
      if (!big){
        big = svg.getBoundingClientRect();
        canvas.width = Math.round(innerWidth * devicePixelRatio);
        canvas.height = Math.round(innerHeight * devicePixelRatio);
        layer.classList.add('al-genie-phase');
      }
      const g = clamp01((t - SHOW_IN - SPIRAL - HOLD) / GENIE);
      const img = playing ? IMG_PLAYED : IMG_PAUSED;
      const dst = target();
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      const LAG = 0.55;                                // the bottom slices lead the way down
      // the genie's width right now (its widest slice), to choose the right-size picture
      const pMid = ease(clamp01((g - 0.5 * LAG) / (1 - LAG)));
      const widest = big.width + (dst.width - big.width) * pMid;
      const pic = levelFor(img, widest);
      const iw = pic.width || 400, ih = pic.height || 400;
      // thin slices -- about one for every 2 screen dots of height -- so the edges stay smooth
      const ROWS = Math.max(60, Math.min(320, Math.round(big.height * (window.devicePixelRatio || 1) / 2)));
      // every slice edge travels on its own (the bottom ones first), and each slice
      // stretches between its two edges, so the genie stays one smooth piece
      const edgeP = fy => ease(clamp01((g - (1 - fy) * LAG) / (1 - LAG)));
      const edgeY = (fy, p) => (big.top + big.height * fy) + ((dst.top + dst.height * fy) - (big.top + big.height * fy)) * p;
      let pTop = edgeP(0), yTop = edgeY(0, pTop);
      for (let i = 0; i < ROWS; i++){
        const fyB = (i + 1) / ROWS;
        const pBot = edgeP(fyB), yBot = edgeY(fyB, pBot);
        const p = (pTop + pBot) / 2;
        // as it pours down it squeezes narrow in the middle of the trip, like a funnel
        const cx = (big.left + big.width / 2) + ((dst.left + dst.width / 2) - (big.left + big.width / 2)) * p;
        const pinch = 1 - 0.55 * Math.sin(Math.PI * p);
        const w = (big.width + (dst.width - big.width) * p) * pinch;
        ctx.drawImage(pic, 0, ih * i / ROWS, iw, ih / ROWS, cx - w / 2, yTop, w, Math.max(0.5, yBot - yTop) + 0.6);
        pTop = pBot; yTop = yBot;
      }
      if (g < 1){ raf = requestAnimationFrame(frame); return; }
      // landed: the little button takes over
      raf = null;
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      if (small) small.classList.remove('al-genie-hidden');
      layer.classList.remove('on');
      // keep the big button hidden until the layer has finished fading, so no ghost flashes
      setTimeout(() => { if (me === run) layer.classList.remove('al-genie-phase'); }, 500);
    }
    raf = requestAnimationFrame(frame);
  }
  audio.addEventListener('alspinup', () => show(true));
  audio.addEventListener('alspindown', () => show(false));
})();


/* ---------- a loved song that's playing gets a soft red, green and blue glow around its
   name, fading in and out in perfect step with the donation heart's glow ---------- */
(function(){
  const row = document.querySelector('.playhead-row');
  const support = document.querySelector('.support-heart-wrap');
  if (!row || !nowPlaying) return;
  const glow = document.createElement('div');
  glow.className = 'al-loved-glow';
  glow.setAttribute('aria-hidden', 'true');
  glow.innerHTML = '<div class="al-lg-breath"><i class="al-lg-blob"></i><i class="al-lg-blob"></i><i class="al-lg-blob"></i></div>';
  row.insertBefore(glow, row.firstChild);
  // three color clouds that swirl around each other, each drifting to new random colors
  const blobs = [...glow.querySelectorAll('.al-lg-blob')].map((el, i) => ({
    el, hue: [350, 135, 220][i], target: [350, 135, 220][i], nextChange: 2500 + i * 900,
    spin: 0.32 + i * 0.05, phase: i * Math.PI * 2 / 3, wob: 0.9 + i * 0.37,
  }));
  const hueGap = (a, b) => { const d = Math.abs(((a - b) % 360 + 360) % 360); return Math.min(d, 360 - d); };
  function pickHue(me){
    // a random new color, kept well apart from the other two clouds
    for (let tries = 0; tries < 30; tries++){
      const h = Math.random() * 360;
      if (blobs.every(o => o === me || hueGap(h, o.target) > 70) && hueGap(h, me.hue) > 50) return h;
    }
    return (me.hue + 120 + Math.random() * 120) % 360;
  }
  let danceLast = 0, danceClock = 0;
  function danceBlobs(now, w, h){
    const dt = Math.min(0.05, (now - (danceLast || now)) / 1000); danceLast = now;
    danceClock += dt;
    const t = danceClock;
    blobs.forEach(b => {
      // drift toward its next random color, the short way around the rainbow
      if (t * 1000 > b.nextChange){ b.target = pickHue(b); b.nextChange = t * 1000 + 2600 + Math.random() * 3200; }
      let d = ((b.target - b.hue) % 360 + 540) % 360 - 180;
      b.hue = (b.hue + d * Math.min(1, dt * 0.9) + 360) % 360;
      // swirl around each other in a wide loop behind the name, with a little sway
      const a = t * b.spin * Math.PI * 2 * 0.35 + b.phase;
      const r = 0.5 + 0.12 * Math.sin(t * b.wob + b.phase);
      const x = Math.cos(a) * r * w * 0.42 + Math.sin(t * 1.7 * b.wob) * w * 0.04;
      const y = Math.sin(a) * r * h * 0.28 + Math.cos(t * 1.3 * b.wob + b.phase) * h * 0.08;
      const sc = 0.9 + 0.18 * Math.sin(t * 1.1 * b.wob + b.phase * 2);
      b.el.style.transform = 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px) scale(' + sc.toFixed(3) + ')';
      b.el.style.setProperty('--h', b.hue.toFixed(1));
    });
  }
  // find the donation heart's own glow animation, to march in step with it
  function supportAnim(){
    if (!support || !support.getAnimations) return null;
    try {
      return support.getAnimations({ subtree:true }).find(a => a.animationName === 'supportGlow') ||
             document.getAnimations().find(a => a.animationName === 'supportGlow') || null;
    } catch(e){ return null; }
  }
  function syncToHeart(){
    const src = supportAnim();
    if (!src || !glow.getAnimations) return;
    const mine = glow.getAnimations({ subtree:true }).find(a => a.animationName === 'alLovedGlow');
    if (mine && src.currentTime != null) mine.currentTime = src.currentTime;
  }
  let on = false, lastSync = 0;
  (function frame(now){
    requestAnimationFrame(frame);
    const r = currentTrack.relIdx, t = currentTrack.trackIdx;
    const loved = r !== -1 && typeof isFavorite === 'function' && isFavorite(r, t);
    const playing = !audio.paused && !!audio.src && !(typeof alTurntable !== 'undefined' && alTurntable.isSpinningDown());
    const want = loved && playing;
    if (want !== on){
      on = want;
      glow.classList.toggle('on', on);
      if (on){ syncToHeart(); lastSync = now; }
    }
    if (!on || document.hidden) return;
    if (now - lastSync > 4000){ syncToHeart(); lastSync = now; }   // stay perfectly in step
    // hug the song's name wherever it drifts and however big it grows
    const name = nowPlaying.querySelector('strong');
    if (!name) return;
    const rr = row.getBoundingClientRect(), nr = name.getBoundingClientRect();
    if (!nr.width) return;
    glow.style.left = (nr.left - rr.left - nr.height * 0.6).toFixed(1) + 'px';
    glow.style.top = (nr.top - rr.top - nr.height * 0.45).toFixed(1) + 'px';
    glow.style.width = (nr.width + nr.height * 1.2).toFixed(1) + 'px';
    glow.style.height = (nr.height * 1.9).toFixed(1) + 'px';
    danceBlobs(now, nr.width + nr.height * 1.2, nr.height * 1.9);
  })(performance.now());
})();


/* ---------- an ocean swell of love, made only of soft noise (pink noise for the
   wave's warm body, white noise for its airy foam), with no tune at all:
     0-1 s     a build -- the wave gathering, rising and brightening
     1-1.5 s   a fast whooshing rush of love -- the wave cresting, foam and all
     1.5-2.25 s closing down -- the wave drawing back into a soft swell, to silence
   It plays as the love meter comes out of the TIME watch (a little lighter, airier
   and softer) and as it goes back in (fuller). Every movement follows one smooth,
   hand-shaped curve, and only wide, gentle filters are used, so nothing rings on a note. ---------- */
function alLoveSwell(light){
  const ctx = (typeof ensureAudioCtx === 'function') ? ensureAudioCtx() : null;
  if (!ctx) return;
  try {
    const now = ctx.currentTime + 0.03;
    // 4 times as fast as the first version: 1 s build, half a second of rush, 3/4 s closing
    const BUILD = 1, RUSH = 0.5, CLOSE = 0.75, DUR = BUILD + RUSH + CLOSE;
    const sr = ctx.sampleRate, n = Math.ceil(sr * (DUR + 0.15));
    const whiteBuf = ctx.createBuffer(1, n, sr), pinkBuf = ctx.createBuffer(1, n, sr);
    const wd = whiteBuf.getChannelData(0), pd = pinkBuf.getChannelData(0);
    let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
    for (let i = 0; i < n; i++){
      const w = Math.random() * 2 - 1;
      wd[i] = w;
      b0 = 0.99886 * b0 + w * 0.0555179; b1 = 0.99332 * b1 + w * 0.0750759;
      b2 = 0.96900 * b2 + w * 0.1538520; b3 = 0.86650 * b3 + w * 0.3104856;
      b4 = 0.55000 * b4 + w * 0.5329522; b5 = -0.7616 * b5 - w * 0.0168980;
      pd[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.11;
      b6 = w * 0.115926;
    }
    // the wave's shape over time, 0..1 -- built from smooth pieces
    const sm = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);
    function wave(t){
      if (t < BUILD){ const u = t / BUILD; return 0.42 * Math.pow(u, 1.6); }                 // slow, gathering build
      if (t < BUILD + RUSH){ const u = (t - BUILD) / RUSH;                                   // the fast rush: up to the crest...
        return u < 0.45 ? 0.42 + 0.58 * sm(u / 0.45) : 1 - 0.32 * sm((u - 0.45) / 0.55); }  // ...and starting to fall
      const u = (t - BUILD - RUSH) / CLOSE;                                                   // closing down, softly
      return 0.68 * Math.pow(1 - sm(u), 1.3);
    }
    function foam(t){                                                                         // the airy whoosh, mostly in the rush
      const c = BUILD + RUSH * 0.42, wdt = RUSH * 0.55;
      return Math.exp(-Math.pow((t - c) / wdt, 2)) * 0.95 + wave(t) * 0.18;
    }
    const STEPS = 360;
    const curve = (fn) => { const a = new Float32Array(STEPS); for (let i = 0; i < STEPS; i++) a[i] = fn(DUR * i / (STEPS - 1)); return a; };
    const L = light ? 1.35 : 1.2;                                                            // a lighter, airier feel (same loudness)
    // the wave's body: pink noise through a soft filter that opens as the wave rises
    const pink = ctx.createBufferSource(); pink.buffer = pinkBuf;
    const pinkLp = ctx.createBiquadFilter(); pinkLp.type = 'lowpass'; pinkLp.Q.value = 0.4;
    pinkLp.frequency.setValueCurveAtTime(curve(t => (350 + 4200 * wave(t)) * L), now, DUR);
    const pinkG = ctx.createGain();
    pinkG.gain.setValueCurveAtTime(curve(t => Math.max(0.0001, wave(t)) * (light ? 0.55 : 1.08)), now, DUR);
    // the heaviest low rumble is lifted away so the wave feels lighter, not quieter
    const pinkHp = ctx.createBiquadFilter(); pinkHp.type = 'highpass'; pinkHp.Q.value = 0.5; pinkHp.frequency.value = light ? 120 : 170;
    pink.connect(pinkHp); pinkHp.connect(pinkLp); pinkLp.connect(pinkG);
    // the foam: white noise, light and high, rushing in with the crest
    const white = ctx.createBufferSource(); white.buffer = whiteBuf;
    const whiteHp = ctx.createBiquadFilter(); whiteHp.type = 'highpass'; whiteHp.Q.value = 0.4;
    whiteHp.frequency.setValueCurveAtTime(curve(t => 1400 + 1800 * foam(t)), now, DUR);
    const whiteLp = ctx.createBiquadFilter(); whiteLp.type = 'lowpass'; whiteLp.Q.value = 0.4;
    whiteLp.frequency.setValueCurveAtTime(curve(t => (3500 + 7000 * foam(t)) * Math.min(1.25, L)), now, DUR);
    const whiteG = ctx.createGain();
    whiteG.gain.setValueCurveAtTime(curve(t => Math.max(0.0001, foam(t)) * (light ? 0.2 : 0.215)), now, DUR);
    white.connect(whiteHp); whiteHp.connect(whiteLp); whiteLp.connect(whiteG);
    const mix = ctx.createGain(); mix.gain.value = 1;
    pinkG.connect(mix); whiteG.connect(mix);
    // the swell rolls gently across, like a wave moving along the shore
    let tail = mix;
    if (ctx.createStereoPanner){
      const pan = ctx.createStereoPanner();
      pan.pan.setValueCurveAtTime(curve(t => (light ? 0.35 : -0.35) * Math.cos(Math.PI * t / DUR)), now, DUR);
      mix.connect(pan); tail = pan;
    }
    const out = ctx.createGain();
    out.gain.setValueAtTime(light ? 0.85 : 0.95, now);
    out.gain.setValueAtTime(light ? 0.85 : 0.95, now + DUR - 0.05);
    out.gain.linearRampToValueAtTime(0, now + DUR + 0.05);
    tail.connect(out); out.connect(alSfxOut(ctx));
    pink.start(now); white.start(now);
    pink.stop(now + DUR + 0.1); white.stop(now + DUR + 0.1);
  } catch(e){}
}

/* each time number, on its own, does a full twirl every 4 to 12 seconds --
   sometimes a flat spin, sometimes a 3D flip, either way around */
(function(){
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  [document.getElementById('curTime'), document.getElementById('durTime')].forEach(el => {
    if (!el || !el.animate) return;

      if (document.hidden || document.body.classList.contains('al-time-min') ||
          document.body.classList.contains('al-genie-out') || document.body.classList.contains('al-genie-in')){ next(); return; }
      const way = Math.random() < 0.5 ? 1 : -1;
      const flip = Math.random() < 0.5;
      const turn = a => (flip ? 'perspective(300px) rotateY(' : 'rotate(') + (a * way) + 'deg)';
      el.animate([
        { transform: turn(0) + ' scale(1)' },
        { transform: turn(180) + ' scale(1.35)', offset: 0.5 },
        { transform: turn(360) + ' scale(1)' },
      ], { duration: 1300 + Math.random() * 500, easing: 'cubic-bezier(0.45, 0, 0.25, 1)' });
      next();
    }
    next();
  });
})();

      minSize: 5, maxSize: 11 * Math.min(scale, 1.3),
      dur: 3.6,
      flashSize: 190 * scale
    });
  }

  const W = window.innerWidth, H = window.innerHeight;
  const corners = [
    { x: W * 0.14, y: H * 0.22 },
    { x: W * 0.86, y: H * 0.22 },
    { x: W * 0.14, y: H * 0.78 },
    { x: W * 0.86, y: H * 0.78 }
  ];

  if (isReturning){
    // quicker build, smaller finale
    corners.slice(0, 2).forEach((pt, i) => setTimeout(() => burstAt(pt.x, pt.y, 1), i * 500));
    setTimeout(() => burstAt(W / 2, H * 0.42, 1.5), 1500); // finale
  } else {
    // four corners firing in turn, then one big finale from dead center
    corners.forEach((pt, i) => setTimeout(() => burstAt(pt.x, pt.y, 1), 300 + i * 550));
    setTimeout(() => burstAt(W * 0.3, H * 0.35, 1.15), 2900);
    setTimeout(() => burstAt(W * 0.7, H * 0.5, 1.15), 3500);
    setTimeout(() => burstAt(W / 2, H * 0.4, 1.9), 4700); // the finale
  }
}

/* ---------- volume control (home screen) ----------
   no more knob to grab -- volume now lives entirely in gesture: swipe
   up/down over the covers on touch, or scroll up/down with a trackpad,
   mouse wheel, or Magic Mouse (see the stage wheel handler above). This
   just tracks the current level, persists it, and shows/hides the small
   feedback pill while a volume gesture is in progress. setVolume/getVolume
   are plain function declarations (not inside an IIFE) so they're hoisted
   and callable from the stage touch/wheel handlers defined earlier in
   this script. */
/* the volume feels even from 0 to the top: ears hear loudness on a curve, not in
   straight steps of raw strength, so the number you see (0-100) is turned into
   strength along a matching curve -- every step up or down sounds like about the
   same change, from silence at 0 to full volume at 100 (about a 40 dB range). */
const AL_VOL_CURVE = 4.6;
function alVolumeGain(v){
  v = Math.max(0, Math.min(1, v));
  return v <= 0 ? 0 : (Math.exp(AL_VOL_CURVE * v) - 1) / (Math.exp(AL_VOL_CURVE) - 1);
}
function alVolumeFromGain(g){
  g = Math.max(0, Math.min(1, g));
  return Math.log(g * (Math.exp(AL_VOL_CURVE) - 1) + 1) / AL_VOL_CURVE;
}
/* ---------- volume on iPhone ----------
   Safari on iPhone ignores a page's volume setting for songs (it always plays at
   full strength). The way around it: send the music through the browser's own
   sound mixer, where the page CAN set the loudness. That's only allowed when the
   song storage gives permission (a "CORS" setting); without it the mixer would go
   silent. So this only switches on when (1) the browser ignores normal volume and
   (2) the storage has said yes -- otherwise everything plays exactly as before. */
const AL_VOLUME_LOCKED = (() => {
  try { const a = document.createElement('audio'); a.volume = 0.5; return a.volume !== 0.5; } catch(e){ return false; }
})();
let alVolRouteOk = null, alVolGainNode = null, alVolRouted = false, alVolCheckedAt = 0;
function alCheckVolumeRoutePermission(url){
  if (!AL_VOLUME_LOCKED || !url || !window.fetch) return;
  // ask once -- and if the answer was "no" (or the internet hiccuped), ask again a minute later
  if (alVolRouteOk === true || (alVolRouteOk === false && performance.now() - alVolCheckedAt < 60000) || alVolRouteOk === 'asking') return;
  alVolCheckedAt = performance.now();
  alVolRouteOk = 'asking';
  try {
    const ctl = window.AbortController ? new AbortController() : null;
    fetch(url, { mode:'cors', cache:'no-store', signal: ctl ? ctl.signal : undefined })
      .then(r => { alVolRouteOk = r.ok || r.status === 206; if (ctl) ctl.abort(); })   // only the "yes" was needed, not the song
      .catch(() => { alVolRouteOk = false; });
  } catch(e){ alVolRouteOk = false; }
}
function alPrepareVolumeRouting(nextSrc){
  if (!AL_VOLUME_LOCKED) return;
  if (alVolRouteOk !== true) alCheckVolumeRoutePermission(nextSrc);
  if (alVolRouted || alVolRouteOk !== true) return;
  const ctx = (typeof ensureAudioCtx === 'function') ? ensureAudioCtx() : null;
  if (!ctx || !ctx.createMediaElementSource) return;
  try {
    audio.crossOrigin = 'anonymous';                       // ask the storage for its permission on every song
    const src = ctx.createMediaElementSource(audio);
    alVolGainNode = ctx.createGain();
    alVolGainNode.gain.value = alVolumeGain(currentVolume);
    src.connect(alVolGainNode); alVolGainNode.connect(ctx.destination);
    alVolRouted = true;
    // keep playing with the screen locked / in the background where Safari allows it
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch(e){}
    document.addEventListener('visibilitychange', () => { if (!document.hidden && ctx.state !== 'running') ctx.resume().catch(() => {}); });
  } catch(e){ alVolRouted = false; }
}
// ask the storage early (with the first song on the page), so the answer is ready by the first tap
if (AL_VOLUME_LOCKED){
  setTimeout(() => {
    try {
      const firstSrc = (typeof releases !== 'undefined' && releases[0] && releases[0].tracks[0]) ? releases[0].tracks[0].src : null;
      alCheckVolumeRoutePermission(firstSrc);
    } catch(e){}
  }, 800);
}
let currentVolume = alVolumeFromGain(0.8);
try {
  const sv2 = localStorage.getItem('al_volume_v2');
  const sv = localStorage.getItem('al_volume');
  if (sv2 !== null && !isNaN(parseFloat(sv2))) currentVolume = Math.max(0, Math.min(1, parseFloat(sv2)));
  // a level saved before this change: keep it sounding exactly as loud as it was
  else if (sv !== null && !isNaN(parseFloat(sv))) currentVolume = alVolumeFromGain(parseFloat(sv));
} catch(e){}

function getVolume(){ return currentVolume; }

/* ---------- the volume's watch tick: every ten (10, 20 ... 100, and 0) goes tick...tock,
   with soft little ticks every 2 in between, all exactly as loud as the music at that volume,
   like a little watch, tuned to 432 -- the tick rings on the A at 1728 Hz, the tock
   on the A at 864 Hz, stepping to G (1539.6 / 769.8 Hz) and back to A every 8 seconds.
   It follows the same 16-second cycle as the song-browsing sound,
   flowing between a thin, crisp tick and a fuller, rounder one. ---------- */
let alVolTickLastAt = 0, alVolTickLevel = null, alVolTickTock = false;
function alVolumeTick(newLevel){
  // ticks land right on the tens -- 0, 10, 20 ... 100 -- in whichever direction it's moving
  const now100 = Math.round(newLevel * 100);
  if (alVolTickLevel === null) alVolTickLevel = Math.round(currentVolume * 100);   // where the volume was
  const was = alVolTickLevel;
  alVolTickLevel = now100;
  const crossed = every => now100 > was ? Math.floor(now100 / every) > Math.floor(was / every)
                        : now100 < was ? Math.ceil(now100 / every) < Math.ceil(was / every)
                        : false;
  const onTen = crossed(10);                                     // the tens: a full tick-tock
  const between = !onTen && crossed(2);                          // every 2 in between: a soft little tick
  if (!onTen && !between) return;
  const nowMs = performance.now();
  if (nowMs - alVolTickLastAt < (onTen ? 40 : 60)) return;      // never a machine-gun of ticks
  alVolTickLastAt = nowMs;
  // every tick is exactly as loud as the music is at this volume (the same even curve),
  // so they get quieter and louder right along with it -- silent at 0
  const loud = alVolumeGain(newLevel) * (onTen ? 1 : 0.32);
  if (loud < 0.0005) return;
  const ctx = (typeof ensureAudioCtx === 'function') ? ensureAudioCtx() : null;
  if (!ctx || ctx.state !== 'running') return;
  try {
    const now = ctx.currentTime;
    const thin = (typeof alDookThinness === 'function') ? alDookThinness() : 0.3;
    if (onTen) alVolTickTock = !alVolTickTock;                    // the soft in-between ticks keep the tick's voice
    // in 432 tuning: A (1728 / 864 Hz) for 8 seconds, then G (1539.6 / 769.8 Hz,
    // a whole step lower) for 8 seconds, then back to A -- every tick always in tune
    const onG = ((performance.now() / 1000) % 16) >= 8;
    const A = 1728, G = 432 * Math.pow(2, -2 / 12) * 4;             // 1539.6 Hz
    const freq = (onG ? G : A) / (alVolTickTock ? 1 : 2);          // tick, then a tock an octave lower
    const len = (0.05 - 0.032 * thin) * (onTen ? 1 : 0.6);        // fuller: 50 ms, thinnest: 18 ms (in-between: shorter)
    // a tiny "click" of noise, rung through a tuned filter so it sings on its A
    const n = Math.ceil(ctx.sampleRate * (len + 0.02));
    const buf = ctx.createBuffer(1, n, ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.0025));
    const src = ctx.createBufferSource(); src.buffer = buf;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass';
    bp.frequency.value = freq; bp.Q.value = 18 - 8 * thin;         // fuller ticks ring a touch longer
    const body = ctx.createOscillator(); body.type = 'sine'; body.frequency.value = freq;   // a soft tuned ring
    const bodyG = ctx.createGain();
    bodyG.gain.setValueAtTime(0.0001, now);
    bodyG.gain.exponentialRampToValueAtTime(0.16 * (1 - thin * 0.6), now + 0.003);
    bodyG.gain.exponentialRampToValueAtTime(0.0001, now + len);
    const g = ctx.createGain(); g.gain.value = 2.2 * loud;
    src.connect(bp); bp.connect(g); body.connect(bodyG); bodyG.connect(g);
    g.connect(ctx.destination);
    src.start(now); body.start(now); body.stop(now + len + 0.01);
  } catch(e){}
}

function setVolume(v, persist){
  v = Math.max(0, Math.min(1, v));
  if (Math.abs(v - currentVolume) > 0.0001) alVolumeTick(v);
  currentVolume = v;
  alSfxSetVolume(v);   // the dook, the back whoosh and the love swell follow along
  if (alVolRouted && alVolGainNode){
    // on iPhone: the sound mixer sets the loudness (smoothly, no clicks)
    try { alVolGainNode.gain.setTargetAtTime(alVolumeGain(v), alVolGainNode.context.currentTime, 0.03); } catch(e){ alVolGainNode.gain.value = alVolumeGain(v); }
  } else if (typeof audio !== 'undefined' && audio) audio.volume = alVolumeGain(v);
  const pctEl = document.getElementById('volumeIndicatorPct');
  if (pctEl){
    const n = String(Math.round(v * 100));
    // Al's own hand-drawn colored numbers (no pop-in flash here, so dragging the volume stays smooth)
    try {
      pctEl.innerHTML = Array.from(n).map(d => '<span class="al-vol-digit">' + alDigitSVG(d) + '</span>').join('');
      pctEl.setAttribute('aria-label', n + '%');
      pctEl.classList.add('al-vol-on');
    } catch(e){
      pctEl.textContent = n + '%';
      pctEl.classList.remove('al-vol-on');
    }
  }
  if (persist !== false){
    try { localStorage.setItem('al_volume_v2', String(v)); } catch(e){}
  }
}

/* ---------- home screen track list idle fade: after a couple seconds of no
   interaction the track list gently fades away, same soft feeling as the

/* ---------- home screen track list idle fade: shows itself for a few
   seconds after relevant interaction, then fades away so the covers can be

   moment you start browsing the covers left/right, so it never gets in the

let trackPanelIdleTimer = null;
function revealTrackPanel(holdMs){

(function setupHomeTrackIdleFade(){

  // the whole page -- a stray mouse move (or an arrow-key album swipe)
  // shouldn't keep it glued open or pop it open by accident

/* ---------- trackpad wheel over the track panel: a horizontal (two-finger)
   scroll forwards to the cover flow, same as it already does over the
   empty gaps around the songs -- without this, browsing albums by trackpad
   worked in the gaps but not on top of the visible song text, which felt
   like it was randomly "crossing" between two different behaviors depending
   on exactly where the cursor was. vertical wheel still scrolls the list. ---------- */
trackPanel.addEventListener('wheel', (e) => {
  if (Math.abs(e.deltaX) >= Math.abs(e.deltaY)){
    e.preventDefault();
    ensureAudioCtx();
    targetPos = null;
    velocity = 0;
    flowPos = clampPos(flowPos + e.deltaX / 220);
    hideTrackPanelNow();
    clearTimeout(wheelSnapTimer);
    wheelSnapTimer = setTimeout(() => { targetPos = Math.round(flowPos); }, 120);
  } else {
    e.preventDefault();
    ensureAudioCtx();
    revealTrackPanel();
    homeTrackTargetPos = null;
    homeTrackVelocity = 0;
    const maxIdx = homeTrackMaxIdx();
    homeTrackFlowPos = Math.max(0, Math.min(maxIdx, homeTrackFlowPos + e.deltaY / 90));
    clearTimeout(homeTrackWheelSnapTimer);
    homeTrackWheelSnapTimer = setTimeout(() => { homeTrackTargetPos = Math.round(homeTrackFlowPos); }, 120);
  }
}, { passive:false });
