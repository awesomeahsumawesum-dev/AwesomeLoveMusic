<style>
  :root{
    --bg-top:#131316;
    --bg-bottom:#040405;
    --chrome-hi:#f5f6f8;
    --chrome-mid:#c7c9cf;
    --chrome-lo:#8a8a90;
    --ink:#f2f2f4;
    --ink-dim:#9a9aa2;
    --accent:#3d7fe0;
    --panel: rgba(255,255,255,0.05);
    --panel-border: rgba(255,255,255,0.1);
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%;
    margin:0;
    background: radial-gradient(ellipse at 50% -10%, var(--bg-top), var(--bg-bottom) 72%);
    color:var(--ink);
    font-family:-apple-system, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
    overflow:hidden;
    overscroll-behavior:none;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
  }
  #app{
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    transition:opacity 0.45s ease, transform 0.45s ease;
  }
  #app.rotating-in{
    opacity:0.55;
    transform:scale(0.97);
  }

  /* ---------- TOP BAR ---------- */
  /* Overlaid on top of the cover-flow stage (position:absolute, taken out of
     #app's flex flow) so the stage can extend all the way to the top of the
     screen, with the buttons floating above the artwork. */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:24px;
    padding:calc(16px + env(safe-area-inset-top, 0px)) 16px 10px;
    position:absolute;
    top:0; left:0; right:0;
    z-index:40;
    pointer-events:none;
  }
  .topbar > *{ pointer-events:auto; }

  .topbar .brand{
    font-size:13px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--ink-dim);
    font-weight:600;
  }


  /* ---------- COVER FLOW STAGE ---------- */
  .stage-wrap{
    position:relative;
    flex:1 1 auto;
    min-height:0;
    width:100%;
    overflow:hidden;
  }
  /* soft scrim at the very top, behind the overlaid topbar buttons, so they
     stay readable against whatever colors the album art happens to have
     there -- mirrors the existing bottom scrim below */
  .stage-wrap::before{
    content:'';
    position:absolute;
    left:0; right:0; top:0;
    height:22%;
    background:linear-gradient(to bottom, rgba(4,4,6,0.65), rgba(4,4,6,0.0));
    pointer-events:none;
    z-index:15;
  }
  /* soft scrim behind the overlaid title/story area so it stays readable
     against whatever colors the album art happens to have there */
  .stage-wrap::after{
    content:'';
    position:absolute;
    left:0; right:0; bottom:0;
    height:34%;
    background:linear-gradient(to top, rgba(4,4,6,0.62), rgba(4,4,6,0.0));
    pointer-events:none;
    z-index:15;
  }
  .stage{
    position:absolute;
    inset:0;
    perspective:1400px;
    perspective-origin:50% 40%;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    cursor:grab;
    touch-action:none;
    -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
  }
  .stage.grabbing{ cursor:grabbing; }

  /* ambient room glow, tinted by the active album's artwork */
  .glow{
    position:absolute;
    inset:-12%;
    pointer-events:none;
    z-index:1;
    opacity:0;
    transition:opacity 1.1s ease;
  }
  /* overhead spotlight beam: a bright cone falling from above onto the
     active cover, layered on top of the soft ambient wash */
  .glow::before{
    content:'';
    position:absolute;
    top:-34%;
    left:50%;
    width:48%;
    height:88%;
    transform-origin:top center;
    transform:translateX(-50%) rotate(-3deg);
    clip-path:polygon(47.5% 0%, 52.5% 0%, 100% 100%, 0% 100%);
    background:linear-gradient(to bottom,
      var(--beam-bright, rgba(255,255,255,0.55)) 0%,
      var(--beam-mid, rgba(255,255,255,0.20)) 52%,
      transparent 100%);
    mix-blend-mode:screen;
    filter:
      blur(2px)
      drop-shadow(0 0 3px var(--beam-bright, rgba(255,255,255,0.85)))
      drop-shadow(0 0 16px var(--beam-mid, rgba(255,255,255,0.4)));
    animation:spotlightSway 9s linear infinite, spotlightColorCycle 12s ease-in-out infinite, spotlightPresence 15s ease-in-out infinite;
  }
  /* the beam's own presence breathes independently: none -> some -> lot -> some -> none, every 15s */
  @keyframes spotlightPresence{
    0%{ opacity:0; }
    25%{ opacity:0.5; }
    50%{ opacity:1; }
    75%{ opacity:0.5; }
    100%{ opacity:0; }
  }
  @keyframes spotlightSway{
    0%{ transform:translateX(-50%) rotate(0deg); }
    8.33%{ transform:translateX(-50%) rotate(2deg); }
    16.67%{ transform:translateX(-50%) rotate(3.46deg); }
    25%{ transform:translateX(-50%) rotate(4deg); }
    33.33%{ transform:translateX(-50%) rotate(3.46deg); }
    41.67%{ transform:translateX(-50%) rotate(2deg); }
    50%{ transform:translateX(-50%) rotate(0deg); }
    58.33%{ transform:translateX(-50%) rotate(-2deg); }
    66.67%{ transform:translateX(-50%) rotate(-3.46deg); }
    75%{ transform:translateX(-50%) rotate(-4deg); }
    83.33%{ transform:translateX(-50%) rotate(-3.46deg); }
    91.67%{ transform:translateX(-50%) rotate(-2deg); }
    100%{ transform:translateX(-50%) rotate(0deg); }
  }
  /* the beam's own colorfulness breathes over time: zero color (plain white
     light) -> color -> fully vivid -> color -> zero color again */
  @keyframes spotlightColorCycle{
    0%{
      filter:
        blur(2px) saturate(0)
        drop-shadow(0 0 3px var(--beam-bright, rgba(255,255,255,0.85)))
        drop-shadow(0 0 16px var(--beam-mid, rgba(255,255,255,0.4)));
    }
    25%{
      filter:
        blur(2px) saturate(1)
        drop-shadow(0 0 3px var(--beam-bright, rgba(255,255,255,0.85)))
        drop-shadow(0 0 16px var(--beam-mid, rgba(255,255,255,0.4)));
    }
    50%{
      filter:
        blur(2px) saturate(2.4)
        drop-shadow(0 0 3px var(--beam-bright, rgba(255,255,255,0.85)))
        drop-shadow(0 0 16px var(--beam-mid, rgba(255,255,255,0.4)));
    }
    75%{
      filter:
        blur(2px) saturate(1)
        drop-shadow(0 0 3px var(--beam-bright, rgba(255,255,255,0.85)))
        drop-shadow(0 0 16px var(--beam-mid, rgba(255,255,255,0.4)));
    }
    100%{
      filter:
        blur(2px) saturate(0)
        drop-shadow(0 0 3px var(--beam-bright, rgba(255,255,255,0.85)))
        drop-shadow(0 0 16px var(--beam-mid, rgba(255,255,255,0.4)));
    }
  }

  .flow{
    position:relative;
    width:100%;
    height:100%;
    transform-style:preserve-3d;
    z-index:10;
  }
  .cover-wrap{
    position:absolute;
    top:40%;
    left:50%;
    width:min(50vw, 460px);
    height:min(50vw, 460px);
    transform-style:preserve-3d;
    cursor:pointer;
    will-change: transform;
    touch-action:none;
    -webkit-touch-callout:none;
    -webkit-user-drag:none;
  }
  @media (max-width: 600px){
    .cover-wrap{
      width: min(58vw, 260px);
      height: min(58vw, 260px);
    }
    .stage{
      perspective: 600px;
      perspective-origin: 50% 45%;
    }
    .track-panel{
      width: min(92vw, 420px);
      height: 320px;
    }
    .track-row{
      height: 150px;
      padding: 6px 16px;
    }
    .info .title{
      font-size: 16px;
    }
    .info .meta{
      font-size: 5.5px;
    }
  }
  /* ---------- ALIVE COVERS (subtle breathe + wiggle) ---------- */
  @keyframes coverBreathe{
    0%   { transform: scale(1)     rotate(0deg); }
    25%  { transform: scale(1.045) rotate(1deg); }
    50%  { transform: scale(0.975) rotate(-0.8deg); }
    75%  { transform: scale(1.03)  rotate(0.6deg); }
    100% { transform: scale(1)     rotate(0deg); }
  }
  .cover-art{ animation: coverBreathe 5s ease-in-out infinite; }
  /* stagger each cover so they don't all move in unison */
  .cover-wrap:nth-child(4n+1) .cover-art{ animation-duration:4.6s; animation-delay:-1.3s; }
  .cover-wrap:nth-child(4n+2) .cover-art{ animation-duration:5.6s; animation-delay:-3.1s; }
  .cover-wrap:nth-child(4n+3) .cover-art{ animation-duration:4.2s; animation-delay:-0.7s; }
  .cover-wrap:nth-child(4n)   .cover-art{ animation-duration:5.2s; animation-delay:-4.6s; }
  @media (prefers-reduced-motion: reduce){
    .cover-art{ animation:none; }
  }
  .cover-art{
    position:absolute;
    inset:0;
    border-radius:3px;
    box-shadow: none;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .cover-art::after{
    /* glossy diagonal sheen */
    content:"";
    position:absolute;
    top:0; left:-60%;
    width:45%; height:100%;
    background:linear-gradient(115deg, rgba(255,255,255,0.28), rgba(255,255,255,0) 55%);
    transform:skewX(-18deg);
    pointer-events:none;
  }
  .cover-monogram{
    font-size:15%;
    font-weight:700;
    color:rgba(255,255,255,0.85);
    letter-spacing:0.02em;
    text-shadow:0 2px 8px rgba(0,0,0,0.35);
    z-index:1;
  }
  .cover-reflection{
    position:absolute;
    top:100%;
    left:0; right:0;
    height:70%;
    transform:scaleY(-1);
    border-radius:3px;
    overflow:hidden;
    -webkit-mask-image:linear-gradient(to bottom, rgba(0,0,0,0.34), transparent 68%);
            mask-image:linear-gradient(to bottom, rgba(0,0,0,0.34), transparent 68%);
    opacity:0.9;
  }

  /* ---------- INFO CARD ---------- */
  .info{
    text-align:center;
    padding:16px 20px 0px;
    position:absolute;
    left:0;
    right:0;
    /* the transport bar now floats over the stage rather than reserving
       its own row, so the title needs to clear it directly instead of the
       small 14px gap that used to be enough when the stage stopped short
       of the transport */
    bottom:calc(128px + env(safe-area-inset-bottom, 0px));
    z-index:20;
    pointer-events:none;
    transition:opacity 0.22s ease;
  }
  .info .title, .info-actions{ pointer-events:auto; }
  .info.content-fading{ opacity:0; }
  .info .title{
    font-size:clamp(18px,3vw,26px);
    font-weight:700;
    letter-spacing:-0.01em;
    cursor:pointer;
    animation: titleSuperGlow 6s ease-in-out infinite;
  }
  /* Same sin^2 breathing math as the Story button glow, just on its own
     slow 6s clock: intensity(t) = sin(pi*t/6)^2, peaking at the 3s
     midpoint and easing back to nothing at both ends of the loop. */
  @keyframes titleSuperGlow{
    0%{ text-shadow: 0 0 2px rgba(255,255,255,0), 0 0 8px rgba(255,240,200,0); }
    8.333%{ text-shadow: 0 0 2.4px rgba(255,255,255,0.057), 0 0 9.34px rgba(255,240,200,0.037); }
    16.667%{ text-shadow: 0 0 3.5px rgba(255,255,255,0.212), 0 0 13px rgba(255,240,200,0.137); }
    25%{ text-shadow: 0 0 5px rgba(255,255,255,0.425), 0 0 18px rgba(255,240,200,0.275); }
    33.333%{ text-shadow: 0 0 6.5px rgba(255,255,255,0.637), 0 0 23px rgba(255,240,200,0.412); }
    41.667%{ text-shadow: 0 0 7.6px rgba(255,255,255,0.793), 0 0 26.66px rgba(255,240,200,0.513); }
    50%{ text-shadow: 0 0 8px rgba(255,255,255,0.85), 0 0 28px rgba(255,240,200,0.55); }
    58.333%{ text-shadow: 0 0 7.6px rgba(255,255,255,0.793), 0 0 26.66px rgba(255,240,200,0.513); }
    66.667%{ text-shadow: 0 0 6.5px rgba(255,255,255,0.638), 0 0 23px rgba(255,240,200,0.413); }
    75%{ text-shadow: 0 0 5px rgba(255,255,255,0.425), 0 0 18px rgba(255,240,200,0.275); }
    83.333%{ text-shadow: 0 0 3.5px rgba(255,255,255,0.212), 0 0 13px rgba(255,240,200,0.137); }
    91.667%{ text-shadow: 0 0 2.4px rgba(255,255,255,0.057), 0 0 9.34px rgba(255,240,200,0.037); }
    100%{ text-shadow: 0 0 2px rgba(255,255,255,0), 0 0 8px rgba(255,240,200,0); }
  }
  .info .meta{
    display:none;
  }
  .info .meta span{ margin:0 6px; }

  /* ---------- TRACK PANEL: floats centered over the cover art, like a soft
     overlay, and fades away after idle so the covers can shine on their own ----------
     NOTE: the home-screen song list (with its per-song love/share buttons) has
     been retired -- tapping a cover now plays track 1 and jumps straight into
     fullscreen, so this panel is simply kept out of view rather than deleted
     wholesale (a lot of drag/scroll code still references its element). ---------- */
  .track-panel{ display:none !important; }
  /* ...except when it's being used to show the "Loved Songs" list, which
     is the one case where the main screen still needs a scrollable list of
     songs rather than just the coverflow ---------- */
  .track-panel.favorites-open{ display:block !important; }
  .track-panel{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:min(92vw, 640px);
    height:400px;
    box-sizing:border-box;
    overflow:hidden;
    background:transparent;
    border:none;
    box-shadow:none;
    z-index:22;
    transition:opacity 1s ease;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
    /* only the visible song rows should intercept taps/drags -- the empty
       space around them (padding, gaps between peeking neighbors) passes
       straight through to whatever cover is visible there underneath */
    pointer-events:none;
  }
  /* quick crossfade when switching albums */
  .track-panel.content-fading{ opacity:0; transition:opacity 0.22s ease; }
  /* slow, gentle fade after a few seconds of no interaction, so the artwork
     can just be enjoyed on its own -- same feeling as the fullscreen view */
  .track-panel.idle-hidden{ opacity:0; pointer-events:none; }
  .track-panel.idle-hidden .track-row{ pointer-events:none; }
  .track-row{
    position:absolute;
    left:50%;
    top:50%;
    width:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:8px;
    height:190px;
    box-sizing:border-box;
    padding:8px 22px;
    cursor:pointer;
    will-change:transform, opacity;
    user-select:none;
    -webkit-user-select:none;
    -webkit-user-drag:none;
    -webkit-touch-callout:none;
    pointer-events:auto;
  }
  .track-row-top, .track-row-bottom{
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:100%;
  }
  .track-num{ display:none; }
  .track-name{
    display:block;
    width:100%;
    text-align:center;
    font-weight:800;
    letter-spacing:-0.01em;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    text-shadow:0 2px 10px rgba(0,0,0,0.7), 0 1px 3px rgba(0,0,0,0.8);
  }
  .track-row.playing .track-name{ color:var(--accent); }
  .track-len{
    font-size:clamp(13px, 2.6vw, 20px);
    color:var(--ink-dim);
    font-variant-numeric: tabular-nums;
    flex-shrink:0;
    text-shadow:0 1px 4px rgba(0,0,0,0.7);
  }

  /* ---------- TRACK HEART (save/favorite) -- gets its own little button
     chrome since the panel behind it is fully transparent now ---------- */
  .track-heart{
    flex-shrink:0;
    width:clamp(32px, 6.5vw, 50px);
    height:clamp(32px, 6.5vw, 50px);
    border-radius:50%;
    background:rgba(15,15,18,0.55);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    opacity:0.85;
    transition: transform 0.15s ease, opacity 0.15s ease;
    line-height:1;
  }
  .track-heart img{
    width:50%;
    height:auto;
    display:block;
    filter:grayscale(1);
    transition: filter 0.2s ease;
  }
  .track-heart:hover{ opacity:0.85; transform:scale(1.2); }
  .track-heart.saved{ opacity:1; }
  .track-heart.saved img{ filter:none; }
  .track-heart.pulse{ animation: heartPulse 0.35s ease; }
  @keyframes heartPulse{
    0%{ transform:scale(1); }
    40%{ transform:scale(1.45); }
    100%{ transform:scale(1); }
  }

  @media(max-width:420px){
    .track-plays{ display:none; }
  }

  /* ---------- HEART BURST (on save) ---------- */
  .burst-layer{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:9999;
    overflow:visible;
  }
  .burst-particle{
    position:fixed;
    left:0; top:0;
    pointer-events:none;
    will-change: transform, opacity;
    animation: burstFly var(--dur, 4s) cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  .burst-heart{
    display:block;
    border:0;
  }
  .burst-spark{
    border-radius:50%;
    box-shadow: 0 0 8px 1px currentColor, 0 0 3px currentColor;
  }
  @keyframes burstFly{
    0%{ transform:translate(-50%,-50%) scale(0.3) rotate(0deg); opacity:1; }
    70%{ opacity:1; }
    100%{ transform:translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1) rotate(var(--rot)); opacity:0; }
  }

  /* ---------- DRAG HEART TRAIL (subtle hearts while dragging the cover flow) ---------- */
  .trail-heart{
    position:fixed;
    left:0; top:0;
    width:10px;
    height:auto;
    display:block;
    pointer-events:none;
    z-index:9999;
    opacity:0.72;
    transform:translate(-50%,-50%) scale(1);
    animation: trailFade 0.85s ease-out forwards;
  }
  @keyframes trailFade{
    0%{ opacity:0.72; transform:translate(-50%,-50%) scale(1); }
    100%{ opacity:0; transform:translate(calc(-50% + var(--tx, 0px)), calc(-50% + var(--ty, -16px))) scale(0.4); }
  }

  /* ---------- HEART SHOWER (falls across the whole screen during the welcome celebration) ---------- */
  .shower-heart{
    position:fixed;
    top:-40px;
    display:block;
    pointer-events:none;
    z-index:9997;
    animation-name: heartShowerFall;
    animation-timing-function: linear;
    animation-fill-mode: forwards;
  }
  @keyframes heartShowerFall{
    0%{ transform:translateY(0) rotate(0deg); opacity:0; }
    8%{ opacity:0.9; }
    88%{ opacity:0.9; }
    100%{ transform:translateY(112vh) rotate(var(--rot, 180deg)); opacity:0; }
  }

  /* ---------- OPENING FLASH (a quick bright curtain-rise moment) ---------- */
  .epic-flash{
    position:fixed;
    inset:0;

     the cover flow now fills the whole screen with a single huge number,
     glowing through a rainbow that flows continuously up and down, with

  @media(max-width:500px){
    .story-btn, .donate-btn{ font-size:10px; padding:4px 9px; }
  }

  /* ---- floating hearts ---- */
  .hearts-canvas{
    position:absolute;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:2;
  }
  .heart{
    position:absolute;
    bottom:-60px;
    width:20px;
    height:auto;
    display:block;
    opacity:0;
    animation: floatHeart linear infinite;
    user-select:none;
    filter: blur(0px);
    pointer-events:none;
  }
  @keyframes floatHeart{
    0%   { transform: translateY(0) translateX(0) scale(0.6) rotate(-10deg); opacity:0; }
    8%   { opacity: 0.6; }
    50%  { transform: translateY(-55vh) translateX(var(--dx, 20px)) scale(0.9) rotate(6deg); }
    90%  { opacity: 0.12; }
    100% { transform: translateY(-110vh) translateX(var(--dx, 20px)) scale(1.1) rotate(15deg); opacity:0; }
  }

  /* ---- per-album story button ---- */
  .album-story-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin:0px 4px 26px;
    position:relative;
    z-index:5;
    padding:4px;
    border:none;
    background:transparent;
    cursor:pointer;
    transition:transform 0.18s ease, filter 0.18s ease;
    border-radius:14px;
  }
  .album-story-btn:hover{
    transform:scale(1.08);
    filter:brightness(1.2);
  }
  .story-btn-img{
    display:block;
    height:56px;
    width:auto;
    -webkit-user-drag:none;
    pointer-events:none;
    animation: storyBtnCombinedGlow 120s linear infinite;
  }
  /* Both glows -- the rainbow letter-hug and the white ambient breath --
     live as drop-shadow filters on the transparent PNG itself, so they
     follow the actual alpha shape of the word "STORY" rather than drawing
     a rounded box behind it (box-shadow can't see through a PNG's
     transparency the way drop-shadow can). They run on their own
     independent clocks -- rainbow every 24s, white breath every 30s -- so
     this single timeline runs across their LCM, 120s, sampled every 2s:
       rainbow:   intensity = sin(pi * (t mod 24) / 24)^2, hue = ((t mod 24)/24)*360
       white:     intensity = sin(pi * (t mod 30) / 30)^2

     and out of phase with each other rather than ever pulsing in lockstep. */

  .fs-fly-cover{

     the close button gently fades and blurs almost out of sight -- it stays
     perfectly clickable the whole time, just visually out of the way so it
     doesn't compete with the artwork. Any tap/interaction (see fsRevealClose)
     brings it right back to full strength. */
  .fs-close.faded{

  /* ---- scrollable cover strip inside fullscreen: browse every album, all still breathing ----
     Positioning is driven by JS (same spring/drag physics as the main cover flow) rather than
     native scrolling, so click-and-drag works with a mouse, not just touch. The breathing
     animation lives on the INNER .fs-mini-art element and drag positioning lives on the OUTER
     .fs-mini-cover wrapper -- kept separate so the two transforms never fight each other. */
  .fs-cover-scroll{

  .fs-mini-art::after{

  .fs-mini-cover:nth-child(4n+2) .fs-mini-art{ animation-duration:5.6s; animation-delay:-3.1s; }
  .fs-mini-cover:nth-child(4n+3) .fs-mini-art{ animation-duration:4.2s; animation-delay:-0.7s; }

  /* the centered (selected) cover gets its own breathing animation, restarted fresh
     every time it becomes centered, so it's always visibly breathing right away */
  .fs-mini-cover.fs-centered .fs-mini-art{

  .fs-discoball-wrap{
    position:relative;

    justify-content:center;

    height:46px;

  /* The rainbow only ever appears where the disco-ball drawing itself has ink --
     it's clipped with an alpha mask shaped exactly like Disco.png, so it can
     never spill outside the drawn lines. A 'color' blend keeps the black
     outline black (color blend preserves the backdrop's luminance) while the
     lighter/checkered fills pick up the passing hue -- so the colors read as
     glowing *inside* the lines rather than washing over the whole picture.
     Timing: 8s dark -> 16s rainbow swirl -> 8s dark -> loop (32s total),
     while the swirl itself spins at its own constant, uninterrupted rate
     underneath, so it's already "mid-swirl" the moment it fades back in. */
  .fs-discoball-mask{
    position:absolute;
    inset:0;
    overflow:hidden;
    border-radius:50%;
    mix-blend-mode:color;
    -webkit-mask-repeat:no-repeat;
    mask-repeat:no-repeat;
    -webkit-mask-position:center;
    mask-position:center;
    -webkit-mask-size:contain;
    mask-size:contain;
    animation: discoballGlowCycle 32s ease-in-out infinite;
    z-index:1;
    pointer-events:none;
  }
  .fs-discoball-swirl-inner{
    position:absolute;
    left:-70%; top:-70%;
    width:240%; height:240%;
    background:conic-gradient(from 0deg,
      #ff3b3b, #ff9d3b, #ffe93b, #4dff6a, #3bd4ff, #6a4dff, #ff3bd0, #ff3b3b);
    filter:saturate(1.6) brightness(1.15);
    animation: discoballSpinBoth 18s ease-in-out infinite;
  }
  /* Lights alone no longer races the disco ball's swirl -- it stays at its
     calm resting pace, the same steady speed it has during Love & Shower */
  /* when Love & Shower and the Light Show are BOTH running at once, calm the
     excited pulse down to a quarter of its normal speed on both buttons --
     four times the duration -- so the two together feel steady and warm
     rather than racing each other */
  .fs-overlay.fs-both-glowing .fs-dance-btn.active,
  .fs-overlay.fs-both-glowing .fs-lightshow-btn.active{
    animation:breatheActive 9.6s ease-in-out infinite;
  }
  .fs-overlay.fs-both-glowing .fs-lightshow-btn.active .fs-discoball-swirl-inner{
    animation:discoballSpinBoth 17.6s ease-in-out infinite;
  }
  @keyframes discoballSpin{
    0%{ transform:rotate(0deg); }
    100%{ transform:rotate(360deg); }
  }
  @keyframes discoballGlowCycle{
    0%, 25%   { opacity:0; }
    31%       { opacity:1; }
    69%       { opacity:1; }
    75%, 100% { opacity:0; }
  }
  .fs-discoball-img{
    position:relative;
    z-index:0;
    width:46px;
    height:46px;
    object-fit:contain;
    display:block;
    filter:drop-shadow(0 4px 12px rgba(0,0,0,0.5));
  }
  @media (prefers-reduced-motion: reduce){
    .fs-dance-btn, .fs-lightshow-btn, .fs-discoball-swirl-inner, .fs-discoball-mask{ animation:none; }
    .fs-discoball-mask{ opacity:0; }
    .fs-overlay.lightshow .fs-mini-cover.fs-centered .fs-mini-art,
    .fs-overlay.discomode .fs-mini-cover.fs-centered .fs-mini-art{ animation:none; }
  }
  .fs-overlay.lightshow:not(.discomode) .fs-mini-cover.fs-centered .fs-mini-art{
    animation: lightShowCoverColor 4.5s ease-in-out infinite, loveLightsBreathe 78s ease-in-out infinite var(--al-twirl-dir, alternate);
  }
  @keyframes lightShowCoverColor{
    0%   { box-shadow:0 0 30px 6px rgba(255,215,110,0.3); }
    25%  { box-shadow:0 0 45px 13px rgba(255,158,203,0.38); }
    50%  { box-shadow:0 0 60px 20px rgba(255,158,203,0.45); }
    75%  { box-shadow:0 0 45px 13px rgba(255,215,110,0.38); }
    100% { box-shadow:0 0 30px 6px rgba(255,215,110,0.3); }
  }
  /* full light show: the *only* things that change color are the beams (below)
     and the centered artwork itself -- everything else (neighboring covers,
     the blurred backdrop) stays as it is, so the light genuinely reads as
     landing on one piece of art rather than washing the whole screen the
     same shade at once. The backdrop just dims a touch for contrast. */
  .fs-overlay.discomode .fs-bg{
    animation:discoBgDim 7s ease-in-out infinite;
  }
  @keyframes discoBgDim{
    0%, 100%{ filter:blur(60px) saturate(1.1) brightness(0.4); }
    50%{ filter:blur(60px) saturate(1.1) brightness(0.3); }
  }
  .fs-overlay.discomode .fs-mini-cover.fs-centered .fs-mini-art{
    animation:discoCoverCycleColor 32s ease-in-out infinite, loveLightsBreathe 78s ease-in-out infinite var(--al-twirl-dir, alternate);
  }
  /* exactly what was asked for: 16 seconds of true rest (nothing happening,
     identical to the normal look) -- THEN the effect starts, slowly
     changing the artwork's coloring over the next 16 seconds -- THEN back
     to 16 seconds of rest -- repeating forever. 32s total per full cycle.
     (Transform/breathing lives entirely in loveLightsBreathe below now, so
     this only ever touches color -- the two run independently and never
     cancel each other out.) */
  @keyframes discoCoverCycleColor{
    /* 0s-16s (0%-50%): rest. Flat, unchanging, same as the normal resting look. */
    0%, 50%{
      filter:brightness(1) saturate(1) hue-rotate(0deg);
      box-shadow:none;
    }
    /* 16s-32s (50%-100%): the effect. The artwork's OWN colors actually
       shift here (hue-rotate turns the picture's real colors, not just a
       glow around it), while the glow behind it swells through the cover's
       extracted palette to match. */
    62.5%{
      filter:brightness(1.05) saturate(1.3) hue-rotate(90deg);
      box-shadow:0 0 75px 28px var(--strobe-c3, rgba(160,110,220,0.45));
    }
    75%{
      filter:brightness(1.1) saturate(1.4) hue-rotate(180deg);
      box-shadow:0 0 95px 38px var(--strobe-c4, rgba(80,140,255,0.5));
    }
    87.5%{
      filter:brightness(1.05) saturate(1.3) hue-rotate(270deg);
      box-shadow:0 0 75px 28px var(--strobe-c3, rgba(160,110,220,0.45));
    }
    100%{
      filter:brightness(1) saturate(1) hue-rotate(360deg);
      box-shadow:none;
    }
  }
  /* ---- the shared breathing signature for whenever Lights or Love (either,
     or both) is playing. One full 78-second definition, really three
     26-second passes back to back -- so the same infinite loop naturally
     cycles through all three every time it repeats:
       Pass 1 (0s-26s):  8s slow breathing -> 6s regular breathing ->
                         4s 3D PIROUETTE FLIP (a real turn around the
                         vertical axis, like spinning once on one foot) ->
                         8s slow breathing
       Pass 2 (26s-52s): 8s slow -> 6s regular -> 4s WOBBLE (quick
                         alternating tilts, size pulses, a little
                         side-to-side shimmy) -> 8s slow
       Pass 3 (52s-78s): 8s slow -> 6s regular -> 4s SPIN (one clean flat
                         360 degree turn) -> 8s slow
     Then it loops back to the flip again -- flip, wobble, spin, flip,
     wobble, spin, forever. Runs on `transform` only, so it layers cleanly
     under whichever color effect (or none, for Love alone) is also running
     on box-shadow/filter above -- neither ever interrupts the other. Both
     the Z-axis rotation and the Y-axis (flip) rotation thread continuously
     through the whole 78s rather than resetting, so nothing ever visibly
     snaps backward -- everything lands on a clean multiple of 360 (=0deg)
     right at the loop point. */
  @keyframes loveLightsBreathe{
    /* ---- PASS 1 (0s-26s): the 3D pirouette flip ---- */
    /* 0s-8s: slow breathing */
    0%      { transform: scale(1)     rotate(0deg)      rotateY(0deg)   translateX(0); }
    2.564%  { transform: scale(1.02)  rotate(0.4deg)    rotateY(0deg)   translateX(0); }
    5.128%  { transform: scale(0.99)  rotate(-0.3deg)   rotateY(0deg)   translateX(0); }
    7.692%  { transform: scale(1.015) rotate(0.25deg)   rotateY(0deg)   translateX(0); }
    /* 8s-14s: back to regular breathing speed */
    10.256% { transform: scale(1)     rotate(0deg)      rotateY(0deg)   translateX(0); }
    12.051% { transform: scale(1.05)  rotate(1deg)      rotateY(0deg)   translateX(0); }
    14.103% { transform: scale(0.98)  rotate(-0.9deg)   rotateY(0deg)   translateX(0); }
    16.154% { transform: scale(1.035) rotate(0.7deg)    rotateY(0deg)   translateX(0); }
    /* 14s-18s: the flip -- a real 3D turn around the vertical axis, like
       someone spinning once on one foot, with a little rise-and-lean */
    17.949% { transform: scale(1)     rotate(0deg)      rotateY(0deg)   translateX(0); }
    19.231% { transform: scale(1.1)   rotate(3deg)      rotateY(90deg)  translateX(0); }
    20.513% { transform: scale(1.15)  rotate(-2deg)     rotateY(180deg) translateX(0); }
    21.795% { transform: scale(1.1)   rotate(3deg)      rotateY(270deg) translateX(0); }
    23.077% { transform: scale(1)     rotate(0deg)      rotateY(360deg) translateX(0); }
    /* 18s-26s: slow breathing again (rotateY now locked at 360=0deg for the
       rest of the whole 78s cycle -- it never touches Y again until the loop) */
    25.641% { transform: scale(1.02)  rotate(0.4deg)    rotateY(360deg) translateX(0); }
    28.205% { transform: scale(0.99)  rotate(-0.3deg)   rotateY(360deg) translateX(0); }
    30.769% { transform: scale(1.015) rotate(0.25deg)   rotateY(360deg) translateX(0); }
    33.333% { transform: scale(1)     rotate(0deg)      rotateY(360deg) translateX(0); }
    /* ---- PASS 2 (26s-52s): the wobble/dance ---- */
    /* 26s-34s: slow breathing */
    35.897% { transform: scale(1.02)  rotate(0.4deg)    rotateY(360deg) translateX(0); }
    38.462% { transform: scale(0.99)  rotate(-0.3deg)   rotateY(360deg) translateX(0); }
    41.026% { transform: scale(1.015) rotate(0.25deg)   rotateY(360deg) translateX(0); }
    43.59%  { transform: scale(1)     rotate(0deg)      rotateY(360deg) translateX(0); }
    /* 34s-40s: back to regular breathing speed */
    45.385% { transform: scale(1.05)  rotate(1deg)      rotateY(360deg) translateX(0); }
    47.436% { transform: scale(0.98)  rotate(-0.9deg)   rotateY(360deg) translateX(0); }
    49.487% { transform: scale(1.035) rotate(0.7deg)    rotateY(360deg) translateX(0); }
    51.282% { transform: scale(1)     rotate(0deg)      rotateY(360deg) translateX(0); }
    /* 40s-44s: the wobble -- quick alternating tilts, size pulses, and a
       tiny side-to-side shimmy, like it's dancing for 4 seconds */
    51.923% { transform: scale(1.05)  rotate(6deg)      rotateY(360deg) translateX(-1.5%); }
    52.564% { transform: scale(0.95)  rotate(-6deg)     rotateY(360deg) translateX(1.5%); }
    53.205% { transform: scale(1.06)  rotate(5deg)      rotateY(360deg) translateX(-1.5%); }
    53.846% { transform: scale(0.96)  rotate(-5deg)     rotateY(360deg) translateX(1.5%); }
    54.487% { transform: scale(1.05)  rotate(4deg)      rotateY(360deg) translateX(-1%); }
    55.128% { transform: scale(0.97)  rotate(-4deg)     rotateY(360deg) translateX(1%); }
    55.769% { transform: scale(1.03)  rotate(2deg)      rotateY(360deg) translateX(-0.5%); }
    56.41%  { transform: scale(1)     rotate(0deg)      rotateY(360deg) translateX(0); }
    /* 44s-52s: slow breathing again */
    58.974% { transform: scale(1.02)  rotate(0.4deg)    rotateY(360deg) translateX(0); }
    61.538% { transform: scale(0.99)  rotate(-0.3deg)   rotateY(360deg) translateX(0); }
    64.103% { transform: scale(1.015) rotate(0.25deg)   rotateY(360deg) translateX(0); }
    66.667% { transform: scale(1)     rotate(0deg)      rotateY(360deg) translateX(0); }
    /* ---- PASS 3 (52s-78s): the original clean spin ---- */
    /* 52s-60s: slow breathing */
    69.231% { transform: scale(1.02)  rotate(0.4deg)    rotateY(360deg) translateX(0); }
    71.795% { transform: scale(0.99)  rotate(-0.3deg)   rotateY(360deg) translateX(0); }
    74.359% { transform: scale(1.015) rotate(0.25deg)   rotateY(360deg) translateX(0); }
    76.923% { transform: scale(1)     rotate(0deg)      rotateY(360deg) translateX(0); }
    /* 60s-66s: back to regular breathing speed */
    78.718% { transform: scale(1.05)  rotate(1deg)      rotateY(360deg) translateX(0); }
    80.769% { transform: scale(0.98)  rotate(-0.9deg)   rotateY(360deg) translateX(0); }
    82.821% { transform: scale(1.035) rotate(0.7deg)    rotateY(360deg) translateX(0); }
    84.615% { transform: scale(1)     rotate(0deg)      rotateY(360deg) translateX(0); }
    /* 66s-70s: the spin -- one full, smooth flat 360 degree turn */
    85.897% { transform: scale(1.08)  rotate(90deg)     rotateY(360deg) translateX(0); }
    87.179% { transform: scale(1.1)   rotate(180deg)    rotateY(360deg) translateX(0); }
    88.462% { transform: scale(1.08)  rotate(270deg)    rotateY(360deg) translateX(0); }
    89.744% { transform: scale(1)     rotate(360deg)    rotateY(360deg) translateX(0); }
    /* 70s-78s: slow breathing again, settling at a clean 360deg (=0deg) on
       both axes at the very end so the loop closes seamlessly back into
       the flip at 0% */
    92.308% { transform: scale(1.02)  rotate(360.4deg)  rotateY(360deg) translateX(0); }
    94.872% { transform: scale(0.99)  rotate(359.7deg)  rotateY(360deg) translateX(0); }
    97.436% { transform: scale(1.015) rotate(360.25deg) rotateY(360deg) translateX(0); }
    100%    { transform: scale(1)     rotate(360deg)    rotateY(360deg) translateX(0); }
  }
  /* ---- strobe rig: four beams converge on the centered artwork (~50%/34%,
     the same point the ambient glow targets), each lit straight from the
     cover's own extracted palette. mix-blend-mode:screen means overlapping
     beams add their light together, so the colors actually blend into each
     other right where they land -- exactly like real stage lights aimed at
     one spot. Each beam pulses on its own slow, gentle cycle (well under
     1 flash/sec) so together they read as a lively chase rather than a
     single harsh strobe. Hidden unless the light show is running. */
  .fs-strobe-rig{
    position:absolute;
    inset:0;
    overflow:hidden;
    opacity:0;
    transition:opacity 0.8s ease;
    pointer-events:none;
    mix-blend-mode:screen;
    z-index:211;
  }
  /* the whole light show breathes in and out over a clean 16-second cycle --
     rises up bright, recedes back down to almost nothing, then rises again.
     The beams keep their own real cover-derived colors throughout (no hue-
     shifting here) -- the artwork's own color-change effect, below, is the
     one thing that's meant to shift through color; these just brighten and
     dim so that effect stays clearly visible instead of getting lost in a
     second, competing rainbow sweep. The individual beams keep doing their
     own golden-ratio sweeping and shimmering underneath this. */
  .fs-overlay.discomode .fs-strobe-rig{
    animation:lightShowBreathe16 16s ease-in-out infinite;
  }
  @keyframes lightShowBreathe16{
    0%   { opacity:0.08; filter:brightness(0.75); }
    50%  { opacity:1;    filter:brightness(1.2); }
    100% { opacity:0.08; filter:brightness(0.75); }
  }
  @media (prefers-reduced-motion: reduce){
    .fs-overlay.discomode .fs-strobe-rig{ animation:none; opacity:0.85; }
  }
  /* soft atmosphere right where the fixtures sit -- real light in a room
     always has a bit of visible haze around the source; this quietly
     blends the four beams' origins together instead of them looking like
     four hard-edged shapes that just start at the top of the screen */
  .strobe-haze{
    position:absolute;
    left:0; top:-6%;
    width:100%; height:22%;
    background:radial-gradient(ellipse 60% 100% at 50% 0%,
      rgba(255,255,255,0.35), transparent 75%);
    filter:blur(14px);
    mix-blend-mode:screen;
    opacity:0.6;
  }
  .strobe-beam{
    position:absolute;
    left:0; top:0;
    width:100%;
    /* reaches exactly down to the artwork's convergence point (34% down
       the screen, matching the ambient glow's own target) -- sized this
       way (rather than full height) so the gradient below actually lands
       its color right at the tip instead of past where the shape is cut off */
    height:34%;
    mix-blend-mode:screen;
  }
  .strobe-beam::before{
    content:'';
    position:absolute;
    inset:0;
    background:linear-gradient(to bottom, transparent 0%, var(--strobe-c, #ff5e4d) 58%, var(--strobe-c, #ff5e4d) 100%);
    /* real light isn't flat-colored -- it blooms, and its edges feather
       into the air around it rather than staying knife-sharp. A stronger
       blur here is what kills the "cut-out paper triangle" look. */
    filter:blur(7px) brightness(1.15) saturate(1.4);
  }
  /* the hot white core running down the middle of every beam, same idea as
     a real spotlight's overexposed center with color only showing at the
     edges -- pulled back to a highlight rather than a dominant white fan,
     so the beam's actual COLOR is still the main thing you see */
  .strobe-beam::after{
    content:'';
    position:absolute;
    inset:0;
    background:linear-gradient(to bottom, transparent 0%, rgba(255,255,255,0.55) 76%, var(--strobe-c, #fff) 100%);
    mix-blend-mode:screen;
    filter:blur(5px);
    opacity:0.55;
  }
  /* ---- the math: four fixture positions across the top are placed using
     the golden angle (the fractional part of k*0.618..., the same rule
     behind sunflower-seed spirals and leaf arrangement) instead of evenly-
     guessed spots -- it's how nature spaces things so they never quite
     overlap in a repeating pattern. Each beam's own sweep period is scaled
     by a power of phi (1s, phi, sqrt(phi), phi*sqrt(phi)) so the four
     rhythms are incommensurate: they drift in and out of phase with each
     other forever without ever locking into a mechanical loop. And each
     beam's shimmer runs at exactly phi^2 times its own sweep speed -- a
     real, fixed relationship, not a guess -- so the fast flicker and the
     slow swoop always feel like one coherent motion, never coincidental. */
  .sb1{ animation:strobeSwoop1 6s ease-in-out infinite; animation-delay:-3.7s; transform-origin:34.2% 0%;
    --strobe-c:var(--strobe-c1, #ff5e4d); }
  .sb1::before{ --strobe-c:var(--strobe-c1, #ff5e4d);
    animation:strobeWiggle1 2.3s ease-in-out infinite; transform-origin:34.2% 0%; }
  .sb1::after{ clip-path:polygon(33.2% 0%, 35.2% 0%, 45.7% 100%, 22.7% 100%); }
  .sb2{ animation:strobeSwoop2 9.7s ease-in-out infinite; animation-delay:-6.0s; transform-origin:48.3% 0%;
    --strobe-c:var(--strobe-c2, #ffd76e); }
  .sb2::before{ --strobe-c:var(--strobe-c2, #ffd76e);
    animation:strobeWiggle2 3.7s ease-in-out infinite; transform-origin:48.3% 0%; }
  .sb2::after{ clip-path:polygon(47.3% 0%, 49.3% 0%, 59.8% 100%, 36.8% 100%); }
  .sb3{ animation:strobeSwoop3 7.6s ease-in-out infinite; animation-delay:-4.7s; transform-origin:57.1% 0%;
    --strobe-c:var(--strobe-c3, #6ea8ff); }
  .sb3::before{ --strobe-c:var(--strobe-c3, #6ea8ff);
    animation:strobeWiggle3 2.9s ease-in-out infinite; transform-origin:57.1% 0%; }
  .sb3::after{ clip-path:polygon(56.1% 0%, 58.1% 0%, 68.6% 100%, 45.6% 100%); }
  .sb4{ animation:strobeSwoop4 12.4s ease-in-out infinite; animation-delay:-7.7s; transform-origin:71.2% 0%;
    --strobe-c:var(--strobe-c4, #b06eff); }
  .sb4::before{ --strobe-c:var(--strobe-c4, #b06eff);
    animation:strobeWiggle4 4.7s ease-in-out infinite; transform-origin:71.2% 0%; }
  .sb4::after{ clip-path:polygon(70.2% 0%, 72.2% 0%, 82.7% 100%, 59.7% 100%); }
  /* each: narrow tip at its own golden-angle-placed fixture up top,
     spreading to a wide patch down on the art -- the shimmer just nudges
     the wide bottom edge a few percent side to side */
  @keyframes strobeWiggle1{
    0%, 100%{ clip-path:polygon(32.2% 0%, 36.2% 0%, 57.2% 100%, 11.2% 100%); }
    50%{ clip-path:polygon(32.2% 0%, 36.2% 0%, 63.2% 100%, 17.2% 100%); }
  }
  @keyframes strobeWiggle2{
    0%, 100%{ clip-path:polygon(46.3% 0%, 50.3% 0%, 71.3% 100%, 25.3% 100%); }
    50%{ clip-path:polygon(46.3% 0%, 50.3% 0%, 65.3% 100%, 19.3% 100%); }
  }
  @keyframes strobeWiggle3{
    0%, 100%{ clip-path:polygon(55.1% 0%, 59.1% 0%, 80.1% 100%, 34.1% 100%); }
    50%{ clip-path:polygon(55.1% 0%, 59.1% 0%, 86.1% 100%, 40.1% 100%); }
  }
  @keyframes strobeWiggle4{
    0%, 100%{ clip-path:polygon(69.2% 0%, 73.2% 0%, 94.2% 100%, 48.2% 100%); }
    50%{ clip-path:polygon(69.2% 0%, 73.2% 0%, 88.2% 100%, 42.2% 100%); }
  }
  @keyframes strobeSwoop1{
    0%, 100%{ transform:rotate(-13deg); opacity:0.12; }
    50%{ transform:rotate(11deg); opacity:1; }
  }
  @keyframes strobeSwoop2{
    0%, 100%{ transform:rotate(9deg); opacity:0.15; }
    50%{ transform:rotate(-14deg); opacity:1; }
  }
  @keyframes strobeSwoop3{
    0%, 100%{ transform:rotate(-10deg); opacity:0.12; }
    50%{ transform:rotate(13deg); opacity:1; }
  }
  @keyframes strobeSwoop4{
    0%, 100%{ transform:rotate(12deg); opacity:0.15; }
    50%{ transform:rotate(-9deg); opacity:1; }
  }
  @media (prefers-reduced-motion: reduce){
    .strobe-beam, .strobe-beam::before, .strobe-beam::after{ animation:none !important; opacity:0.55; }
  }
  .sparkle-particle{
    position:absolute;
    pointer-events:none;
    z-index:2;
    filter:drop-shadow(0 2px 6px rgba(0,0,0,0.35));
    animation:sparkleFall var(--dur,3s) ease-in forwards;
  }
  @keyframes sparkleFall{
    0%{ transform:translate(0,0) rotate(0deg) scale(0); opacity:0; }
    10%{ opacity:1; transform:translate(0,0) rotate(20deg) scale(1); }
    100%{ transform:translate(var(--tx,0), var(--ty,140px)) rotate(var(--rot,180deg)) scale(0.5); opacity:0; }
  }
  @media (max-width:600px){
    .fs-bottom-controls{ padding:0 18px calc(24px + env(safe-area-inset-bottom)); }
  }

  /* ---- story modal ---- */
  .story-overlay{
    position:fixed;
    inset:0;
    z-index:100;
    background:rgba(0,0,0,0.62);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    opacity:0;
    transition:opacity 0.28s ease;
  }
  .story-overlay.open{ display:flex; }
  .story-overlay.visible{ opacity:1; }
  .story-card{
    position:relative;
    width:min(680px, 100%);
    max-height:min(78vh, 760px);
    display:flex;
    flex-direction:column;
    background:linear-gradient(to bottom, #1c1c20, #101013);
    border:1px solid rgba(255,255,255,0.14);
    border-radius:16px;
    box-shadow:0 30px 80px rgba(0,0,0,0.7);
    overflow:hidden;
    transform:translateY(14px) scale(0.98);
    transition:transform 0.28s ease;
  }
  .story-overlay.visible .story-card{ transform:translateY(0) scale(1); }
  .story-head{
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:14px;
    padding:16px 20px 14px;
    border-bottom:1px solid rgba(255,255,255,0.08);
    background:rgba(255,255,255,0.03);
  }
  .story-head .story-cover{
    position:relative;
    width:52px; height:52px;
    border-radius:6px;
    box-shadow:none;
    flex-shrink:0;
    cursor:pointer;
  }
  /* tap feedback uses filter, not transform -- transform is driven entirely
     by JS (see startStoryCoverAnim in the script), so nothing here ever
     competes with it for the same property */
  .story-head .story-cover:active .story-cover-art{ filter:brightness(0.82); }
  /* the inner layer carries the actual artwork and the breathing scale.
     Both the breathing (transform, on this inner layer) and the glow
     (box-shadow, on the outer .story-cover) are driven by a single
     requestAnimationFrame loop in JS rather than CSS @keyframes -- each
     frame computes its values from real elapsed time, so there's no
     animation "timeline" for a background tab or a paused/resumed
     browser to get stuck partway through the way a CSS animation can. */
  .story-cover-art{
    position:absolute;
    inset:0;
    border-radius:6px;
    background-size:cover;
    background-position:center;
    background-color:transparent;
  }
  .story-head .story-titles{ min-width:0; flex:1; }
  .story-head .story-album{
    font-size:16px;
    font-weight:700;
    letter-spacing:-0.01em;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .story-head .story-sub{
    margin-top:2px;
    font-size:11px;
    color:var(--ink-dim);
    letter-spacing:0.08em;
    text-transform:uppercase;
  }
  .story-close{
    flex-shrink:0;
    width:32px; height:32px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,0.14);
    background:rgba(255,255,255,0.07);
    color:var(--ink);
    font-size:16px;
    line-height:1;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background 0.18s;
  }
  .story-close:hover{ background:rgba(255,255,255,0.16); }
  /* the album's year / type / song count / time -- shown as its own
     quiet line, sitting between the header and the story text itself,
     so it reads as context you glance at before the story starts */
  .story-meta-line{
    flex-shrink:0;
    padding:12px 24px 0;
    font-size:11.5px;
    font-weight:600;
    color:var(--ink-dim);
    letter-spacing:0.08em;
    text-transform:uppercase;
    text-align:center;
  }
  .story-meta-line:empty{ display:none; }
  .story-meta-line span{ margin:0 7px; opacity:0.55; }
  .story-body{
    overflow-y:auto;
    padding:20px 24px 28px;
    -webkit-overflow-scrolling:touch;
  }
  .story-body p{
    margin:0 0 16px;
    font-size:14.5px;
    line-height:1.72;
    color:rgba(255,255,255,0.88);
    font-family:'Courier New', Courier, monospace;
    letter-spacing:0.01em;
  }
  /* neutral/positive passages read in a bubbly, rounded font instead of the
     typewriter face -- the tone gets picked automatically from the words
     themselves (see classifyStoryTone in the JS), no manual tagging needed */
  .story-body p.tone-happy{
    font-family:'Baloo 2', 'Comic Sans MS', ui-rounded, sans-serif;
    font-weight:600;
    letter-spacing:0.01em;
  }
  .story-body p:last-child{ margin-bottom:0; }
  /* typewriter reveal: every character starts invisible, shrunk down and
     tilted, then pops into place with a little overshoot and a brief flash
     as it "lands" -- more of a dramatic entrance than a plain fade. A word
     wrapper keeps normal word-wrapping intact even though every individual
     letter is its own element. */
  .story-word{ display:inline-block; perspective:400px; }
  .story-char{
    display:inline-block;
    opacity:0;
    transform:translateY(10px) scale(0.4) rotate(-10deg);
    transition:
      opacity 0.22s ease-out,
      transform 0.32s cubic-bezier(0.22, 1.7, 0.36, 1);
  }
  .story-char.revealed{
    opacity:1;
    transform:translateY(0) scale(1) rotate(0deg);
    animation:storyCharFlash 0.5s ease-out;
  }
  @keyframes storyCharFlash{
    0%{ text-shadow:0 0 14px rgba(255,225,150,0.9); }
    100%{ text-shadow:0 0 0 rgba(255,225,150,0); }
  }
  /* the occasional 3D letter-flip -- a single letter briefly tumbles like a
     flip-clock digit or a puzzle piece turning over, then settles right
     back to normal, readable orientation. Only a couple of letters do this
     at any given moment, picked at random, so the text stays comprehensible
     the whole time -- it's a quiet quirk, not a constant effect. Reserved
     for emotionally heavier passages -- see the "happy" trio below for
     neutral/positive ones. */
  .story-char.flip{
    animation:storyCharFlip 0.7s ease-in-out;
  }
  @keyframes storyCharFlip{
    0%{ transform:rotateX(0deg) scale(1); }
    45%{ transform:rotateX(180deg) scale(1.15); }
    100%{ transform:rotateX(360deg) scale(1); }
  }
  /* the happy trio (now a quartet) -- for neutral/positive passages,
     letters get one of four joyful, fuller moments instead of the flip:
     two different 3D twirls (rotateY, distinct from the heavy tone's
     rotateX flip), a happy bounce, or a loving enlarge. Slower and bigger
     than the flip so they feel satisfying rather than quick -- picked at
     random, same light touch otherwise: a couple of letters at a time,
     never the whole passage at once. */
  .story-char.spin-happy{
    animation:storyCharSpinHappy 1.3s ease-in-out;
  }
  @keyframes storyCharSpinHappy{
    0%{ transform:rotateY(0deg) rotate(0deg) scale(1); }
    40%{ transform:rotateY(200deg) rotate(80deg) scale(1.35); }
    70%{ transform:rotateY(330deg) rotate(200deg) scale(1.12); }
    100%{ transform:rotateY(360deg) rotate(360deg) scale(1); }
  }
  .story-char.twirl-happy{
    animation:storyCharTwirlHappy 1.4s ease-in-out;
  }
  @keyframes storyCharTwirlHappy{
    0%{ transform:rotateY(0deg) translateY(0) scale(1); }
    30%{ transform:rotateY(150deg) translateY(-10px) scale(1.25); }
    55%{ transform:rotateY(280deg) translateY(3px) scale(1.1); }
    80%{ transform:rotateY(340deg) translateY(-4px) scale(1.05); }
    100%{ transform:rotateY(360deg) translateY(0) scale(1); }
  }
  .story-char.bounce-happy{
    animation:storyCharBounceHappy 1.1s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes storyCharBounceHappy{
    0%{ transform:translateY(0) scale(1) rotateX(0deg); }
    30%{ transform:translateY(-16px) scale(1.35) rotateX(18deg); }
    55%{ transform:translateY(4px) scale(0.92) rotateX(-10deg); }
    78%{ transform:translateY(-4px) scale(1.06) rotateX(5deg); }
    100%{ transform:translateY(0) scale(1) rotateX(0deg); }
  }
  .story-char.enlarge-happy{
    animation:storyCharEnlargeHappy 1.2s ease-in-out;
  }
  @keyframes storyCharEnlargeHappy{
    0%{ transform:scale(1) rotateY(0deg); }
    40%{ transform:scale(1.75) rotateY(18deg); }
    70%{ transform:scale(1.25) rotateY(-10deg); }
    100%{ transform:scale(1) rotateY(0deg); }
  }
  /* the happy-tone counterpart to the heavy-tone word retype: the whole
     word gives one warm little bounce instead of being backspaced */
  .story-word.word-bounce-happy{
    animation:storyWordBounceHappy 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes storyWordBounceHappy{
    0%{ transform:translateY(0) scale(1); }
    40%{ transform:translateY(-6px) scale(1.12); }
    100%{ transform:translateY(0) scale(1); }
  }
  /* a little heart-balloon that pops up from a super-positive word the
     instant it finishes typing, then drifts and rises away like it's been
     let go -- color picked at random each time, from a warm little palette */
  .story-balloon{
    position:fixed;
    font-size:22px;
    line-height:1;
    pointer-events:none;
    z-index:130;
    transform:translate(-50%, -10px) scale(0.3);
    animation:storyBalloonFloat 1.8s ease-out forwards;
    text-shadow:0 2px 6px rgba(0,0,0,0.35);
  }
  .story-balloon::after{
    content:'';
    position:absolute;
    left:50%; top:100%;
    width:1px; height:14px;
    background:currentColor;
    opacity:0.5;
    transform:translateX(-50%);
  }
  @keyframes storyBalloonFloat{
    0%{ opacity:0; transform:translate(-50%, -10px) scale(0.3); }
    15%{ opacity:1; transform:translate(-50%, -26px) scale(1.2); }
    35%{ opacity:1; transform:translate(calc(-50% + var(--drift, 0px) * 0.35), -56px) scale(1); }
    100%{ opacity:0; transform:translate(calc(-50% + var(--drift, 0px)), -150px) scale(0.9); }
  }
  @media (prefers-reduced-motion: reduce){
    .story-balloon{ animation:none !important; display:none; }
  }
  @media (prefers-reduced-motion: reduce){
    .story-char{ opacity:1 !important; transform:none !important; transition:none !important; animation:none !important; }
  }
  @media (max-width:600px){
    .story-overlay{ padding:12px; }
    .story-card{ max-height:84vh; }
    .story-body{ padding:16px 18px 24px; }
    .story-body p{ font-size:14px; }
  }

  /* ---- favorites empty state ---- */
  .favorites-empty{
    padding:26px 22px;
    text-align:center;
    color:var(--ink-dim);
    font-size:13.5px;
    line-height:1.6;
  }

  ::-webkit-scrollbar{ width:6px; }
  ::-webkit-scrollbar-thumb{ background:rgba(255,255,255,0.15); border-radius:3px; }

  /* ================= Intro Sequence ================= */
  .intro-overlay{
    position:fixed;
    inset:0;
    z-index:100000;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    transition:opacity 0.8s ease;
  }
  .intro-overlay.intro-hide{
    opacity:0;
    pointer-events:none;
  }
  .intro-hearts-bg{
    position:absolute;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:1;
  }
  .intro-mini-heart{
    position:absolute;
    object-fit:contain;
    opacity:0;
    pointer-events:none;
  }
  @keyframes introFloatUp{
    0%{ transform:translateY(0) scale(var(--s,1)); opacity:0; }
    10%{ opacity:0.85; }
    85%{ opacity:0.6; }
    100%{ transform:translateY(-110vh) scale(var(--s,1)); opacity:0; }
  }
  .intro-content{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:36px;
    padding:24px;
    transition:opacity 0.4s ease, transform 0.4s ease;
  }
  .intro-content.intro-fade-out{
    opacity:0;
    transform:scale(0.94);
    pointer-events:none;
  }
  .intro-question-img{
    width:min(72vw, 460px);
    height:auto;
    opacity:0;
    animation:introQuestionIn 1.1s ease forwards, introQuestionBreathe 4.6s ease-in-out 1.1s infinite;
    filter:drop-shadow(0 0 22px rgba(255,255,255,0.08));
  }
  @keyframes introQuestionIn{
    0%{ opacity:0; transform:translateY(14px) scale(0.96); }
    100%{ opacity:1; transform:translateY(0) scale(1); }
  }
  @keyframes introQuestionBreathe{
    0%,100%{ transform:translateY(0) scale(1); }
    50%{ transform:translateY(-3px) scale(1.03); }
  }
  .intro-heart-btn{
    width:min(30vw, 160px);
    height:auto;
    cursor:pointer;
    animation:introBreathe 4s ease-in-out infinite;
    filter:drop-shadow(0 0 26px rgba(255,255,255,0.18));
    -webkit-tap-highlight-color:transparent;
    transition:filter 0.2s ease;
  }
  .intro-heart-btn:hover{ filter:drop-shadow(0 0 34px rgba(255,255,255,0.3)); }
  @keyframes introBreathe{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.09); }
  }
  .intro-heart-btn.intro-tapped{
    animation:none;
    pointer-events:none;
  }
  .intro-burst{
    position:fixed;
    inset:0;
    z-index:3;
    pointer-events:none;
    overflow:hidden;
  }
  .intro-flash{
    position:absolute;
    top:0; left:0;
    width:10px; height:10px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,0.9) 0%, rgba(224,61,111,0.55) 35%, rgba(0,0,0,0) 72%);
    transform:translate(-50%,-50%) scale(0);
    animation:introFlashExpand 1s ease-out forwards;
  }
  @keyframes introFlashExpand{
    0%{ transform:translate(-50%,-50%) scale(0); opacity:1; }
    60%{ opacity:0.9; }
    100%{ transform:translate(-50%,-50%) scale(38); opacity:0; }
  }
  .intro-burst-heart{
    position:absolute;
    top:0; left:0;
    width:20px;height:auto;
    object-fit:contain;
    transform:translate(-50%,-50%) scale(0.4);
    opacity:1;
    animation:introBurstFly 1s cubic-bezier(.15,.7,.3,1) forwards;
    pointer-events:none;
  }
  @keyframes introBurstFly{
    0%{ transform:translate(-50%,-50%) scale(0.4); opacity:1; }
    70%{ opacity:1; }
    100%{ transform:translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1.3); opacity:0; }
  }
  .intro-awesome-wrap{
    position:absolute;
    inset:0;
    z-index:4;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
  }
  .intro-awesome-img{
    width:min(84vw, 680px);
    height:auto;
    opacity:0;
    transform:scale(0.8);
  }
  .intro-awesome-img.intro-awesome-in{
    animation:introAwesomeIn 0.6s cubic-bezier(.2,.8,.3,1.2) forwards,
              introAwesomeBreathe 2.4s ease-in-out 0.6s infinite;
  }
  .intro-awesome-img.intro-awesome-out{
    animation:introAwesomeOut 0.9s ease forwards;
  }
  @keyframes introAwesomeIn{
    0%{ opacity:0; transform:scale(0.75); }
    70%{ opacity:1; transform:scale(1.08); }
    100%{ opacity:1; transform:scale(1); }
  }
  @keyframes introAwesomeBreathe{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.06); }
  }
  @keyframes introAwesomeOut{
    0%{ opacity:1; transform:scale(1.03); }
    100%{ opacity:0; transform:scale(1.12); }
  }
  @media (max-width:600px){
    .intro-content{ gap:26px; }
  }
  /* ---- Planet Awesonia: hand-drawn crayon world above the question ---- */
  .intro-content{ gap:clamp(14px, 3.4vh, 36px); }
  .intro-planet-img{
    width:min(64vw, 34vh, 340px);
    height:auto;
    opacity:0;
    animation:introPlanetIn 1.3s ease forwards, introPlanetFloat 7s ease-in-out 1.3s infinite;
    filter:drop-shadow(0 0 28px rgba(80,170,255,0.28));
  }
  .intro-question-img{ width:min(72vw, 36vh, 460px); }
  /* the planet is a little stage: the still drawing shows first (and stays,
     if a device can't do 3D), then the spinning globe takes its place */
  .intro-planet-img{ position:relative; aspect-ratio:1 / 1; }
  .intro-planet-img > img,
  .intro-planet-img > canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
  }
  /* no crossfade between the flat drawing and the globe (they don't line up,
     so blending them looked glitchy): the globe simply appears on its own,
     and the flat drawing is only shown if a device can't do 3D at all */
  .intro-planet-img > img{ visibility:hidden; }
  .intro-planet-img.no-3d > img{ visibility:visible; }
  .intro-planet-img > canvas{ opacity:0; }
  .intro-planet-img.is-3d > canvas{ opacity:1; }
  /* the planet waits (invisible) until the spinning globe is fully ready,
     then does its usual gentle fade-in -- so the very first thing you see
     is already the round, spinning world */
  .intro-planet-img{ animation-play-state:paused, paused; }
  .intro-planet-img.is-3d,
  .intro-planet-img.no-3d{ animation-play-state:running, running; }
  /* you can roll the globe with a finger or the mouse */
  .intro-planet-img.is-3d{ touch-action:none; cursor:grab; -webkit-user-select:none; user-select:none; }
  .intro-planet-img.is-3d.al-planet-grab{ cursor:grabbing; }

  .intro-heart-btn{ width:min(30vw, 17vh, 160px); }
  @keyframes introPlanetIn{
    0%{ opacity:0; transform:translateY(-14px) scale(0.92) rotate(-4deg); }
    100%{ opacity:1; transform:translateY(0) scale(1) rotate(0deg); }
  }
  @keyframes introPlanetFloat{
    0%,100%{ transform:translateY(0) rotate(0deg) scale(1); }
    25%{ transform:translateY(-6px) rotate(2deg) scale(1.02); }
    50%{ transform:translateY(0) rotate(0deg) scale(1.035); }
    75%{ transform:translateY(-4px) rotate(-2deg) scale(1.02); }
  }
  @media (prefers-reduced-motion: reduce){
    .intro-planet-img{ animation:introPlanetIn 1.3s ease forwards; }
  }

  /* ---- floating hearts behind the mood question, same as the first page ---- */
  .mood-hearts-bg{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:0;
  }
  .mood-overlay > .mood-question,
  .mood-overlay > .mood-grid{ position:relative; z-index:1; }

  /* ---------- What Musical Mood Are You In? ---------- */
  .mood-overlay{
    position:fixed;
    inset:0;
    z-index:99990; /* just beneath the "Do You Love Music?" intro */
    background:#000;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:clamp(22px, 6vh, 64px);
    padding:max(env(safe-area-inset-top), 20px) 4vw max(env(safe-area-inset-bottom), 20px);
    box-sizing:border-box;
    overflow-y:auto;
    transition:opacity 0.7s ease;
  }
  .mood-overlay.mood-leaving{ opacity:0; pointer-events:none; }
  .mood-question{
    position:relative;
    margin:0;
    width:min(90vw, 780px, calc(24vh * 3.04));
    aspect-ratio:2187 / 720;
    flex:none;
  }
  .mood-question img{ display:block; width:100%; height:100%; }
  .mood-q-rainbow{
    position:absolute;
    inset:0;
    overflow:hidden;
    opacity:0;
    -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
    -webkit-mask-position:center; mask-position:center;
    -webkit-mask-size:contain; mask-size:contain;
    pointer-events:none;
  }
  .mood-q-swirl{
    position:absolute;
    left:-20%; top:-180%;
    width:140%; height:460%;
    background:conic-gradient(from 0deg,
      #ff3b3b, #ff9d3b, #ffe93b, #4dff6a, #3bd4ff, #6a4dff, #ff3bd0, #ff3b3b);
    filter:saturate(1.6) brightness(1.15);
    animation:discoballSpinBoth 18s ease-in-out infinite;
  }
  /* slow build up from white into the full rainbow, then it keeps flashing */
  .mood-live .mood-q-rainbow{
    animation:moodQBuild 9s ease-in 0.6s forwards, moodQFlash 3.2s ease-in-out 9.6s infinite;
  }
  .mood-live .mood-question{
    animation:moodQGlowBuild 9s ease-in 0.6s forwards, moodQGlow 6s linear 9.6s infinite;
  }
  @keyframes moodQBuild{ from{ opacity:0; } to{ opacity:1; } }
  @keyframes moodQFlash{
    0%, 100%{ opacity:1; filter:brightness(1.25); }
    50%     { opacity:0.62; filter:brightness(0.95); }
  }
  @keyframes moodQGlowBuild{
    from{ filter:drop-shadow(0 0 0 rgba(255,59,59,0)); }
    to  { filter:drop-shadow(0 0 14px rgba(255,59,59,0.7)); }
  }
  @keyframes moodQGlow{
    0%  { filter:drop-shadow(0 0 14px rgba(255,59,59,0.7)); }
    17% { filter:drop-shadow(0 0 18px rgba(255,157,59,0.7)); }
    33% { filter:drop-shadow(0 0 14px rgba(255,233,59,0.7)); }
    50% { filter:drop-shadow(0 0 18px rgba(77,255,106,0.7)); }
    67% { filter:drop-shadow(0 0 14px rgba(59,212,255,0.7)); }
    83% { filter:drop-shadow(0 0 18px rgba(255,59,208,0.7)); }
    100%{ filter:drop-shadow(0 0 14px rgba(255,59,59,0.7)); }
  }

  .mood-grid{
    display:grid;
    grid-template-columns:repeat(2, minmax(0, 1fr));
    gap:clamp(18px, 5vh, 52px) clamp(14px, 5vw, 56px);
    width:min(92vw, 800px);
  }
  .mood-option{
    font:inherit;
    background:none;
    border:none;
    padding:0;
    margin:0;
    cursor:pointer;
    height:clamp(54px, 12vh, 150px);
    perspective:900px;
    -webkit-tap-highlight-color:transparent;
    border-radius:16px;
  }
  .mood-option:focus-visible{ outline:3px solid #ffe93b; outline-offset:6px; }
  .mood-breathe{
    display:block;
    width:100%;
    height:100%;
    animation:moodBreathe 5.5s ease-in-out infinite;
    transition:filter 0.3s ease;
  }
  .mood-option:nth-child(2) .mood-breathe{ animation-delay:-0.9s; }
  .mood-option:nth-child(3) .mood-breathe{ animation-delay:-1.8s; }
  .mood-option:nth-child(4) .mood-breathe{ animation-delay:-2.7s; }
  .mood-option:nth-child(5) .mood-breathe{ animation-delay:-3.6s; }
  .mood-option:nth-child(6) .mood-breathe{ animation-delay:-4.5s; }
  .mood-option:hover .mood-breathe{ filter:brightness(1.15) drop-shadow(0 0 12px rgba(255,255,255,0.35)); }
  .mood-spin{
    display:block;
    width:100%;
    height:100%;
    object-fit:contain;
    transform-style:preserve-3d;
  }
  .mood-spin.spinning{ animation:moodSpin 2s ease-in-out; }
  .mood-option.mood-picked .mood-breathe{
    animation:moodPicked 0.7s ease-out forwards;
  }
  @keyframes moodBreathe{
    0%, 100%{ transform:scale(0.95); }
    50%     { transform:scale(1.05); }
  }
  @keyframes moodSpin{
    from{ transform:rotateY(0deg); }
    to  { transform:rotateY(360deg); }
  }
  @keyframes moodPicked{
    to{ transform:scale(1.25); filter:brightness(1.4) drop-shadow(0 0 22px rgba(255,255,255,0.6)); }
  }

  /* wide screens (laptops, tablets and phones on their side): three across */
  @media (orientation:landscape) and (min-aspect-ratio: 4/3){
    .mood-grid{
      grid-template-columns:repeat(3, minmax(0, 1fr));
      width:min(92vw, 1100px);
    }
    .mood-option{ height:clamp(44px, 16vh, 150px); }
  }

  @media (prefers-reduced-motion: reduce){
    .mood-breathe, .mood-q-swirl, .mood-spin.spinning{ animation:none; }
    .mood-live .mood-q-rainbow{ animation:none; opacity:1; }
    .mood-live .mood-question{ animation:none; }
  }

  .track-name, .fs-track-name, #relTitle, #storyAlbum{
    font-family:'Awesome Love Notes', -apple-system, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif !important;
    font-weight:400 !important;
    letter-spacing:0.01em !important;
  }

  /* ---- Al's titles breathe: every letter rises + glows slowly in a loving wave ---- */
  .track-name, .fs-track-name, #relTitle, #storyAlbum{
    padding-left:0.06em; padding-right:0.06em;
    animation: alLoveGlow 7s ease-in-out infinite;
  }
  .al-ch{
    display:inline-block;
    transform-origin:50% 85%;
    animation: alBreathe 5.5s ease-in-out infinite;
    animation-delay: calc(var(--i) * -0.32s);
    will-change: transform;
  }
  @keyframes alBreathe{
    0%, 100%{ transform: translateY(0) scale(1); }
    50%     { transform: translateY(-0.045em) scale(1.06); }
  }
  @keyframes alLoveGlow{
    0%, 100%{ text-shadow: 0 2px 10px rgba(0,0,0,0.7), 0 1px 3px rgba(0,0,0,0.8), 0 0 0 rgba(255,140,200,0); }
    50%     { text-shadow: 0 2px 10px rgba(0,0,0,0.7), 0 1px 3px rgba(0,0,0,0.8), 0 0 0.35em rgba(255,140,200,0.55); }
  }
  /* Al's hand-drawn colored numbers: flash bright + saturated when they appear, then breathe */
  .al-digit{
    display:inline-block;
    vertical-align:-0.01em;
    margin:0 0.02em;
    transform-origin:50% 85%;
    animation:
      alDigitPop 2.2s ease-out 1 both,
      alDigitBob 6s ease-in-out 2.2s infinite;
  }
  .al-digit svg{
    display:block; overflow:visible;
    animation:
      alDigitFlash 2.2s ease-out 1 both,
      alDigitGlow 6s ease-in-out 2.2s infinite;
  }
  @keyframes alDigitPop{
    0%  { opacity:0.3; transform:scale(0.85); }
    35% { opacity:1;   transform:scale(1.12); }
    100%{ opacity:1;   transform:scale(1); }
  }
  @keyframes alDigitBob{
    0%, 100%{ transform:translateY(0) scale(1); }
    50%     { transform:translateY(-0.04em) scale(1.07); }
  }
  @keyframes alDigitFlash{
    0%  { filter:saturate(1) brightness(1) drop-shadow(0 0 0 currentColor); }
    35% { filter:saturate(2.8) brightness(2) drop-shadow(0 0 0.16em currentColor); }
    100%{ filter:saturate(1.4) brightness(1.15) drop-shadow(0 0 0.08em currentColor); }
  }
  @keyframes alDigitGlow{
    0%, 100%{ filter:saturate(1.4) brightness(1.15) drop-shadow(0 0 0.08em currentColor); }
    50%     { filter:saturate(2.2) brightness(1.55) drop-shadow(0 0 0.13em currentColor); }
  }
  .al-sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  @media (prefers-reduced-motion: reduce){
    .al-ch, .al-digit, .track-name, .fs-track-name, #relTitle, #storyAlbum{ animation:none !important; }
  }

  .al-fit{ display:inline-block; white-space:nowrap; max-width:none; }
  /* ---- album covers: one random cover in view does a slow 3D spin every 8 seconds ----
     uses the separate `rotate` property so it layers on top of the covers' own breathing
     transform instead of fighting it */
  /* (the 3D spin is driven by a `rotate` transition set from JS, so it layers on top of
     each cover's own breathing animation without ever restarting or fighting it) */
  /* ---- Story button in fullscreen, sitting right above the album covers ---- */
  .fs-story-btn{
    position:absolute;
    left:50%;
    top:calc(48% - min(88vw, 72vh, 620px) / 2 - 10px);
    transform:translate(-50%, -100%);
    z-index:220;
    padding:4px;
    border:none;
    background:transparent;
    cursor:pointer;
    border-radius:14px;
    transition:filter 0.18s ease, opacity 0.3s ease;
    display:none;
  }
  .fs-story-btn.show{ display:block; }
  .fs-story-btn:hover{ filter:brightness(1.2); }
  .fs-story-btn .story-btn-img{ height:min(56px, 7vh); }
  @media (max-width: 600px){
    .fs-story-btn{ top:calc(48% - min(90vw, 58vh, 420px) / 2 - 10px); }
  }
  .story-overlay.over-fs{ z-index:400; }

  /* the Story button now lives only in fullscreen -- the main page gives that space back
     to choosing albums */
  .info .info-actions, #albumStoryBtn{ display:none !important; }

  /* ---- the song that's playing: Al's letters doing a slow stadium wave ---- */
  .now-playing{
    padding-top:0.5em; margin-top:-0.5em;        /* headroom so the wave never gets cut off */
    padding-bottom:0.2em; margin-bottom:-0.2em;
  }
  .now-playing strong{
    font-family:'Awesome Love Notes', -apple-system, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight:400;
    letter-spacing:0.02em;
  }
  .al-wave{
    display:inline-block;
    transform-origin:50% 100%;
    animation: alStadiumWave 6s infinite;
    animation-delay: calc(var(--i) * 0.14s);
  }
  /* each letter stands up and sits back down in turn, like a crowd doing the wave:
     a smooth sine-shaped rise and fall, then rest while the wave travels on */
  @keyframes alStadiumWave{
    0%   { transform: translateY(0)        rotate(0deg);  animation-timing-function: cubic-bezier(0.37, 0, 0.63, 1); }
    7%   { transform: translateY(-0.42em)  rotate(-5deg); animation-timing-function: cubic-bezier(0.37, 0, 0.63, 1); }
    14%  { transform: translateY(0)        rotate(0deg); }
    100% { transform: translateY(0)        rotate(0deg); }
  }
  @media (prefers-reduced-motion: reduce){ .al-wave{ animation:none !important; } }

  /* ---- Loved Songs with nothing loved yet: only the heart ---- */
  .loved-empty-heart{ display:none; }
  body.loved-empty .loved-empty-heart{
    display:flex;
    position:fixed;
    inset:0;
    align-items:center;
    justify-content:center;
    pointer-events:none;
    z-index:20;
  }
  .loved-empty-heart img{
    width:min(42vw, 42vh, 280px);
    height:auto;
    animation: lovedHeartBreathe 4.5s ease-in-out infinite;
    filter: drop-shadow(0 0 28px rgba(255,120,180,0.45));
  }
  @keyframes lovedHeartBreathe{
    0%, 100%{ transform:scale(0.94); }
    50%     { transform:scale(1.06); }
  }
  body.loved-empty #stage,
  body.loved-empty #infoCard,
  body.loved-empty #trackPanel{ visibility:hidden !important; }
  @media (prefers-reduced-motion: reduce){ .loved-empty-heart img{ animation:none; } }
  /* plays counts: Al's colored numbers (and his k / M letters) */
  .track-plays, #playheadPlays, #playsCountNum{
    font-family:'Awesome Love Notes', -apple-system, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight:400;
  }

  .al-wave-heart img{
    height:1.05em; width:auto;
    vertical-align:-0.18em;
    display:inline-block;
    -webkit-user-drag:none;
  }
  .al-choose .al-wave-heart{ margin:0 0.03em; }

  /* volume indicator with Al's numbers */
  .volume-indicator-pct.al-vol-on{
    font-size:min(50vw, 62vh);
    display:flex; align-items:flex-end; justify-content:center;
    letter-spacing:0;
  }
  .al-vol-digit{ display:inline-block; margin:0 0.015em; }
  .al-vol-digit svg{ display:block; overflow:visible; filter:saturate(1.6) brightness(1.2) drop-shadow(0 0 0.06em rgba(255,255,255,0.35)); }
  .al-vol-pct{ font-size:0.62em; line-height:1; margin-left:0.06em; padding-bottom:0.02em; }

  .fs-story-btn.in-controls{
    position:static;
    transform:none;
    top:auto; left:auto;
    padding:2px 4px;
  }
  .fs-story-btn.in-controls .story-btn-img{ height:40px; }

  /* plays: just Al's number, no play-button icon */
  .playhead-plays::before, .track-plays::before{ content:none !important; display:none !important; }

  /* time readouts in Al's numbers */
  .progress-time{
    width:auto;
    min-width:44px;
    font-size:clamp(14px, 3vw, 18px);
    white-space:nowrap;
    overflow:visible;
    display:flex; align-items:center;
  }
  /* keep the numbers clear of the playhead heart, which hangs half off each end of the bar */
  #curTime{ justify-content:flex-start; margin-right:calc(clamp(26px, 6vw, 34px) / 2); }
  #durTime{ justify-content:flex-end;   margin-left:calc(clamp(26px, 6vw, 34px) / 2); }
  .al-t{
    display:inline-block;
    transform-origin:50% 60%;
    will-change:transform;
  }
  .al-t svg{ display:block; overflow:visible; filter:saturate(1.35) brightness(1.1); }
  .al-t-sep{ margin:0 0.04em; color:var(--ink-dim); line-height:1; }

  /* ---- fullscreen: Love heart, Story and Disco ball sized from the space actually free
     around the album cover, and centered in it ---- */
  .fs-overlay{
    --fs-cover: min(88vw, 72vh, 620px);
    --fs-top-space: calc(48vh - var(--fs-cover) / 2);
    --fs-bottom-space: calc(52vh - var(--fs-cover) / 2);
    --fs-btn: clamp(38px, calc(var(--fs-bottom-space) * 0.62), 104px);
    --fs-story-h: clamp(36px, calc(var(--fs-top-space) * 0.6), 104px);
  }
  @media (max-width: 600px){
    .fs-overlay{ --fs-cover: min(90vw, 58vh, 420px); }
  }
  .fs-bottom-controls{
    bottom: max(calc(env(safe-area-inset-bottom) + 8px), calc((var(--fs-bottom-space) - var(--fs-btn)) / 2 - 6px));
    padding: 0 20px;
    gap: calc(var(--fs-btn) * 0.5);
  }
  .fs-dance-heart-icon{ width: var(--fs-btn); }
  .fs-discoball-wrap, .fs-discoball-img{ width: var(--fs-btn); height: var(--fs-btn); }
  .fs-story-btn{
    top: calc(var(--fs-top-space) / 2);
    transform: translate(-50%, -50%);
  }
  .fs-story-btn .story-btn-img{ height: var(--fs-story-h); }
  /* phone sideways: Story rides in the bottom row, matched to the heart + disco ball */
  .fs-story-btn.in-controls{ transform:none; top:auto; }
  .fs-story-btn.in-controls .story-btn-img{ height: calc(var(--fs-btn) * 0.82); }

  /* songs above/below the current one fade out softly at the edges of the list
     instead of being sliced off in a hard line */
  .fs-track-list-viewport{
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 24%, #000 76%, transparent 100%);
            mask-image: linear-gradient(to bottom, transparent 0, #000 24%, #000 76%, transparent 100%);
  }
  /* if the Story picture can't load (e.g. opening index.html straight from Downloads,
     where STORY.png isn't sitting next to it), show STORY in Al's letters instead of a broken box */
  .story-fallback{
    display:inline-block;
    font-family:'Awesome Love Notes', -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-size:calc(var(--fs-story-h, 56px) * 0.62);
    line-height:1.1;
    padding:0.05em 0.2em;
    background:linear-gradient(90deg,#ff3b30,#ff9500,#ffd60a,#34c759,#3d7fe0,#af52de);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    white-space:nowrap;
  }

  /* ---- titles never get their tops or bottoms sliced off ----
     They need overflow:hidden sideways, but that also clipped the tall parts of Al's
     letters, his number dots, and the breathing/pop swell. Extra room above and below
     (cancelled out with negative margins where it matters) gives every glyph space. */
  .fs-track-name{
    padding-top:0.32em; padding-bottom:0.32em;
    line-height:1.35;
  }
  .track-name{
    padding-top:0.3em; padding-bottom:0.3em;
    margin-top:-0.3em; margin-bottom:-0.3em;
    line-height:1.35;
  }

  /* ---- the story is written in Al's own hand-drawn letters ---- */
  .story-body p, .story-body p.tone-happy, .story-sub{
    font-family:'Awesome Love Notes', -apple-system, "Helvetica Neue", Arial, sans-serif !important;
    font-weight:400 !important;
  }
  .story-body p, .story-body p.tone-happy{
    font-size:19px !important;
    line-height:1.8 !important;
    letter-spacing:0.02em !important;
  }
  .story-sub{ font-size:1.05em; letter-spacing:0.02em; }
  .story-al-glyph svg{ display:inline-block; vertical-align:-0.02em; overflow:visible; filter:saturate(1.35) brightness(1.15); }
