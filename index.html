/* ---------- rotate-to-fullscreen: when the device is turned to landscape,
   slide into real browser fullscreen with a soft animation; rotating back
   to portrait gently exits it again ---------- */
(function setupRotateFullscreen(){
  const appEl = document.getElementById('app');
  if (!appEl) return;
  let hasGestured = false;
  document.addEventListener('pointerdown', () => { hasGestured = true; }, { once:true, passive:true });

  // iPhone Safari doesn't support the native Fullscreen API at all for
  // ordinary elements (only desktop browsers and iPad do) -- so on iPhone,
  // requestNativeFullscreen() above silently does nothing. Falling back to
  // the app's own fullscreen "now playing" view guarantees rotating to
  // landscape always does something, everywhere, iPhone included.
  let fsOpenedByRotation = false;
  function handleOrientation(){
    if (!hasGestured || !window.matchMedia) return;
    const isLandscape = isLandscapeNow();
    if (isLandscape){
      appEl.classList.add('rotating-in');
      requestNativeFullscreen();
      // one screen now: turning sideways no longer opens full screen
      setTimeout(() => appEl.classList.remove('rotating-in'), 550);
    } else {
      appEl.classList.add('rotating-in');
      exitNativeFullscreen();
      if (fsOpenedByRotation && typeof fsOverlay !== 'undefined' && fsOverlay && fsOverlay.classList.contains('open')){
        closeFullscreen();
        fsOpenedByRotation = false;
      }
      setTimeout(() => appEl.classList.remove('rotating-in'), 550);
    }
  }
  window.addEventListener('orientationchange', () => setTimeout(handleOrientation, 220));
  if (window.matchMedia){
    window.matchMedia('(orientation: landscape)').addEventListener('change', () => setTimeout(handleOrientation, 220));
  }
})();

/* ---------- swap which releases the cover flow shows ---------- */
function setReleaseView(list, opts){

  if (!(opts && opts.loved)) exitLovedState();
  const playingRel = currentTrack.relIdx !== -1 ? releases[currentTrack.relIdx] : null;
  const playingTrackObj = playingRel ? playingRel.tracks[currentTrack.trackIdx] : null;
  releases.length = 0;
  next.forEach(r => releases.push(r));
  MAX_IDX = releases.length - 1;
  albumColors.length = 0;
  for (let i = 0; i < releases.length; i++) albumColors.push(null);
  if (playingRel){
    // find the playing song in the new view by the song itself
    let ni = -1, nt = -1;
    for (let r = 0; r < releases.length && ni === -1; r++){
      const t = releases[r].tracks.indexOf(playingTrackObj);
      if (t !== -1){ ni = r; nt = t; }
    }
    if (ni === -1){
      audio.pause();
      currentTrack = { relIdx:-1, trackIdx:-1 };
      isPlaying = false;
      updatePlayIcon();
      nowPlaying.innerHTML = '<strong class="al-choose">CHOOSE A SONG</strong>';

  releases.forEach((_, i) => computeAlbumColor(i));
  activeIndex = -1;
  velocity = 0;

}

      // a random song from the whole discography, straight into fullscreen;
      // closing fullscreen lands on the whole discography, same as Anything
      setReleaseView(null);
      const pool = [];
      releases.forEach((rel, r) => rel.tracks.forEach((t, ti) => { if (t.src) pool.push([r, ti]); }));
      if (pool.length){
        const [r, ti] = pool[Math.floor(Math.random() * pool.length)];
        flowPos = r;
        activeIndex = -1;
        syncNearest();
        playTrack(r, ti);
        refreshPlayUI();
      }
    } else if (mood === 'anything'){
      setReleaseView(null);
    } else {
      setReleaseView(MOODS[mood]);
    }

    overlay.classList.add('mood-leaving');
    setTimeout(() => { overlay.style.display = 'none'; }, 750);
  }
  options.forEach(opt => {
    opt.addEventListener('click', () => choose(opt.dataset.mood, opt));
  });

  // wait for the "Do You Love Music?" intro to finish before the page comes alive
  const introOverlayEl = document.getElementById('introOverlay');
  if (introOverlayEl && introOverlayEl.style.display !== 'none'){
    window.addEventListener('introComplete', startMoodPage, { once: true });
  } else {
    startMoodPage();
  }
})();

(function(){

      btn.style.setProperty('--sc1', g[0]);
      btn.style.setProperty('--sc2', g[1] || g[0]);
    }
  }
  function sync(){ check(); requestAnimationFrame(sync); }
  requestAnimationFrame(sync);
  // show it the instant fullscreen opens, without waiting for the next frame
  if (window.MutationObserver) new MutationObserver(check).observe(fsOverlay, { attributes:true, attributeFilter:['class'] });
  btn.addEventListener('pointerdown', (e) => e.stopPropagation());
  btn.addEventListener('click', (e) => {

    openStory(activeIndex);
  });
  // phone turned sideways: there's no room above the cover, so the Story button
  // sits in the middle of the bottom row, between the Love heart and the Disco ball
  const homeParent = btn.parentElement;
  const homeNext = btn.nextSibling;
  const sideways = window.matchMedia ? window.matchMedia('(orientation: landscape) and (max-height: 600px)') : null;
  function placeStoryBtn(){
    return;   // one screen: the Story button always lives up top now
    const row = document.querySelector('.fs-bottom-controls');

      homeParent.insertBefore(btn, homeNext && homeNext.parentNode === homeParent ? homeNext : null);
      btn.classList.remove('in-controls');
    }
  }
  placeStoryBtn();
  if (sideways){

    else if (sideways.addListener) sideways.addListener(placeStoryBtn);
  }
  window.addEventListener('resize', placeStoryBtn);
})();

/* ---------- every 8 seconds, one random album cover that's in view does a 3D spin ---------- */
(function(){
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  function inView(el){
    if (!el.isConnected || el.offsetParent === null && getComputedStyle(el).position !== 'fixed') return false;
    const r = el.getBoundingClientRect();
    if (r.width < 20 || r.height < 20) return false;
    const vw = window.innerWidth, vh = window.innerHeight;
    // at least 60% of the cover has to be on screen
    const ix = Math.max(0, Math.min(r.right, vw) - Math.max(r.left, 0));
    const iy = Math.max(0, Math.min(r.bottom, vh) - Math.max(r.top, 0));
    return (ix * iy) / (r.width * r.height) >= 0.6;
  }
  function spinOne(){
    if (document.hidden) return;
    const fsOpen = fsOverlay.classList.contains('open');
    if (storyOverlay.classList.contains('open')) return;
    // in fullscreen, covers only spin while the disco light show is on
    if (fsOpen && !fsOverlay.classList.contains('discomode')) return;
    const pool = Array.from(document.querySelectorAll(fsOpen ? '.fs-mini-art' : '.cover-art'))
      .filter(el => !el.classList.contains('al-spin') && inView(el));
    if (!pool.length) return;
    const el = pool[Math.floor(Math.random() * pool.length)];
    el.classList.add('al-spin');
    el.style.transition = 'none';
    el.style.rotate = 'y 0deg';
    void el.offsetWidth;                       // lock in the starting angle
    el.style.transition = 'rotate 2.4s ease-in-out';
    el.style.rotate = (Math.random() < 0.5 ? 'y 360deg' : 'y -360deg');   // either way around
    let finished = false;
    const finish = () => {
      if (finished) return; finished = true;
      el.removeEventListener('transitionend', onEnd);
      el.style.transition = 'none';
      el.style.rotate = 'y 0deg';              // 360 and 0 look identical, so no jump
      el.classList.remove('al-spin');
    };
    const onEnd = (e) => { if (e.propertyName === 'rotate') finish(); };
    el.addEventListener('transitionend', onEnd);
    setTimeout(finish, 3000);                  // safety net
  }
  setInterval(spinOne, 8000);
})();

/* ---------- story scrolling: steer the mouse wheel / trackpad straight into the story ----------
   Safari could leave the story stuck in place, so the wheel scrolls the story text directly. */
(function(){
  if (!storyBody) return;
  storyBody.addEventListener('wheel', (e) => {
    const max = storyBody.scrollHeight - storyBody.clientHeight;
    if (max <= 0) return;
    let dy = e.deltaY;
    if (e.deltaMode === 1) dy *= 18;                          // lines
    else if (e.deltaMode === 2) dy *= storyBody.clientHeight; // pages
    e.preventDefault();
    e.stopPropagation();
    storyBody.scrollTop = Math.max(0, Math.min(max, storyBody.scrollTop + dy));
  }, { passive:false });
  // keep wheel turns over the rest of the open story card from moving anything behind it
  storyOverlay.addEventListener('wheel', (e) => { if (!storyBody.contains(e.target)) e.preventDefault(); }, { passive:false });
})();


/* ================= Al's slow, loving motion pack =================
   one gentle animation loop drives: the floating top buttons, the drifting
   song name, the dancing plays button, the squiggle doing the wave, and the
   playhead heart riding it */

/* ---------- the plays number, when revealed, grows bigger while it bounces:
   slow, medium, fast, medium, slow, then one super slow bounce as it fades
   away in a burst of rich, color-changing light ---------- */
const alPlaysBounce = (function(){
  const num = document.getElementById('phPlaysNum');
  // [how long one bounce takes (s), how many bounces, how high (em)]
  const PHASES = [
    [1.20, 2, 0.90],   // slow
    [0.70, 2, 0.60],   // medium
    [0.35, 4, 0.32],   // fast
    [0.70, 2, 0.60],   // medium
    [1.20, 1, 0.90],   // slow
    [2.20, 1, 1.40],   // super slow -- the finale
  ];
  const TOTAL = PHASES.reduce((a, p) => a + p[0] * p[1], 0);       // 10 seconds
  const FINALE_START = TOTAL - PHASES[PHASES.length - 1][0];
  const smooth = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);
  let raf = null, t0 = 0;
  function clear(){
    if (!num) return;
    num.style.transform = ''; num.style.opacity = ''; num.style.filter = '';
  }
  function frame(now){
    const t = (now - t0) / 1000;
    if (t >= TOTAL){ raf = null; clear(); return; }
    // which bounce are we in, and how far through it
    let acc = 0, height = 0, inBounce = 0;
    for (const [d, n, h] of PHASES){
      if (t < acc + d * n){ inBounce = ((t - acc) % d) / d; height = h; break; }
      acc += d * n;
    }
    // a ball's bounce: up and down in a smooth arch, with a tiny squash when it lands
    const lift = Math.sin(Math.PI * inBounce);
    const land = Math.max(0, 1 - Math.min(inBounce, 1 - inBounce) / 0.08);   // near the ground
    const squash = 1 - 0.12 * land;
    // keeps growing the whole way through
    const grow = 1 + 1.6 * smooth(t / FINALE_START) + 0.6 * smooth((t - FINALE_START) / (TOTAL - FINALE_START));
    num.style.transform = 'translateY(' + (-height * lift).toFixed(3) + 'em) scale(' + (grow / squash * (1 + 0.04 * (1 - land))).toFixed(3) + ', ' + (grow * squash).toFixed(3) + ')';
    // the finale: colors get richer and swirl around the rainbow while it fades away
    const f = smooth((t - FINALE_START) / (TOTAL - FINALE_START));
    if (f > 0){
      num.style.opacity = (1 - smooth((t - FINALE_START - 0.4) / (TOTAL - FINALE_START - 0.4))).toFixed(3);
      num.style.filter = 'saturate(' + (1.6 + 2.2 * f).toFixed(2) + ') brightness(' + (0.85 + 0.55 * f).toFixed(2) + ') hue-rotate(' + (f * 360).toFixed(0) + 'deg) drop-shadow(0 0 ' + (0.05 + 0.4 * f).toFixed(2) + 'em rgba(255,255,255,' + (0.5 * f).toFixed(2) + '))';
    } else {
      num.style.opacity = '';
      num.style.filter = '';
    }
    raf = requestAnimationFrame(frame);
  }
  return function start(){
    if (!num) return;
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    if (raf) cancelAnimationFrame(raf);
    t0 = performance.now();
    raf = requestAnimationFrame(frame);
  };
})();

(function alMotionPack(){
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const TAU = Math.PI * 2;

  /* --- bottom Plays button: tap to reveal this song's plays for 10 seconds --- */
  const phWrap = document.getElementById('phPlaysWrap');
  let phTimer = null;
  if (playheadPlays && phWrap){
    playheadPlays.addEventListener('click', (e) => {
      e.stopPropagation();
      if (playheadPlays.classList.contains('no-track')) return;
      if (alPlaysShowOn) return;
      const phImg = phWrap.querySelector('.ph-plays-img');
      const songPlays = trackPlays(currentTrack.relIdx, currentTrack.trackIdx).toLocaleString();
      if (alPlaysGrowThenDance(phImg, songPlays, () => phWrap.classList.remove('al-plays-out'))){
        phWrap.classList.add('al-plays-out');
        return;
      }
      phWrap.classList.add('revealing');
      clearTimeout(phTimer);
      phTimer = setTimeout(() => phWrap.classList.remove('revealing'), 10000);
      alPlaysBounce();
    });
  }

  /* --- the squiggle, cut into thin slices so it can do a slow traveling wave --- */
  const track = document.querySelector('.progress-track');
  const STRIPS = 180;          // fine slices so the bigger wave stays perfectly smooth
  const strips = [];
  const GLOW_STRIPS = 48;
  const glowStrips = [];
  let glowLayer = null;
  if (track && !reduce){
    track.classList.add('al-wavy');
    for (let i = 0; i < STRIPS; i++){
      const st = document.createElement('div');
      st.className = 'al-squiggle-strip';
      track.appendChild(st);
      strips.push(st);
    }
    // a softly blurred, super-saturated copy of the bar sits behind it, so every
    // color glows its own color around the outline -- it rides the same wave
    glowLayer = document.createElement('div');
    glowLayer.className = 'al-squiggle-glow';
    // the glow is made only from the bar's solid paint: the faint haze around the
    // artwork is removed first so it can't light up as colored boxes
    try {
      const src = new Image();
      src.onload = () => {
        const c = document.createElement('canvas');
        c.width = src.naturalWidth; c.height = src.naturalHeight;
        const ctx = c.getContext('2d');
        ctx.drawImage(src, 0, 0);
        const d = ctx.getImageData(0, 0, c.width, c.height);
        const px = d.data;
        for (let i = 3; i < px.length; i += 4){ if (px[i] < 110) px[i] = 0; }
        ctx.putImageData(d, 0, 0);
        document.documentElement.style.setProperty('--squiggle-glow-img', 'url("' + c.toDataURL('image/png') + '")');
        glowLayer.classList.add('ready');
      };
      src.crossOrigin = 'anonymous';
      src.src = SQUIGGLE_BAR_IMG_SRC;
    } catch(e){}
    track.parentNode.insertBefore(glowLayer, track);
    for (let i = 0; i < GLOW_STRIPS; i++){
      const g = document.createElement('div');
      g.className = 'al-squiggle-strip al-glow-strip';
      glowLayer.appendChild(g);
      glowStrips.push(g);
    }
    // lay the slices out in exact pixels so the artwork lines up seamlessly
    const layoutStrips = () => {
      const W = track.clientWidth;
      if (!W) return;
      const lay = (list, n) => {
        const sw = W / n;
        list.forEach((st, i) => {
          st.style.left = (i * sw).toFixed(3) + 'px';
          st.style.width = (sw + 0.6).toFixed(3) + 'px';
          st.style.backgroundSize = W + 'px 100%';
          st.style.backgroundPosition = (-(i * sw)).toFixed(3) + 'px 0';
        });
      };
      lay(strips, STRIPS);
      lay(glowStrips, GLOW_STRIPS);
    };
    layoutStrips();
    window.addEventListener('resize', layoutStrips);
    if (window.ResizeObserver) new ResizeObserver(layoutStrips).observe(track);
  }
  const WAVE_T = 20;      // seconds -- one calm, loving wave every 20 seconds
  const WAVE_K = 1.15;    // how many waves fit across the bar
  // three slow sine waves layered together (with periods that never line up the same way
  // twice), so the meter's motion keeps gently changing like real water
  function waveAt(frac, t, amp){
    return amp * (
        0.62 * Math.sin(TAU * (frac * WAVE_K        - t / WAVE_T))
      + 0.26 * Math.sin(TAU * (frac * WAVE_K * 2.13 + t / 33.7) + 1.3)
      + 0.12 * Math.sin(TAU * (frac * WAVE_K * 0.47 - t / 57.1) + 4.1)
    );
  }

  /* --- top buttons float around their spots, each on its own slow path --- */
  /* --- top buttons roam: each one wanders slowly across the open space at the top,
         dipping lower where nothing's below (the empty sides) and staying high over the
         album cover, so they explore without ever covering the art --- */
  const floaters = [...document.querySelectorAll('.topbar .story-btn, .topbar .favorites-btn, .topbar .brand-logo, .topbar .total-plays-top, .topbar .games-link, .topbar .al-top-disco, .topbar .al-top-story, .topbar .al-notes-btn, .topbar .al-prod-btn')]
    .map((el, k) => ({ el, tx: 110 + k * 14.3, ty: 26 + k * 4.1, px: k * 2.35, py: k * 1.7, bx: 0, by: 0, w: 0, h: 0, x: 0, y: 0, top: 0, bottom: 0,
           spinEvery: 13 + k * 2.6, spinOff: k * 4.1, wob: 9 + (k % 3) * 3, wobT: 5.5 + k * 0.9 }));
  let roamCovers = [], roamMeasuredAt = -1e9, roamW = 0, roamH = 0;
  function measureRoam(now){
    roamW = window.innerWidth; roamH = window.innerHeight;
    floaters.forEach(f => {
      const prev = f.el.style.translate;
      f.el.style.translate = '0 0';
      const r = f.el.getBoundingClientRect();
      f.bx = r.left + r.width / 2; f.by = r.top + r.height / 2; f.w = r.width; f.h = r.height;
      f.el.style.translate = prev;
    });
    roamCovers = [...document.querySelectorAll('.cover-wrap')].map(c => c.getBoundingClientRect()).filter(r => r.width > 0);
    roamMeasuredAt = now;
  }
  const smooth = (e0, e1, x) => { const t = Math.max(0, Math.min(1, (x - e0) / (e1 - e0))); return t * t * (3 - 2 * t); };
  // how far down a button may wander at horizontal position x
  function roamFloor(x, halfW){
    const topbarFloor = 104;
    let floor = topbarFloor;                         // the top band; never down the open sides
    roamCovers.forEach(r => {
      // the closer x is to sitting over this cover, the more its top edge acts as a ceiling-floor
      const over = smooth(r.left - halfW - 70, r.left - halfW + 10, x) * (1 - smooth(r.right + halfW - 10, r.right + halfW + 70, x));
      const limit = Math.max(topbarFloor * 0.55, r.top - 6);
      floor = floor * (1 - over) + Math.min(floor, limit) * over;
    });
    return Math.max(topbarFloor * 0.55, floor);
  }

  const strong = () => nowPlaying && nowPlaying.querySelector('strong');
  let meterTick = false;

  function frame(now){
    requestAnimationFrame(frame);
    if (document.hidden || reduce) return;
    const t = now / 1000;

    if (now - roamMeasuredAt > 1500 || roamW !== window.innerWidth || roamH !== window.innerHeight) measureRoam(now);
    floaters.forEach(f => {
      if (!f.w) return;
      const margin = 10 + f.w / 2;
      const u = 0.5 + 0.5 * Math.sin(TAU * t / f.tx + f.px);           // left <-> right, very slow
      const x = margin + u * Math.max(0, roamW - 2 * margin);
      const v = 0.5 + 0.5 * Math.sin(TAU * t / f.ty + f.py);           // up <-> down
      const top = 6 + f.h / 2;
      const bottom = roamFloor(x, f.w / 2) - f.h / 2;
      f.x = x; f.y = top + v * Math.max(0, bottom - top); f.top = top; f.bottom = Math.max(top, bottom);
    });
    // gently keep them from piling on top of each other
    for (let pass = 0; pass < 3; pass++){
      for (let i = 0; i < floaters.length; i++){
        for (let j = i + 1; j < floaters.length; j++){
          const a = floaters[i], b = floaters[j];
          if (!a.w || !b.w) continue;
          const dx = b.x - a.x, dy = b.y - a.y;
          const need = (Math.max(a.w, a.h) + Math.max(b.w, b.h)) / 2 + 10;
          const d = Math.hypot(dx, dy) || 0.01;
          if (d < need){
            const push = (need - d) / 2;
            const ux = dx / d, uy = dy / d;
            a.x -= ux * push; a.y -= uy * push;
            b.x += ux * push; b.y += uy * push;
          }
        }
      }
    }
    floaters.forEach(f => {
      if (!f.w) return;
      const x = Math.max(10 + f.w / 2, Math.min(roamW - 10 - f.w / 2, f.x));
      const y = Math.max(f.top, Math.min(Math.max(f.top, roamFloor(x, f.w / 2) - f.h / 2), f.y));
      f.el.style.translate = (x - f.bx).toFixed(1) + 'px ' + (y - f.by).toFixed(1) + 'px';
      // a gentle sway all the time, and every so often a full spin --
      // alternating a 3D twirl (around the up-down axis) and a flat spin
      const cyc = (t + f.spinOff) / f.spinEvery;
      const n = Math.floor(cyc), ph = (cyc - n) * f.spinEvery;      // seconds into this cycle
      const SPIN = 2.4;
      if (ph < SPIN){
        const e = 0.5 - 0.5 * Math.cos(Math.PI * ph / SPIN);         // ease in and out
        // each spin randomly picks a way to turn -- sometimes one way, sometimes the other
        const way = alSpinWay(n, f.spinOff);
        f.el.style.rotate = (n % 2 ? 'z ' : 'y ') + (e * 360 * way).toFixed(1) + 'deg';
      } else {
        f.el.style.rotate = 'z ' + (f.wob * Math.sin(TAU * (ph - SPIN) / f.wobT)).toFixed(2) + 'deg';
      }
    });

    // song name: drifts left and right while it does its wave, never past the edges
    const sEl = strong();
    if (sEl && nowPlaying.clientWidth){
      const npCs = getComputedStyle(nowPlaying);
      const npInner = nowPlaying.clientWidth - (parseFloat(npCs.paddingLeft) || 0) - (parseFloat(npCs.paddingRight) || 0);
      const slack = Math.max(0, (npInner * 0.97 - sEl.getBoundingClientRect().width) / 2);
      const amp = Math.min(46, slack);
      sEl.style.display = 'inline-block';
      sEl.style.translate = (amp * Math.sin(TAU * t / 13)).toFixed(2) + 'px 0';
    }

    // the Plays button / revealed plays: slides side to side and flips back and forth, dancing
    if (phWrap){
      const x = 8 + 8 * Math.sin(TAU * t / 11);
      const flip = 38 * Math.sin(TAU * t / 9);
      phWrap.style.translate = x.toFixed(2) + 'px 0';
      phWrap.style.rotate = 'y ' + flip.toFixed(1) + 'deg';
    }

    // squiggle wave + the heart riding it (the wave is so slow that 30 updates
    // a second look perfectly smooth, and it leaves more power for the music)
    meterTick = !meterTick;
    if (strips.length && meterTick){
      const h = track.clientHeight || 30;
      const amp = Math.max(6, h * 0.36);
      for (let i = 0; i < STRIPS; i++){
        strips[i].style.transform = 'translateY(' + waveAt((i + 0.5) / STRIPS, t, amp).toFixed(2) + 'px)';
      }
      for (let i = 0; i < GLOW_STRIPS; i++){
        glowStrips[i].style.transform = 'translateY(' + waveAt((i + 0.5) / GLOW_STRIPS, t, amp).toFixed(2) + 'px)';
      }
      // every 50 seconds the whole love meter slowly turns a full circle, like a ribbon spinning
      const FLIP_EVERY = 50, FLIP_LEN = 9;
      const fp = (t % FLIP_EVERY);
      if (fp < FLIP_LEN){
        const e = 0.5 - 0.5 * Math.cos(Math.PI * fp / FLIP_LEN);
        progressBar.style.rotate = 'x ' + (e * 360 * alSpinWay(Math.floor(t / FLIP_EVERY), 9.9)).toFixed(1) + 'deg';
      } else if (progressBar.style.rotate !== 'x 0deg'){
        progressBar.style.rotate = 'x 0deg';
      }
      const pct = parseFloat(progressThumb.style.left) || 0;
      progressThumb.style.translate = '0 ' + waveAt(pct / 100, t, amp).toFixed(2) + 'px';
    }
  }
  requestAnimationFrame(frame);
})();

/* ---------- Story picture safety net ---------- */
(function(){
  document.querySelectorAll('.fs-story-btn .story-btn-img, .album-story-btn .story-btn-img').forEach(img => {
    const swap = () => {
      if (!img.isConnected) return;
      const span = document.createElement('span');
      span.className = 'story-fallback';
      span.textContent = 'STORY';
      img.replaceWith(span);
    };
    if (img.complete && img.naturalWidth === 0) swap();
    else img.addEventListener('error', swap, { once:true });
    // some browsers report a missing local file late or not at all -- check again shortly
    setTimeout(() => { if (img.isConnected && img.complete && img.naturalWidth === 0) swap(); }, 1500);
    window.addEventListener('load', () => { if (img.isConnected && img.complete && img.naturalWidth === 0) swap(); });
  });
})();

<script>
/* ---------- Al's Music Notes button: each song's key, its length in hours /
   minutes / seconds, and its length in Al's own 1/16 time ---------- */
(function(){
  const btn = document.getElementById('alNotesBtn');
  const overlay = document.getElementById('alNotesOverlay');
  const card = document.getElementById('alNotesCard');
  const closeBtn = document.getElementById('alNotesClose');
  if (!btn || !overlay) return;
  const esc = (t) => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const hand = (t) => (typeof alHandText === 'function') ? alHandText(t) : esc(t);
  const secsOf = (d) => (typeof parseDuration === 'function') ? parseDuration(d) : 0;
  const alCount = (secs) => (typeof alSlowTime === 'function') ? alSlowTime(secs) : String(Math.floor(secs / 16));
  const words = (secs) => (typeof alLengthWords === 'function') ? alLengthWords(secs) : '';
  const dot = '<span class="al-dot">&middot;</span>';

  let notesRelIdx = 0;
  function whichRelease(){
    return releases[notesRelIdx] || releases[0];
  }
  function pickReleaseForOpen(){
    const storyOpen = typeof storyOverlay !== 'undefined' && storyOverlay.classList.contains('open');
    const i = storyOpen ? storyRelIdx : activeIndex;
    notesRelIdx = i >= 0 ? i : 0;
  }
  // the key, BIG, in Al's alphabet -- every letter its own color, glowing,
  // and taking turns to dance, twirl, disco, flip, backflip and shake
  const KEY_COLORS = ['#ff4f7b','#ff9a3c','#ffd93d','#5ee36a','#3fc1ff','#8a7dff','#ff6fd8'];
  function bigKey(key, small, trackIdx){
    const word = String(key).toUpperCase();
    const long = word.length > 3;
    let h = '<div class="al-key-big' + (long ? ' al-key-long' : '') + (small ? ' al-key-small' : '') + '" data-track="' + (trackIdx || 0) + '" role="button" aria-label="Key of ' + esc(word) + ' -- tap to play">';
    let n = 0;
    word.split(' ').forEach((w, wi) => {
      if (wi) h += '<span class="al-key-gap"> </span>';
      h += '<span class="al-key-word">';
      for (const ch of w){
        const c = KEY_COLORS[(n * 3 + Math.floor(Math.random() * 7)) % KEY_COLORS.length];
        h += '<span class="al-key-ch" style="--kc:' + c + ';--kd:' + (n * 0.37).toFixed(2) + 's">' + hand(ch) + '</span>';
        n++;
      }
      h += '</span>';
    });
    return h + '</div>';
  }
  function build(){
    const rel = whichRelease();
    if (!rel) return;
    const total = rel.tracks.reduce((s, t) => s + secsOf(t.duration), 0);
    const keysOf = rel.tracks.map(t => t.key).filter(Boolean);
    const sharedKey = keysOf.length === rel.tracks.length && keysOf.every(k => k === keysOf[0]) ? keysOf[0] : null;
    let html = '<img class="al-notes-top-img" src="' + btn.querySelector('img').src + '" alt="">';
    html += '<div class="al-notes-title">' + hand(rel.title) + '</div>';
    if (rel.tracks.length === 1 && rel.tracks[0].key) html += bigKey(rel.tracks[0].key, false, 0);   // a single: one big key
    const totalParts = [hand(words(total)), '<span class="al-pink">' + hand('AL Time ' + alCount(total)) + '</span>'];
    if (rel.tracks.length > 1) totalParts.unshift(hand(rel.tracks.length + ' Songs'));
    html += '<div class="al-notes-total">' + totalParts.map(x => '<span class="al-np">' + x + '</span>').join(dot) + '</div>';
    if (rel.tracks.length > 1){
      rel.tracks.forEach((t, ti) => {
        const secs = secsOf(t.duration);
        const parts = [hand(words(secs)), '<span class="al-pink">' + hand('AL Time ' + alCount(secs)) + '</span>'];
        html += '<div class="al-notes-song">' +
          '<div class="al-notes-song-name">' + hand(t.title) + '</div>' +
          (t.key ? bigKey(t.key, true, ti) : '') +   // every song shows its own key
          '<div class="al-notes-song-info">' + parts.map(x => '<span class="al-np">' + x + '</span>').join(dot) + '</div></div>';
      });
    }
    card.innerHTML = html;
    card.scrollTop = 0;
    startKeyDance();
  }
  // every little while a few letters each do a move
  const KEY_MOVES = ['k-dance', 'k-twirl', 'k-disco', 'k-flip', 'k-backflip', 'k-shake', 'k-spin'];
  const NUM_MOVES = ['n-spin', 'n-twirl', 'n-flip', 'n-spin-back'];
  let keyDanceTimer = null;
  function startKeyDance(){
    clearInterval(keyDanceTimer);
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const go = () => {
      if (!overlay.classList.contains('open')){ clearInterval(keyDanceTimer); return; }
      // the numbers: every so often one takes a slow spin, then rests a good while
      const digits = [...card.querySelectorAll('.al-meta-digit')].filter(d => !d.dataset.moving);
      const cr = card.getBoundingClientRect();
      const seen = digits.filter(d => { const b = d.getBoundingClientRect(); return b.bottom > cr.top && b.top < cr.bottom; });
      if (seen.length && Math.random() < 0.85){
        const d = seen[Math.floor(Math.random() * seen.length)];
        const mv = NUM_MOVES[Math.floor(Math.random() * NUM_MOVES.length)];
        d.dataset.moving = '1';
        d.classList.add(mv);
        d.addEventListener('animationend', function done(e){
          if (e.target !== d) return;
          d.classList.remove(mv);
          d.removeEventListener('animationend', done);
          setTimeout(() => { delete d.dataset.moving; }, 6000);   // a nice long rest before it spins again
        });
      }
      const chars = [...card.querySelectorAll('.al-key-ch')].filter(c => !c.dataset.moving);
      const r = card.getBoundingClientRect();
      const visible = chars.filter(c => { const b = c.getBoundingClientRect(); return b.bottom > r.top && b.top < r.bottom; });
      const pickN = Math.min(visible.length, Math.random() < 0.7 ? 1 : 2);
      for (let i = 0; i < pickN; i++){
        const c = visible.splice(Math.floor(Math.random() * visible.length), 1)[0];
        const mv = KEY_MOVES[Math.floor(Math.random() * KEY_MOVES.length)];
        c.dataset.moving = '1';
        c.classList.add(mv);
        c.addEventListener('animationend', function done(e){
          if (e.target !== c) return;
          c.classList.remove(mv);
          setTimeout(() => { delete c.dataset.moving; }, 4000);   // rests awesomely before its next move
          c.removeEventListener('animationend', done);
        });
      }
    };
    go();
    keyDanceTimer = setInterval(go, 1500);
  }
  function open(){
    pickReleaseForOpen();
    build();
    overlay.classList.add('open');
    requestAnimationFrame(() => requestAnimationFrame(() => overlay.classList.add('visible')));
  }
  function close(){
    overlay.classList.remove('visible');
    setTimeout(() => { if (!overlay.classList.contains('visible')) overlay.classList.remove('open'); }, 650);
  }
  btn.addEventListener('click', (e) => { e.stopPropagation(); open(); });

  // press a letter of the key: that song plays (press again to pause / play)
  card.addEventListener('click', (e) => {
    const box = e.target.closest('.al-key-big');
    if (!box || alJustDragged(overlay)) return;
    const ti = Number(box.dataset.track) || 0;
    const ri = notesRelIdx;
    if (!releases[ri] || !releases[ri].tracks[ti]) return;
    try { ensureAudioCtx(); } catch(err){}
    if (currentTrack.relIdx === ri && currentTrack.trackIdx === ti && audio.src) togglePlay();
    else playTrack(ri, ti);
    box.querySelectorAll('.al-key-ch').forEach((c, k) => {
      if (c.dataset.moving) return;
      c.dataset.moving = '1';
      setTimeout(() => {
        c.classList.add('k-backflip');
        c.addEventListener('animationend', function done(ev){
          if (ev.target !== c) return;
          c.classList.remove('k-backflip'); delete c.dataset.moving;
          c.removeEventListener('animationend', done);
        });
      }, k * 90);
    });
  });

  // swipe (or left / right arrow keys) to move between the songs and albums,
  // the same direction as the cover wheel -- the wheel follows along
  let swapBusy = false;
  function neighbor(dir){
    const i = notesRelIdx + dir;
    return (i >= 0 && i < releases.length) ? i : -1;
  }
  function swap(dir){
    if (swapBusy || !overlay.classList.contains('open')) return;
    const next = neighbor(dir);
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (next === -1){
      if (!reduce){ if (alFlowCurrentF(card)) alFlowSpringBack(card); else card.animate([alFlowPoseFrames(0), alFlowPoseFrames(-dir * 0.08), alFlowPoseFrames(0)], { duration:520, easing:'cubic-bezier(0.22, 1, 0.36, 1)' }); }
      return;
    }
    swapBusy = true;
    // swiping only browses -- the music plays when a letter of a key is pressed
    try {
      if (fsOverlay && fsOverlay.classList.contains('open')){ fsVelocity = 0; fsTargetPos = next; }
      else { velocity = 0; targetPos = next; }
    } catch(err){}
    if (reduce){ alFlowClear(card); notesRelIdx = next; build(); swapBusy = false; return; }
    const ms = alFlowSwap(card, dir, () => { notesRelIdx = next; build(); });
    setTimeout(() => { swapBusy = false; }, ms);
  }
  (function(){
    alAttachSwipe(overlay, swap, card);
    document.addEventListener('keydown', (e) => {
      if (!overlay.classList.contains('visible')) return;
      if (e.key === 'ArrowRight' || e.key === 'ArrowLeft'){
        e.preventDefault(); e.stopImmediatePropagation();
        swap(e.key === 'ArrowRight' ? 1 : -1);
      }
    }, true);
  })();
  // Al's own back arrow (flipping, like on the stories), with the whoosh-back sound
  closeBtn.classList.add('al-back-btn');
  closeBtn.title = 'Go back';
  closeBtn.setAttribute('aria-label', 'Go back');
  if (typeof AL_BACK_ARROW !== 'undefined'){
    closeBtn.innerHTML = '<span class="al-back-flip"><img src="' + AL_BACK_ARROW + '" alt="" draggable="false"></span>';
  }
  const goBack = () => {
    if (!overlay.classList.contains('visible')) return;
    try { alPageTurnBackSound(); } catch(err){}
    close();
  };
  closeBtn.addEventListener('click', goBack);
  overlay.addEventListener('click', (e) => { if (e.target === overlay && !alJustDragged(overlay)) goBack(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && overlay.classList.contains('open')){ e.stopImmediatePropagation(); goBack(); }
  }, true);
  // hide the button while the full-screen player is open
  const fs = document.getElementById('fsOverlay');
  if (fs) new MutationObserver(() => document.body.classList.toggle('fs-open', fs.classList.contains('open')))
    .observe(fs, { attributes:true, attributeFilter:['class'] });
  window.openAlNotes = open;
})();
</script>

<script>
/* ================= AL: whole-page stories + music notes, dancing words, CHOOSE A SONG fit ================= */
(function(){
  const rnd32 = () => (-Math.random() * 32).toFixed(2) + 's';

  /* ---- biggest size that fits: grow the font until the box would scroll ---- */
  function fitBox(sizeEl, scrollEl, lo, hi){
    const fits = s => {
      sizeEl.style.fontSize = s + 'px';
      return scrollEl.scrollHeight <= scrollEl.clientHeight + 1 && scrollEl.scrollWidth <= scrollEl.clientWidth + 1 &&
             sizeEl.scrollWidth <= sizeEl.clientWidth + 1;
    };
    const lo0 = lo;
    scrollEl.classList.add('al-measuring');
    scrollEl.classList.remove('al-fits');
    let best = lo;
    for (let i = 0; i < 14; i++){
      const mid = (lo + hi) / 2;
      if (fits(mid)){ best = mid; lo = mid; } else hi = mid;
    }
    sizeEl.style.fontSize = best.toFixed(1) + 'px';
    // everything fits on one screen: no scrolling, so dancing words can't wiggle the page
    scrollEl.classList.toggle('al-fits', best > lo0 + 0.5 || fits(lo0));
    scrollEl.classList.remove('al-measuring');
  }

  /* ---- STORY ---- */
  function alStoryFlow(){
    if (typeof storyBody === 'undefined' || !storyBody) return;
    const ps = [...storyBody.children].filter(c => c.tagName === 'P');
    if (!ps.length) return;
    const flow = document.createElement('div');
    flow.className = 'al-story-flow';
    storyBody.insertBefore(flow, ps[0]);
    let block = null;
    ps.forEach(p => {
      if (p.querySelectorAll('.story-heart').length >= 4){
        if (!block){ block = document.createElement('div'); block.className = 'al-story-block'; flow.appendChild(block); }
        p.classList.add('al-grid-line');
        block.appendChild(p);
      } else {
        block = null;
        flow.appendChild(p);
      }
    });
    flow.querySelectorAll('.story-word').forEach(w => w.style.setProperty('--al-dd', rnd32()));
    scheduleStoryFit();
  }
  function alFitStory(){
    if (typeof storyOverlay === 'undefined' || !storyOverlay.classList.contains('open')) return;
    const flow = storyBody.querySelector('.al-story-flow');
    if (!flow || !storyBody.clientHeight) return;
    const hi = Math.max(30, Math.min(240, window.innerHeight * 0.32));
    const maxCover = Math.min(window.innerWidth * 0.56, window.innerHeight * 0.38, 420);
    const covers = [maxCover, window.innerHeight * 0.26, window.innerHeight * 0.17];
    for (const c of covers){
      storyBody.style.setProperty('--al-cover', Math.round(Math.min(c, maxCover)) + 'px');
      fitBox(flow, storyBody, 14, hi);
      if (parseFloat(flow.style.fontSize) >= 30) break;
    }
  }
  let storyFitRaf = 0;
  function scheduleStoryFit(){
    cancelAnimationFrame(storyFitRaf);
    storyFitRaf = requestAnimationFrame(() => requestAnimationFrame(alFitStory));
    setTimeout(alFitStory, 350);
    setTimeout(alFitStory, 1200);
  }
  if (typeof typeOutStory === 'function'){
    const orig = typeOutStory;
    typeOutStory = function(){ const r = orig.apply(this, arguments); alStoryFlow(); return r; };
  }
  if (typeof fitStoryTitle === 'function'){
    const origT = fitStoryTitle;
    fitStoryTitle = function(){ const r = origT.apply(this, arguments); scheduleStoryFit(); return r; };
  }
  if (typeof storyOverlay !== 'undefined' && storyOverlay){
    new MutationObserver(() => { if (storyOverlay.classList.contains('open')) scheduleStoryFit(); })
      .observe(storyOverlay, { attributes:true, attributeFilter:['class'] });
  }

  /* ---- MUSIC NOTES ---- */
  const notesOverlay = document.getElementById('alNotesOverlay');
  const notesCard = document.getElementById('alNotesCard');
  function alNotesTidy(){
    if (!notesCard) return;
    const loose = notesCard.querySelectorAll(':scope > .al-notes-song');
    if (loose.length){
      const grid = document.createElement('div');
      grid.className = 'al-notes-songs';
      notesCard.insertBefore(grid, loose[0]);
      loose.forEach(s => grid.appendChild(s));
    }
    notesCard.querySelectorAll('.al-notes-title, .al-notes-song-name, .al-np, .al-key-word').forEach(w => {
      if (!w.style.getPropertyValue('--al-dd')) w.style.setProperty('--al-dd', rnd32());
    });
  }
  function alFitNotes(){
    if (!notesOverlay || !notesOverlay.classList.contains('open') || !notesCard.clientHeight) return;
    fitBox(notesCard, notesCard, 10, Math.max(20, Math.min(110, window.innerHeight / 5.5)));
  }
  let notesRaf = 0;
  function scheduleNotesFit(){
    cancelAnimationFrame(notesRaf);
    notesRaf = requestAnimationFrame(() => requestAnimationFrame(alFitNotes));
    setTimeout(alFitNotes, 400);
  }
  if (notesCard){
    new MutationObserver(() => {
      if (notesCard.querySelector(':scope > .al-notes-song') ||
          [...notesCard.querySelectorAll('.al-np, .al-key-word')].some(w => !w.style.getPropertyValue('--al-dd'))){
        alNotesTidy();
        scheduleNotesFit();
      }
    }).observe(notesCard, { childList:true });
  }
  if (notesOverlay){
    new MutationObserver(() => { if (notesOverlay.classList.contains('open')) scheduleNotesFit(); })
      .observe(notesOverlay, { attributes:true, attributeFilter:['class'] });
  }

  /* ---- CHOOSE A SONG / song name: never past the edges of the screen ---- */
  function npOverflow(){
    const np = document.getElementById('nowPlaying');
    if (!np || !np.textContent) return false;
    const rg = document.createRange(); rg.selectNodeContents(np);
    const r = rg.getBoundingClientRect();
    return r.width && (r.right > window.innerWidth - 6 || r.left < 6);
  }
  if (typeof fitNowPlayingSize === 'function'){
    const origFit = fitNowPlayingSize;
    fitNowPlayingSize = function(){
      const r = origFit.apply(this, arguments);
      const np = document.getElementById('nowPlaying');
      if (np){
        let size = parseFloat(np.style.fontSize) || 0, guard = 0;
        np.style.transition = 'none';
        while (size > 10 && npOverflow() && guard++ < 60){ size -= 1; np.style.fontSize = size + 'px'; }
        void np.offsetWidth; np.style.transition = '';
      }
      return r;
    };
  }
  const refitAll = () => {
    if (typeof fitNowPlayingSize === 'function') fitNowPlayingSize();
    scheduleStoryFit(); scheduleNotesFit();
  };
  if (document.fonts){
    Promise.all([document.fonts.load("40px 'Awesome Love Notes'"), document.fonts.load("40px 'Awesome Love Notes Thin'")])
      .then(refitAll).catch(() => {});
    if (document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', refitAll);
  }
  window.addEventListener('resize', () => { scheduleStoryFit(); scheduleNotesFit(); });
  // a gentle safety check: if the song name ever spills off the screen, fit it again
  setInterval(() => { if (!document.hidden && npOverflow() && typeof fitNowPlayingSize === 'function') fitNowPlayingSize(); }, 1500);
})();

/* ---- the story cover's colored glow hugs the drawing's own shape, never a square ---- */
if (typeof storyCoverAnimFrame === 'function'){
  storyCoverAnimFrame = function(now){
    const t = now - storyCoverAnimStart;
    const bp = (t % STORY_BREATHE_MS) / STORY_BREATHE_MS;
    const be = 0.5 - 0.5 * Math.cos(bp * Math.PI * 2);
    storyCoverArt.style.transform = 'scale(' + (1 + 0.22 * be) + ')';
    const gp = (t % STORY_GLOW_MS) / STORY_GLOW_MS;
    const ge = 0.5 - 0.5 * Math.cos(gp * Math.PI * 2);
    const blur = (8 + 14 * ge).toFixed(1), off = 1 + 0.55 * ge;
    const [c1, c2, c3] = storyGlowColors;
    storyCover.style.boxShadow = 'none';
    storyCoverArt.style.filter =
      'drop-shadow(' + (-5 * off).toFixed(1) + 'px ' + (-4 * off).toFixed(1) + 'px ' + blur + 'px ' + c1 + ') ' +
      'drop-shadow(' + (5 * off).toFixed(1) + 'px ' + (3 * off).toFixed(1) + 'px ' + blur + 'px ' + c2 + ') ' +
      'drop-shadow(0px ' + (6 * off).toFixed(1) + 'px ' + blur + 'px ' + c3 + ')';
    storyCoverRAF = requestAnimationFrame(storyCoverAnimFrame);
  };
}
</script>

<script>
/* ================= AL: a happy STORY -- split STORY into its own happy letters ================= */
(function(){
  function happify(el){
    if (!el || el.classList.contains('al-happy-story')) return;
    const word = (el.textContent || 'STORY').trim() || 'STORY';
    el.classList.add('al-happy-story');
    el.setAttribute('aria-label', word);
    el.innerHTML = Array.from(word).map((ch, i) =>
      '<span class="al-story-l" aria-hidden="true" style="animation-delay:' + (i * 0.13).toFixed(2) + 's,' + (-i * 2).toFixed(1) + 's">' + ch + '</span>'
    ).join('');
  }
  function run(){ document.querySelectorAll('.fs-story-btn .story-fallback').forEach(happify); }
  run();
  // the Story picture's safety net can swap in a fresh STORY later -- happify that one too
  const btn = document.getElementById('fsStoryBtn');
  if (btn && window.MutationObserver) new MutationObserver(run).observe(btn, { childList:true, subtree:true });
})();
</script>

<script>
/* ================= AL: Production credits for each album ================= */
(function(){
  const AL = 'Awesome Love';
  // [the album's title on screen, its type, the credits]
  const PRODUCTION = [
    ['AWESOME', 'Album', [['Producer', AL], ['Vocalist', AL], ['Mixer', 'Jonathan Tuscano']]],
    ['PHENOMENAL', 'Album', [['Producer', AL], ['Vocalist', AL], ['Mixer', 'Jonathan Tuscano']]],
    ['PHENOMENAL REVERB', 'Album', [['Producer', AL], ['Vocalist', AL], ['Mixer', AL]]],
    ['STELLAR', 'Album', [['Producer', AL], ['Piano', AL], ['Mixer', AL]]],
    ['FUN', 'Album', [['Producer', 'Computer Generated Instrumentals'], ['Vocalist', AL], ['Mixer', AL]]],
    ['AWESOME LOVE', 'Single', [['Producer', AL], ['Vocalist', AL], ['Mixer', AL]]],
    ['AWESONIA', 'Single', [['Producer', AL], ['Vocalist', AL], ['Mixer', AL]]],
    ['HEART', 'Single', [['Producer', AL], ['Vocalist', AL], ['Mixer', AL]]],
    ['EARTH', 'Single', [['Producer', AL], ['Vocalist', AL], ['Mixer', AL]]],
    ['LOVE AWESOME LOVE', 'Single', [['Producer', AL], ['Vocalist', AL], ['Mixer', AL]]],
    ['O', 'Single', [['Producer', AL], ['Mixer', AL]]],
    ['ORCHASTRA 4321 AWESOMENESS', 'Single', [['Producer', AL], ['Orchestra', AL], ['Mixer', AL]]],
    ['AWESOME ORCHESTRA', 'Single', [['Producer', AL], ['Orchestra', AL], ['Mixer', AL]]],
    ['AWESOME LOVE BREATH', 'Single', [['Producer', AL], ['Breathing', AL], ['Mixer', AL]]],
    ['DANCE', 'Single', [['Producer', AL], ['Vocalist', AL], ['Mixer', AL]]],
    ['Love', 'Single', [['Producer', AL], ['Orchestra', AL], ['Mixer', AL]]],
    ['AWESOME', 'Single', [['Producer', AL], ['Vocalist', AL], ['Mixer', AL]]],
    ['AH', 'Single', [['Producer', AL], ['Vocalist', AL], ['Mixer', AL]]],
    ['YABA DABA DOO', 'Single', [['Producer', AL], ['Vocalist', AL], ['Mixer', AL]]],
    ['LOVE FINITY', 'Single', [['Producer', AL], ['Vocalist', AL], ['Mixer', AL]]],
    ['ANCIENT LOVE', 'Single', [['Producer', AL], ['Vocalist', AL], ['Mixer', AL]]],
    ['PLAY', 'Single', [['Producer', AL], ['Vocalist', AL], ['Mixer', AL]]],
    ['BUTTER FLY', 'Single', [['Producer', AL], ['Mixer', AL]]],
    ['LOVE', 'Single', [['Producer', AL], ['Mixer', AL]]],
    ['Dance!', 'Triple', [['Producer', 'Computer Generated Instrumentals'], ['Vocalist', AL], ['Mixer', AL]]],
  ];
  function creditsFor(rel){
    const r = (typeof origRel === 'function') ? origRel(rel) : rel;
    const hit = PRODUCTION.find(p => p[0] === r.title && p[1] === r.type);
    return hit ? hit[2] : [['Producer', AL]];
  }

  const btn = document.getElementById('alProdBtn');
  const overlay = document.getElementById('alProdOverlay');
  const card = document.getElementById('alProdCard');
  const closeBtn = document.getElementById('alProdClose');
  if (!btn || !overlay) return;
  const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const hand = t => (typeof alHandText === 'function') ? alHandText(t) : esc(t);
  const dd = () => (-Math.random() * 32).toFixed(2) + 's';
  const COLORS = ['#ff4f7b','#ff9a3c','#ffd93d','#5ee36a','#3fc1ff','#8a7dff','#ff6fd8'];

  let relIdx = 0;
  function build(){
    const rel = releases[relIdx];
    if (!rel) return;
    const word = 'PRODUCTION';
    let h = '<img class="al-prod-top" src="' + btn.querySelector('img').src + '" alt="">';
    h += '<div class="al-prod-word" aria-label="Production">' + Array.from(word).map((ch, i) =>
      '<span style="color:' + COLORS[i % COLORS.length] + '">' + ch + '</span>').join('') + '</div>';
    if (rel.cover) h += '<div class="al-prod-cover" style="background-image:url(&quot;' + esc(rel.cover) + '&quot;)"></div>';
    h += '<div><span class="al-prod-title" style="--al-dd:' + dd() + '">' + hand(rel.title) + '</span></div>';
    creditsFor(rel).forEach(([role, name]) => {
      h += '<div><span class="al-prod-line" style="--al-dd:' + dd() + '"><span class="al-prod-role">' + hand(role) + '</span><span class="al-prod-name">' + hand(name) + '</span></span></div>';
    });
    card.innerHTML = h;
    card.scrollTop = 0;
    fit();
  }
  // as big as it can be while everything fits on one screen
  function fit(){
    if (!overlay.classList.contains('open') || !card.clientHeight) return;
    card.classList.add('al-measuring');
    let lo = 12, hi = Math.max(24, Math.min(70, window.innerHeight / 12)), best = lo;
    for (let i = 0; i < 12; i++){
      const mid = (lo + hi) / 2;
      card.style.fontSize = mid + 'px';
      const room = card.clientWidth * 0.78;   // space to swell while dancing
      const wide = [...card.querySelectorAll('.al-prod-title, .al-prod-line, .al-prod-word')].every(el => el.offsetWidth <= room);
      if (wide && card.scrollHeight <= card.clientHeight + 1 && card.scrollWidth <= card.clientWidth + 1){ best = mid; lo = mid; } else hi = mid;
    }
    card.style.fontSize = best.toFixed(1) + 'px';
    card.classList.remove('al-measuring');
  }
  function open(){
    relIdx = activeIndex >= 0 ? activeIndex : 0;
    overlay.classList.add('open');
    build();
    requestAnimationFrame(() => { fit(); requestAnimationFrame(() => overlay.classList.add('visible')); });
    setTimeout(fit, 400);
  }
  function close(){
    overlay.classList.remove('visible');
    setTimeout(() => { if (!overlay.classList.contains('visible')) overlay.classList.remove('open'); }, 650);
  }
  btn.addEventListener('click', (e) => { e.stopPropagation(); open(); });

  // swipe (or the left / right arrow keys) to see the next album's credits;
  // the cover wheel follows along
  let busy = false;
  function swap(dir){
    if (busy || !overlay.classList.contains('open')) return;
    const next = relIdx + dir;
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (next < 0 || next >= releases.length){
      if (!reduce && typeof alFlowSpringBack === 'function' && alFlowCurrentF(card)) alFlowSpringBack(card);
      return;
    }
    busy = true;
    try { velocity = 0; targetPos = next; } catch(err){}
    if (reduce || typeof alFlowSwap !== 'function'){ if (typeof alFlowClear === 'function') alFlowClear(card); relIdx = next; build(); busy = false; return; }
    const ms = alFlowSwap(card, dir, () => { relIdx = next; build(); });
    setTimeout(() => { busy = false; }, ms);
  }
  if (typeof alAttachSwipe === 'function') alAttachSwipe(overlay, swap, card);
  document.addEventListener('keydown', (e) => {
    if (!overlay.classList.contains('visible')) return;
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft'){
      e.preventDefault(); e.stopImmediatePropagation();
      swap(e.key === 'ArrowRight' ? 1 : -1);
    }
  }, true);

  // Al's flipping back arrow, with the whoosh-back sound
  closeBtn.classList.add('al-back-btn');
  closeBtn.title = 'Go back';
  closeBtn.setAttribute('aria-label', 'Go back');
  if (typeof AL_BACK_ARROW !== 'undefined'){
    closeBtn.innerHTML = '<span class="al-back-flip"><img src="' + AL_BACK_ARROW + '" alt="" draggable="false"></span>';
  }
  const goBack = () => {
    if (!overlay.classList.contains('visible')) return;
    try { alPageTurnBackSound(); } catch(err){}
    close();
  };
  closeBtn.addEventListener('click', goBack);
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay && !(typeof alJustDragged === 'function' && alJustDragged(overlay))) goBack();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && overlay.classList.contains('open')){ e.stopImmediatePropagation(); goBack(); }
  }, true);
  window.addEventListener('resize', fit);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit).catch(() => {});
})();
</script>
