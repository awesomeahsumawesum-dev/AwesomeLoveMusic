  }
  /* ---- happy / neutral: Al's letters in reds, pinks, oranges, blues and greens (colors set per letter) ---- */
  .story-body p.tone-happy{ text-shadow:0 1px 3px rgba(0,0,0,0.55); }
  /* ---- sad / heavy: a skinnier version of Al's letters, in black, navy and deep dark red,
     with a dark-red glowing outline that fades in and out very slowly ---- */
  .story-body p.tone-heavy{
    font-family:'Awesome Love Notes Thin', 'Awesome Love Notes', -apple-system, Arial, sans-serif !important;
    animation: alSadGlow 10s ease-in-out infinite;
  }
  @keyframes alSadGlow{
    0%, 100%{ text-shadow: 1px 0 0 rgba(205,0,28,0.62), -1px 0 0 rgba(205,0,28,0.62), 0 1px 0 rgba(205,0,28,0.62), 0 -1px 0 rgba(205,0,28,0.62), 0.7px 0.7px 0 rgba(205,0,28,0.62), -0.7px -0.7px 0 rgba(205,0,28,0.62), 0.7px -0.7px 0 rgba(205,0,28,0.62), -0.7px 0.7px 0 rgba(205,0,28,0.62), 0 0 6px rgba(170,0,22,0.3), 0 0 14px rgba(120,0,16,0.12); }
    50%     { text-shadow: 1px 0 0 rgba(205,0,28,1), -1px 0 0 rgba(205,0,28,1), 0 1px 0 rgba(205,0,28,1), 0 -1px 0 rgba(205,0,28,1), 0.7px 0.7px 0 rgba(205,0,28,1), -0.7px -0.7px 0 rgba(205,0,28,1), 0.7px -0.7px 0 rgba(205,0,28,1), -0.7px 0.7px 0 rgba(205,0,28,1), 0 0 6px rgba(170,0,22,0.85), 0 0 14px rgba(120,0,16,0.5); }
  }
  /* ---- awesome words: extra vibrant, angelic white glowing outline, pulsing quickly ---- */
  .story-word.awesome-word{
    text-shadow:
      0 0 1px #fff, 0 0 2px #fff, 0 0 4px rgba(255,255,255,0.95),
      0 0 9px rgba(255,255,255,0.7), 0 0 18px rgba(255,240,255,0.45);
    animation: alAwesomePulse 0.75s ease-in-out infinite;
    transform-origin:50% 60%;
    margin:0 0.14em;           /* room to swell without bumping its neighbors */
  }
  .story-word.awesome-word .story-char{ filter:saturate(1.6) brightness(1.15); }
  @keyframes alAwesomePulse{
    0%, 100%{ transform:scale(1); }
    50%     { transform:scale(1.14); }
  }
  /* ---- balloon bunches inspired by Al's balloon picture ---- */
  .story-balloon{
    font-size:0;
    width:74px; height:105px;
    transform:translate(-50%, -100%) scale(0.2);
    transform-origin:50% 100%;
    animation:alBalloonRise 3.6s cubic-bezier(0.3, 0.6, 0.4, 1) forwards;
    text-shadow:none;
    filter:drop-shadow(0 4px 8px rgba(0,0,0,0.35)) saturate(1.2);
  }
  .story-balloon::after{ display:none; }
  .story-balloon svg{ display:block; overflow:visible; }
  @keyframes alBalloonRise{
    0%  { opacity:0; transform:translate(-50%, -100%) scale(0.2) rotate(0deg); }
    12% { opacity:1; transform:translate(-50%, calc(-100% - 14px)) scale(1.08) rotate(calc(var(--sway) * -0.5)); }
    40% { opacity:1; transform:translate(calc(-50% + var(--drift) * 0.4), calc(-100% - 80px)) scale(1) rotate(var(--sway)); }
    70% { opacity:1; transform:translate(calc(-50% + var(--drift) * 0.75), calc(-100% - 160px)) scale(0.97) rotate(calc(var(--sway) * -0.6)); }
    100%{ opacity:0; transform:translate(calc(-50% + var(--drift)), calc(-100% - 240px)) scale(0.92) rotate(var(--sway)); }
  }
  @media (prefers-reduced-motion: reduce){
    .story-body p.tone-heavy, .story-word.awesome-word{ animation:none !important; }
  }

  /* ---- the story always scrolls: the body is the one scroll area inside the card ---- */
  .story-card{ min-height:0; }
  .story-head{ flex:0 0 auto; }
  .story-body{
    flex:1 1 auto;
    min-height:0;
    overflow-y:auto !important;
    overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;
    touch-action:pan-y;
  }

  /* ---- bottom Plays button: same Plays artwork, slower and in deeper, darker jewel tones ---- */
  .playhead-plays.no-track{ visibility:hidden; }
  .playhead-plays{ cursor:pointer; animation:none; perspective:400px; }
  .ph-plays-wrap{
    position:relative;
    display:inline-flex; align-items:center; justify-content:center;
    line-height:0;
    transform-style:preserve-3d;
  }
  .ph-plays-img{
    display:block;
    height:clamp(16px, 3.6vw, 22px);
    width:auto;
    transition:opacity 0.9s ease;
    animation:
      phPlaysBreathe 12s ease-in-out infinite,
      phPlaysDeepGlow 26s ease-in-out infinite;
  }
  @keyframes phPlaysBreathe{
    0%, 100%{ transform:scale(1); }
    50%     { transform:scale(1.12); }
  }
  @keyframes phPlaysDeepGlow{
    0%   { filter:saturate(1.9) brightness(0.72) contrast(1.15) drop-shadow(0 0 3px rgba(150,0,30,0.85))  drop-shadow(0 0 9px rgba(110,0,25,0.55)); }
    25%  { filter:saturate(1.9) brightness(0.72) contrast(1.15) drop-shadow(0 0 3px rgba(20,40,160,0.85)) drop-shadow(0 0 9px rgba(10,25,120,0.55)); }
    50%  { filter:saturate(1.9) brightness(0.72) contrast(1.15) drop-shadow(0 0 3px rgba(0,110,60,0.85))  drop-shadow(0 0 9px rgba(0,80,45,0.55)); }
    75%  { filter:saturate(1.9) brightness(0.72) contrast(1.15) drop-shadow(0 0 3px rgba(90,0,130,0.85)) drop-shadow(0 0 9px rgba(60,0,100,0.55)); }
    100% { filter:saturate(1.9) brightness(0.72) contrast(1.15) drop-shadow(0 0 3px rgba(150,0,30,0.85))  drop-shadow(0 0 9px rgba(110,0,25,0.55)); }
  }
  .ph-plays-num{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-size:clamp(14px, 3.4vw, 20px);
    white-space:nowrap;
    opacity:0;
    transition:opacity 0.9s ease;
    pointer-events:none;
    filter:saturate(1.6) brightness(0.8) contrast(1.1);
  }
  .ph-plays-wrap.revealing .ph-plays-img{ opacity:0; }
  .ph-plays-wrap.revealing .ph-plays-num{ opacity:1; }
  .ph-plays-num .al-digit{ animation:none !important; }
  .ph-plays-num .al-digit svg{ animation:phNumGlow 14s ease-in-out infinite !important; }
  @keyframes phNumGlow{
    0%, 100%{ filter:saturate(1.6) brightness(0.85) drop-shadow(0 0 0.06em currentColor); }
    50%     { filter:saturate(2) brightness(1) drop-shadow(0 0 0.18em currentColor); }
  }

  /* ---- the squiggle, sliced so it can do a slow wave ---- */
  .progress-track.al-wavy{ background-image:none !important; }
  .al-squiggle-strip{
    position:absolute; top:0; bottom:0;
    background-image:var(--squiggle-img);
    background-repeat:no-repeat;
    will-change:transform;
  }

  /* ---- the playhead heart: slow loving glow + slowly grows and settles, like the support heart ---- */
  .progress-thumb{
    animation: alThumbGlow 8s ease-in-out infinite;
  }
  @keyframes alThumbGlow{
    0%, 100%{ scale:1;    filter:drop-shadow(0 2px 5px rgba(0,0,0,0.55)) drop-shadow(0 0 2px rgba(255,190,160,0)); }
    50%     { scale:1.24; filter:drop-shadow(0 2px 5px rgba(0,0,0,0.55)) drop-shadow(0 0 9px rgba(255,205,150,0.95)) drop-shadow(0 0 18px rgba(255,90,120,0.7)); }
  }

  /* ---- the album title under the cover: big, and glowing very slowly through colors ---- */
  #relTitle{
    white-space:nowrap;
    line-height:1.3;
    animation: alRelTitleGlow 16s ease-in-out infinite !important;
  }
  @keyframes alRelTitleGlow{
    0%, 100%{ text-shadow:0 2px 10px rgba(0,0,0,0.7), 0 0 0.12em rgba(255,140,200,0.35), 0 0 0.4em rgba(255,140,200,0.15); }
    25%     { text-shadow:0 2px 10px rgba(0,0,0,0.7), 0 0 0.16em rgba(255,215,120,0.75), 0 0 0.6em rgba(255,190,90,0.4); }
    50%     { text-shadow:0 2px 10px rgba(0,0,0,0.7), 0 0 0.16em rgba(110,230,255,0.75), 0 0 0.6em rgba(80,180,255,0.4); }
    75%     { text-shadow:0 2px 10px rgba(0,0,0,0.7), 0 0 0.16em rgba(200,140,255,0.75), 0 0 0.6em rgba(160,90,255,0.4); }
  }
  @media (prefers-reduced-motion: reduce){
    .progress-thumb, #relTitle, .ph-plays-img, .ph-plays-num .al-digit svg{ animation:none !important; }
  }

  /* Al's heart-and-A mood button: a soft glow so the black A reads on the dark page */
  .logo-wrap #brandLogo{
    height:clamp(42px, 6vh, 54px) !important;
    max-height:none !important;
    width:auto !important;
    opacity:1;
  }
  #brandLogo{
    filter:drop-shadow(0 0 1px rgba(255,255,255,0.75)) drop-shadow(0 0 6px rgba(255,120,160,0.45));
    animation: alLogoBreathe 7s ease-in-out infinite;
  }
  @keyframes alLogoBreathe{
    0%, 100%{ scale:1; }
    50%     { scale:1.08; }
  }
  @media (prefers-reduced-motion: reduce){ #brandLogo{ animation:none; } }

  /* the Story button is always STORY in Al's rainbow letters */
  .fs-story-btn.in-controls .story-fallback{ font-size:calc(var(--fs-btn) * 0.82 * 0.62); }

  /* ---- top buttons: a little 3D depth for their twirls ---- */
  .topbar .story-btn, .topbar .favorites-btn, .topbar .brand-logo, .topbar .total-plays-top, .topbar .games-link{
    transform-style:preserve-3d;
  }
  /* ---- fullscreen STORY: floats gracefully, a soft light sweeps through the rainbow letters,
     a warm halo breathes behind it, and little sparkles twinkle around ---- */
  .fs-story-float{
    position:relative;
    display:inline-block;
    animation: fsStoryFloat 11s ease-in-out infinite;
    transform-origin:50% 60%;
  }
  @keyframes fsStoryFloat{
    0%   { translate: 0 0;        rotate: -2deg;  scale:1;    }
    25%  { translate: 9px -5px;   rotate: 1.5deg; scale:1.05; }
    50%  { translate: 0 -8px;     rotate: 2.5deg; scale:1.08; }
    75%  { translate: -9px -4px;  rotate: -1deg;  scale:1.04; }
    100% { translate: 0 0;        rotate: -2deg;  scale:1;    }
  }
  .fs-story-btn .story-fallback{
    position:relative;
    z-index:1;
    background:
      linear-gradient(105deg, rgba(255,255,255,0) 38%, rgba(255,255,255,0.95) 50%, rgba(255,255,255,0) 62%),
      linear-gradient(90deg, #ff3b30, #ff9500, #ffd60a, #34c759, #3d7fe0, #af52de, #ff3b30);
    background-size: 260% 100%, 220% 100%;
    background-repeat:no-repeat, repeat;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:
      fsStoryShine 7s ease-in-out infinite,
      fsStoryGlow 12s ease-in-out infinite;
  }
  @keyframes fsStoryShine{
    0%   { background-position: 160% 0, 0% 0; }
    55%  { background-position: -60% 0, 100% 0; }
    100% { background-position: -60% 0, 200% 0; }
  }
  @keyframes fsStoryGlow{
    0%, 100%{ filter:drop-shadow(0 0 2px rgba(255,255,255,0.55)) drop-shadow(0 0 8px rgba(255,120,180,0.45)); }
    33%     { filter:drop-shadow(0 0 3px rgba(255,255,255,0.8))  drop-shadow(0 0 14px rgba(255,210,110,0.6)); }
    66%     { filter:drop-shadow(0 0 3px rgba(255,255,255,0.8))  drop-shadow(0 0 14px rgba(110,200,255,0.6)); }
  }
  .fs-story-halo{
    position:absolute;
    left:50%; top:50%;

  /* ================= STORY: rises slowly up into a soft blur =================
     no black box anymore -- the story floats right on the blurred screen and

  .story-overlay{

    backdrop-filter: blur(0px) saturate(1) !important;

  /* ---- Al's pencil ALBUM word, below the album in the middle ---- */
  .al-album-badge{

  }
  .al-album-float img{ display:block; width:100%; height:auto; pointer-events:none; }
  /* small and slow: a gentle drift and breath, softly fading in and out */
  @keyframes alAlbumFloat{

    50%     { transform: translateY(-5px) rotate(1.5deg) scale(1.05); }

  .al-album-badge.al-big .al-album-float{ opacity:1 !important; animation-play-state:paused; }
  .al-album-badge.al-big .al-album-float img{ filter: drop-shadow(0 0 6px rgba(255,230,250,0.8)) drop-shadow(0 6px 16px rgba(0,0,0,0.55)); }

  /* ---- the blurred song selection (from the ALBUM word) ---- */
  .fs-overlay.al-select .fs-cover-scroll{ filter: blur(16px) saturate(1.2) !important; opacity:0.32 !important; }
  .fs-overlay.al-select .fs-text{ opacity:1 !important; }
  .fs-overlay.al-select .fs-bottom-controls{ display:none !important; }
  .fs-overlay.al-select .fs-close{ opacity:1 !important; pointer-events:auto !important; }
  /* the ALBUM word is sized only by its width (never zoomed), so it lands exactly where intended */
  .al-album-badge{ transform-origin:0 0; display:block; margin:0; line-height:0; box-sizing:content-box; }
  .al-album-badge .al-album-float, .al-album-badge .al-album-float img{ width:100%; height:100%; }
  .al-album-badge .al-album-float img{ object-fit:contain; }

  /* ================= Al's TIME button ================= */
  :root{ --al-time-h: clamp(70px, 13vh, 118px); --al-time-w: calc(var(--al-time-h) / 2.3121); }
  @media (max-width: 600px){ :root{ --al-time-h: 76px; } }
  /* room for it in the bottom-right corner, so it never sits on the meter or the name */
  body.al-has-time-btn .transport{ padding-right: calc(22px + var(--al-time-w) + 10px) !important; }
  .al-time-btn{
    position:absolute;
    right:16px;
    bottom: calc(10px + env(safe-area-inset-bottom));
    width: var(--al-time-w); height: var(--al-time-h);
    padding:0; border:none; background:none; cursor:pointer;
    pointer-events:auto;
    -webkit-tap-highlight-color: transparent;
    z-index:3;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.55));
  }
  .al-time-ink{
    display:block; width:100%; height:100%;
    -webkit-mask-image: var(--al-time-img); mask-image: var(--al-time-img);
    -webkit-mask-size: contain; mask-size: contain;
    -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
    -webkit-mask-position: center; mask-position: center;
    background-color:#ff5aaa;
    animation: alTimeColors 24s linear infinite;
  }
  /* every 6 seconds a new color fades in, all the way around the rainbow in 24 */
  @keyframes alTimeColors{
    0%      { background-color:#ff5aaa; }   /* love pink */
    18.75%  { background-color:#ff5aaa; }
    25%     { background-color:#ffd23c; }   /* sunny gold */
    43.75%  { background-color:#ffd23c; }
    50%     { background-color:#5ae678; }   /* green */
    68.75%  { background-color:#5ae678; }
    75%     { background-color:#50aaff; }   /* sky blue */
    93.75%  { background-color:#50aaff; }
    100%    { background-color:#ff5aaa; }
  }
  .al-time-btn:hover .al-time-ink{ filter:brightness(1.15); }
  .al-time-btn[aria-pressed="true"]{ filter: drop-shadow(0 4px 10px rgba(0,0,0,0.55)) drop-shadow(0 0 8px rgba(255,255,255,0.35)); }

  /* the meter and the time numbers fold gracefully away (numbers first, then
     the rainbow meter), and come back the other way round */
  .progress-wrap{
    max-height:90px;
    transition: max-height 0.9s cubic-bezier(0.65,0,0.35,1) 0.15s, margin 0.9s ease 0.15s, opacity 0.7s ease 0.3s;
  }
  .progress-wrap .progress-time{
    transition: opacity 0.6s ease 0.45s, transform 0.8s cubic-bezier(0.22,1,0.36,1) 0.45s, filter 0.6s ease 0.45s;
  }
  .progress-wrap .progress-bar{
    transition: opacity 0.7s ease 0.2s, transform 0.9s cubic-bezier(0.22,1,0.36,1) 0.2s, filter 0.7s ease 0.2s;
  }
  body.al-time-min .progress-wrap{
    max-height:0; margin-top:-10px; opacity:0; pointer-events:none;
    transition: max-height 0.9s cubic-bezier(0.65,0,0.35,1) 0.35s, margin 0.9s ease 0.35s, opacity 0.6s ease 0.5s;
  }
  body.al-time-min .progress-wrap .progress-time{
    opacity:0; transform: translateY(14px) scale(0.6); filter: blur(4px);
    transition: opacity 0.5s ease, transform 0.7s cubic-bezier(0.65,0,0.35,1), filter 0.5s ease;
  }
  body.al-time-min .progress-wrap .progress-bar{
    opacity:0; transform: scaleX(0.15) translateY(10px); filter: blur(6px);
    transition: opacity 0.7s ease 0.2s, transform 0.9s cubic-bezier(0.65,0,0.35,1) 0.2s, filter 0.7s ease 0.2s;
  }
  @media (prefers-reduced-motion: reduce){ .al-time-ink{ animation:none; } }
  @media (max-width: 600px){
    /* phones: the TIME button dances just above the meter, bottom right, so the
       song name, play and Love keep the whole row */
    body.al-has-time-btn .transport{ padding-right:22px !important; }
    .al-time-btn{ bottom:100%; right:14px; margin-bottom:2px; }
    :root{ --al-time-h: 70px; }

  /* ================= a bigger love meter, bigger numbers, bigger song name ================= */
  .progress-bar{ height:clamp(40px, 10vw, 66px) !important; }
  .progress-thumb{ width:clamp(34px, 8vw, 54px) !important; height:clamp(34px, 8vw, 54px) !important; }
  .progress-time{ font-size:clamp(16px, 3.6vw, 26px) !important; width:auto !important; min-width:2.6em; }
  .progress-wrap{ max-height:120px; }
  /* the albums sit a little higher, leaving more of the screen for the meter and the song */
  .cover-wrap{ top:41% !important; width:min(56vw, 52vh, 540px) !important; height:min(56vw, 52vh, 540px) !important; }
  @media (max-width: 600px){ .cover-wrap{ top:43% !important; width:min(80vw, 46vh, 360px) !important; height:min(80vw, 46vh, 360px) !important; } }

  /* ---- dragging the heart on the love meter ---- */
  /* the meter's grab area reaches past its edges, so pressing anywhere on the
     heart (which rides the wave, partly outside the meter) always grabs it */
  .progress-wrap{ position:relative; z-index:4; }
  .progress-bar{ touch-action:none; -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; cursor:grab; }
  .progress-bar:active{ cursor:grabbing; }
  .progress-bar::before{
    content:""; position:absolute; left:-14px; right:-14px; top:-38%; bottom:-38%;
    z-index:0;
  }
  /* while held, the heart's own slow glow steps aside for the bounce */
  .progress-thumb.al-holding{ animation:none !important; transition:none !important; }

  /* ================= genie: the love meter out of the TIME button ================= */
  body.al-genie-out .progress-wrap, body.al-genie-in .progress-wrap{ will-change: transform, opacity; }
  /* the room for the meter opens slowly and evenly, so the song name glides */
  body.al-genie-out .progress-wrap{
    transition: max-height 1.0s cubic-bezier(0.45, 0, 0.55, 1), margin 1.0s cubic-bezier(0.45, 0, 0.55, 1) !important;
  }
  body.al-time-min .progress-wrap{
    transition: max-height 1.2s cubic-bezier(0.45, 0, 0.55, 1), margin 1.2s cubic-bezier(0.45, 0, 0.55, 1), opacity 0.3s ease !important;
  }
  /* inside the genie everything is shown -- the genie itself does the appearing */
  body.al-genie-out .progress-wrap .progress-time, body.al-genie-out .progress-wrap .progress-bar,
  body.al-genie-in .progress-wrap .progress-time, body.al-genie-in .progress-wrap .progress-bar{
    opacity:1 !important; transform:none !important; filter:none !important; transition:none !important;
  }
  body.al-genie-in .progress-wrap{ pointer-events:none; }
  @keyframes alGenieOut{
    /* a wisp of smoke rises out of the bottle... */
    0%   { opacity:0;    transform: scale(0.02, 0.05) skewX(0deg)   rotate(0deg);   filter: blur(10px) saturate(2.4) brightness(1.8); }
    10%  { opacity:0.65; transform: scale(0.03, 0.55) skewX(-28deg) rotate(-8deg);  filter: blur(8px)  saturate(2.2) brightness(1.7); }
    /* ...curls and swirls as it climbs... */
    25%  { opacity:0.8;  transform: scale(0.07, 0.95) skewX(30deg)  rotate(7deg);   filter: blur(6px)  saturate(2)   brightness(1.6); }
    40%  { opacity:0.85; transform: scale(0.18, 1.12) skewX(-24deg) rotate(-5deg);  filter: blur(4.5px) saturate(1.8) brightness(1.5); }
    55%  { opacity:0.92; transform: scale(0.42, 1.05) skewX(16deg)  rotate(3deg);   filter: blur(3px)  saturate(1.6) brightness(1.4); }
    /* ...then blooms out into its full shape */
    72%  { opacity:1;    transform: scale(1.08, 0.86) skewX(-6deg)  rotate(-1deg);  filter: blur(1.2px) saturate(1.35) brightness(1.25); }
    86%  { opacity:1;    transform: scale(0.97, 1.06) skewX(2deg)   rotate(0.4deg); filter: blur(0.3px) saturate(1.1) brightness(1.08); }
    100% { opacity:1;    transform: none;                                         filter: none; }
  }

  /* ================= the big play button across the screen, then the genie ================= */
  .al-big-play{
    position:fixed; inset:0; z-index:9500;
    pointer-events:none;
    display:flex; align-items:center; justify-content:center;
    opacity:0; visibility:hidden;
    transition: opacity 0.45s ease, visibility 0s linear 0.45s;
  }
  .al-big-play.on{ opacity:1; visibility:visible; transition: opacity 0.45s ease, visibility 0s; }
  .al-big-play-veil{

    transition: opacity 0.9s ease;
  }
  .al-big-play .al-big-play-svg{
    position:relative;
    width:min(78vw, 72vh) !important; height:min(78vw, 72vh) !important;
    filter: drop-shadow(0 10px 40px rgba(0,0,0,0.55)) drop-shadow(0 0 30px rgba(80,230,110,0.25));
    animation: alBigPlayIn 0.6s cubic-bezier(0.22,1,0.36,1) both;
  }
  .al-big-play.on .al-big-play-svg{ animation: alBigPlayIn 0.6s cubic-bezier(0.22,1,0.36,1) both, alBigPlayBreathe 3.2s ease-in-out 0.6s infinite; }
  @keyframes alBigPlayIn{ from{ transform:scale(0.6); opacity:0; } to{ transform:scale(1); opacity:1; } }
  @keyframes alBigPlayBreathe{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.03); } }
  .al-big-play-genie{ position:absolute; inset:0; width:100%; height:100%; display:none; }
  .al-big-play.al-genie-phase .al-big-play-svg{ visibility:hidden; }
  .al-big-play.al-genie-phase .al-big-play-genie{ display:block; }
  .al-big-play.al-genie-phase .al-big-play-veil{ opacity:0; }
  /* the little button waits, hidden, until the genie lands in its spot */
  .np-play-btn.al-genie-hidden{ visibility:hidden !important; }
  @media (prefers-reduced-motion: reduce){

  /* the meter's soft blurred glow is heavy to redraw while stretching, so it rests

  body.al-genie-out .al-squiggle-glow, body.al-genie-in .al-squiggle-glow{ display:none; }
  body.al-glow-back .al-squiggle-glow{ animation: alMeterGlowBack 1.2s ease-out both; }
  @keyframes alMeterGlowBack{ from{ opacity:0; } to{ opacity:0.55; } }

  /* the TIME watch waits, hidden, until a song has played -- then pops into view */
  .al-time-btn{

    transition: opacity 0.9s ease, scale 1.1s cubic-bezier(0.34, 1.56, 0.64, 1), visibility 0s linear 1.1s;
  }
  body.al-time-ready .al-time-btn{

    transition: opacity 0.9s ease, scale 1.1s cubic-bezier(0.34, 1.56, 0.64, 1), visibility 0s;

  /* ---- the loved song's red, green and blue glow, breathing with the donation heart ---- */
  .al-loved-glow{
    position:absolute; left:0; top:0; width:0; height:0;
    pointer-events:none;
    z-index:0;
    opacity:0;
    transition: opacity 1.2s ease;
  }
  .al-lg-breath{
    position:absolute; inset:0;
    opacity:0;
    animation: alLovedGlow 8s ease-in-out infinite;   /* the same 8-second breath as the donation heart */
  }
  .al-lg-blob{
    position:absolute; left:23%; top:-20%;       /* centered: (100% - its own size) / 2 */
    width:54%; height:140%;
    border-radius:50%;
    --h: 0;
    background: radial-gradient(closest-side, hsla(var(--h), 100%, 58%, 0.95), hsla(var(--h), 100%, 55%, 0.5) 50%, hsla(var(--h), 100%, 55%, 0) 100%);

  @keyframes alLovedGlow{

  @media (prefers-reduced-motion: reduce){ .al-lg-breath{ animation:none; opacity:0.6; } }

  /* ================= the time numbers dance, sparkle, shine and rainbow ================= */
  /* dancing (on their own move properties, so the meter's fold-away still works) */
  #curTime, #durTime{ position:relative; overflow:visible; }
  #curTime{ animation: alNumDance 2.6s ease-in-out infinite; }
  #durTime{ animation: alNumDance 2.6s ease-in-out infinite reverse; animation-delay:-1.3s; }
  @keyframes alNumDance{
    0%, 100%{ translate: 0 0;      rotate: -7deg; scale: 1; }
    25%     { translate: 0 -7px;   rotate: 0deg;  scale: 1.14; }
    50%     { translate: 0 0;      rotate: 7deg;  scale: 1; }
    75%     { translate: 0 -4px;   rotate: 0deg;  scale: 1.08; }
  }
  /* rainbow colors flowing through the digits, with a soft shine swelling around them */
  #curTime .al-t svg, #durTime .al-t svg{ animation: alNumRainbow 7s linear infinite, alNumShine 3.2s ease-in-out infinite; }
  #durTime .al-t svg{ animation-delay: -3.5s, -1.6s; }
  @keyframes alNumRainbow{ from{ filter: hue-rotate(0deg) saturate(1.5) brightness(1.15); } to{ filter: hue-rotate(360deg) saturate(1.5) brightness(1.15); } }
  @keyframes alNumShine{
    0%, 100%{ opacity:0.92; }
    50%     { opacity:1; }

  #curTime::after, #durTime::after{
    content:""; position:absolute; inset:-35% -45%;

  @keyframes alNumGlow{ 0%, 100%{ opacity:0.15; scale:0.8; } 50%{ opacity:1; scale:1.15; } }
  /* the sparkles that pop out around them */
  .al-num-spark{

  }
  /* the star itself, with a soft halo, twinkling as it floats */
  .al-num-spark::before, .al-num-spark::after{ content:""; position:absolute; inset:0; }
  .al-num-spark::after{
    inset:-70%;
    border-radius:50%;

  .al-num-spark::before{

  @keyframes alNumSparkDrift{

  @keyframes alNumSparkSpin{ from{ rotate:0deg; } to{ rotate: var(--spin, 160deg); } }
  @media (prefers-reduced-motion: reduce){

  window.addEventListener('DOMContentLoaded', function(){
    var overlay = document.getElementById('introOverlay');

  /* ---- Planet Awesonia: Awesome Love's hand-drawn crayon world, spinning ----

     land, on one side, and the rest of the ball is crayon ocean (the far
     side is made from the same crayon strokes, with the heart taken out).
     One full turn every 32 seconds, while the spin direction wanders around

  (function(){
    var wrap = document.getElementById('introPlanet');
    if (!wrap) return;
    var img = wrap.querySelector('img');
    var canvas = wrap.querySelector('canvas');
    var BACK_SRC = 'https://pub-1a1abd4855a54958bf82eeb2e0f254e6.r2.dev/Awesome%20Love%20Images/Awesome%20Love%20Images/intro-planet-back.webp';
    var TURN_SECONDS = 32;                         // one full turn = 32 seconds

    var gl = null;
    try { gl = canvas.getContext('webgl', { premultipliedAlpha:true, alpha:true, antialias:true }) || canvas.getContext('experimental-webgl'); } catch(e){}

    var VS = 'attribute vec2 p; varying vec2 v; void main(){ v = p; gl_Position = vec4(p, 0.0, 1.0); }';
    var FS = [
      'precision highp float;',
      'varying vec2 v;',
      'uniform sampler2D uFront, uBack;',
      'uniform mat3 uRot;',
      'uniform float uPx;',
      'vec2 discUV(vec3 q){',
      '  float t = acos(clamp(q.z, -1.0, 1.0));',
      '  float s = length(q.xy);',
      '  float rad = 0.965 * (0.5 * s + 0.5 * t / 1.5707963);',
      '  vec2 d = q.xy * (rad / max(s, 1e-5));',
      '  return vec2(0.5 + 0.5 * d.x, 0.5 - 0.5 * d.y);',
      '}',
      'void main(){',
      '  float r2 = dot(v, v);',
      '  float r = sqrt(r2);',
      '  float a = 1.0 - smoothstep(1.0 - uPx * 1.5, 1.0, r);',
      '  if (a <= 0.0) { gl_FragColor = vec4(0.0); return; }',
      '  vec3 n = vec3(v, sqrt(max(0.0, 1.0 - r2)));',
      '  vec3 q = uRot * n;',
      '  vec3 col;',
      '  if (q.z >= 0.0) col = texture2D(uFront, discUV(q)).rgb;',
      '  else {',
      '    // far side: same crayon ocean, gently swirled so it never mirrors the near side',
      '    float tw = 1.6 * (1.0 - acos(clamp(-q.z, -1.0, 1.0)) / 1.5707963);',

      '    col = texture2D(uBack, discUV(vec3(c * q.x - s * q.y, s * q.x + c * q.y, -q.z))).rgb;',
      '  }',
      '  vec3 L = normalize(vec3(-0.42, 0.5, 0.76));',
      '  float diff = max(dot(n, L), 0.0);',
      '  col *= 0.74 + 0.34 * diff;',
      '  float spec = pow(max(dot(reflect(-L, n), vec3(0.0, 0.0, 1.0)), 0.0), 24.0);',
      '  col += vec3(0.16) * spec;',
      '  float rim = pow(1.0 - n.z, 2.6);',
      '  col = mix(col, vec3(0.62, 0.86, 1.0), rim * 0.42);',

    gl.bindBuffer(gl.ARRAY_BUFFER, buf);

    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    var uRot = gl.getUniformLocation(prog, 'uRot');
    var uPx = gl.getUniformLocation(prog, 'uPx');
    gl.uniform1i(gl.getUniformLocation(prog, 'uFront'), 0);
    gl.uniform1i(gl.getUniformLocation(prog, 'uBack'), 1);

    function loadTex(unit, src, done){
      var im = new Image();
      im.crossOrigin = 'anonymous';
      im.onload = function(){
        var t = gl.createTexture();
        gl.activeTexture(gl.TEXTURE0 + unit);
        gl.bindTexture(gl.TEXTURE_2D, t);

    // ---- little 3D rotation helpers (3x3, row-major) ----
    function axisRot(ax, ang){
      var x = ax[0], y = ax[1], z = ax[2], c = Math.cos(ang), s = Math.sin(ang), k = 1 - c;
      return [c + x*x*k, x*y*k - z*s, x*z*k + y*s,

      for (var i = 0; i < 3; i++) for (var j = 0; j < 3; j++)

    function orthonormalize(m){

      var b = [m[3], m[4], m[5]], d = a[0]*b[0] + a[1]*b[1] + a[2]*b[2];

      var c = [a[1]*b[2] - a[2]*b[1], a[2]*b[0] - a[0]*b[2], a[0]*b[1] - a[1]*b[0]];
      return a.concat(b, c);
    }
    // a random direction to spin around: mostly sideways-ish so the planet
    // visibly rolls, but any way at all -- up, down, diagonal, backwards
    function randomAxis(){
      var th = Math.random() * Math.PI * 2;
      var z = (Math.random() * 2 - 1) * 0.55;
      var s = Math.sqrt(1 - z*z);
      return [Math.cos(th) * s, Math.sin(th) * s, z];
    }

    var R = [1,0,0, 0,1,0, 0,0,1];
    var fromAxis = [0, 1, 0], toAxis = [0, 1, 0];  // first turn: like Earth, left to right
    var legStart = 0, legLen = 12;
    var axis = fromAxis.slice();

    function updateAxis(t){
      if (t - legStart >= legLen){
        fromAxis = axis.slice();
        toAxis = randomAxis();
        if (Math.random() < 0.5) toAxis = [-toAxis[0], -toAxis[1], -toAxis[2]];
        legStart = t;
        legLen = 9 + Math.random() * 10;           // drift to a new direction every 9-19s
      }

      u = u * u * (3 - 2 * u);                       // ease in/out
      axis = norm([fromAxis[0] + (toAxis[0] - fromAxis[0]) * u,

                   fromAxis[2] + (toAxis[2] - fromAxis[2]) * u]);
    }

      gl.viewport(0, 0, w, w);
      gl.uniform1f(uPx, 2 / w);
    }

    function draw(){

      // shader wants view -> planet, which is the transpose of R
      gl.uniformMatrix3fv(uRot, false, new Float32Array(R));
      gl.clearColor(0, 0, 0, 0);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }

    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var finished = false, running = false, raf = 0, last = 0, clock = 0;
    var omega = Math.PI * 2 / TURN_SECONDS;

    function frame(now){
      if (!running) return;
      var dt = last ? Math.min((now - last) / 1000, 0.1) : 0;
      last = now;
      if (!dragging){
        clock += dt;
        updateAxis(clock);
        R = orthonormalize(mul(axisRot(axis, omega * dt), R));
        // a flick keeps it rolling, then it slowly settles back into its own gentle spin
        if (flingW > 0.02){
          R = orthonormalize(mul(axisRot(flingAxis, flingW * dt), R));
          flingW *= Math.exp(-1.3 * dt);
        }
      }
      draw();
      raf = requestAnimationFrame(frame);
    }
    function start(){
      if (running || reduce || finished) return;
      running = true; last = 0;
      raf = requestAnimationFrame(frame);
    }
    function stop(){ running = false; cancelAnimationFrame(raf); }

    var pending = 2;
    function ready(){
      if (--pending) return;
      clearTimeout(fallbackTimer);
      draw();
      wrap.classList.remove('no-3d');
      wrap.classList.add('is-3d');
      start();
    }
    loadTex(0, img.currentSrc || img.src, ready);
    loadTex(1, BACK_SRC, ready);

    /* ---- spin Planet Awesonia with your fingers ----
       touch and drag to roll it like a globe; flick it and it keeps
       spinning, then glides back into its own slow tumble */
    var dragging = false, dragId = null, lastX = 0, lastY = 0, lastT = 0;
    var flingAxis = [0, 1, 0], flingW = 0, vel = [0, 0, 0];
    wrap.addEventListener('pointerdown', function(e){
      if (pending !== 0 || finished || !wrap.classList.contains('is-3d')) return;
      var r = wrap.getBoundingClientRect();
      var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      if (Math.hypot(e.clientX - cx, e.clientY - cy) > r.width / 2) return;   // only on the ball itself
      dragging = true; dragId = e.pointerId;
      lastX = e.clientX; lastY = e.clientY; lastT = performance.now();
      flingW = 0; vel = [0, 0, 0];
      wrap.classList.add('al-planet-grab');
      try { wrap.setPointerCapture(e.pointerId); } catch(err){}
      e.preventDefault();
    });
    wrap.addEventListener('pointermove', function(e){
      if (!dragging || e.pointerId !== dragId) return;
      var now = performance.now();
      var dx = e.clientX - lastX, dy = e.clientY - lastY;
      var dt = Math.max((now - lastT) / 1000, 0.001);
      lastX = e.clientX; lastY = e.clientY; lastT = now;
      var dist = Math.hypot(dx, dy);
      if (!dist) return;
      var ax = norm([dy, dx, 0]);
      var ang = dist / (wrap.clientWidth / 2);          // the surface follows your finger
      R = orthonormalize(mul(axisRot(ax, ang), R));
      var w = ang / dt, k = 0.35;                         // smoothed spin speed, for the flick
      vel = [vel[0] + (ax[0] * w - vel[0]) * k, vel[1] + (ax[1] * w - vel[1]) * k, 0];
      if (!running) draw();
      e.preventDefault();
    });
    function endDrag(e){
      if (!dragging || (e && e.pointerId !== dragId)) return;
      dragging = false; dragId = null;
      wrap.classList.remove('al-planet-grab');
      var still = performance.now() - lastT > 90;       // let go without moving: no flick
      var sp = Math.hypot(vel[0], vel[1]);
      if (!still && !reduce && sp > 0.3){
        flingAxis = [vel[0] / sp, vel[1] / sp, 0];
        flingW = Math.min(sp, Math.PI * 4);             // at most two turns a second
      }
      last = 0;                                          // pick the gentle spin back up smoothly
    }

    wrap.addEventListener('pointercancel', endDrag);

    window.addEventListener('resize', function(){ if (pending === 0) draw(); });

    window.addEventListener('introComplete', function(){
      finished = true;
      stop();
      var lose = gl.getExtension('WEBGL_lose_context');
      if (lose) lose.loseContext();
    });
  })();

      var delay = rand(0, 6);
      h.style.animation = 'introFloatUp ' + duration + 's ease-in ' + delay + 's infinite';
      heartsBg.appendChild(h);
    }
    for (var i = 0; i < 22; i++) spawnFloatingHeart();

    // Tap-to-continue
    let tapped = false;
    function onHeartTap(e){
      if (e) e.preventDefault();
      if (tapped) return;
      tapped = true;
      heartBtn.classList.add('intro-tapped');

      // find the heart's real position on screen so the burst originates
      // exactly from it, rather than from the dead-center of the screen
      const heartRect = heartBtn.getBoundingClientRect();
      const originX = heartRect.left + heartRect.width / 2;
      const originY = heartRect.top + heartRect.height / 2;

      // Screen-effect burst
      const flash = document.createElement('div');
      flash.className = 'intro-flash';
      flash.style.left = originX + 'px';
      flash.style.top = originY + 'px';
      burst.appendChild(flash);

      for (let i = 0; i < 46; i++){
        const bh = document.createElement('img');
        bh.className = 'intro-burst-heart';
        bh.src = randomHeartSrc();
        bh.alt = '';
        bh.style.left = originX + 'px';
        bh.style.top = originY + 'px';
        const angle = rand(0, Math.PI * 2);
        const dist = rand(220, Math.max(window.innerWidth, window.innerHeight) * 0.75);
        bh.style.setProperty('--tx', (Math.cos(angle) * dist) + 'px');
        bh.style.setProperty('--ty', (Math.sin(angle) * dist) + 'px');
        bh.style.animationDelay = rand(0, 0.15) + 's';
        burst.appendChild(bh);
      }

      // fade out the "do you love music" content quickly
      setTimeout(() => {
        content.classList.add('intro-fade-out');
      }, 550);

      // straight on to "What Musical Mood Are You In?" (no Awesome Love
      // Music logo in between) -- the mood page is already waiting underneath
      setTimeout(() => {
        overlay.classList.add('intro-hide');
      }, 900);
      setTimeout(() => {
        overlay.style.display = 'none';
        window.dispatchEvent(new CustomEvent('introComplete'));
      }, 900 + 850);
    }
    heartBtn.addEventListener('click', onHeartTap);
    heartBtn.addEventListener('touchend', onHeartTap, {passive:false});
  });
  </script>

    document.body.appendChild(box);
  }
  window.addEventListener('error', (e) => {
    showError('JS ERROR: ' + (e.message || 'unknown') + '\n' + (e.filename || '') + ':' + (e.lineno || '') + ':' + (e.colno || ''));
  });
  window.addEventListener('unhandledrejection', (e) => {

})();

const NOWPLAYING_FIT_CANVAS = document.createElement('canvas');

function alNowPlayingMax(){
  // the song that's playing gets the big space now: as big as the room between
  // the album cover and the bottom of the screen allows (the album title above
  // the meter stays small)
  try {
    const covers = document.querySelectorAll('.cover-wrap');
    const cx = window.innerWidth / 2;
    let best = null;
    covers.forEach(c => {
      const r = c.getBoundingClientRect();
      if (!r.width) return;
      if (!best || Math.abs((r.left + r.right) / 2 - cx) < Math.abs((best.left + best.right) / 2 - cx)) best = r;
    });
    if (!best) return 21;
    const titleH = 0;                   // no album title under the covers anymore
    const baseTransport = 128;          // meter + controls (the bigger meter now) with a small song name
    const extra = window.innerHeight - best.bottom - 14 - titleH - baseTransport;

  if (!nowPlaying) return;

  const text = nowPlaying.textContent || '';
  if (!NOWPLAYING_FIT_CTX || !text){ nowPlaying.style.fontSize = maxSize + 'px'; return; }

  let size = maxSize;
  while (size > minSize){
    NOWPLAYING_FIT_CTX.font = '400 ' + size + 'px ' + NOWPLAYING_FONT_STACK;
    if (NOWPLAYING_FIT_CTX.measureText(text).width <= maxWidth) break;

/* ---------- album color extraction (for the room glow) ----------
   Pulls the two most dominant, saturated hues out of each cover (rather
   than a flat average of every pixel, which turns busy multicolor covers
   into a muddy gray) so the glow actually reads as "this cover's colors". */
function extractPaletteColors(img){
  try {
    const SZ = 24;
    const c = document.createElement('canvas');
    c.width = SZ; c.height = SZ;
    const ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0, SZ, SZ);
    const d = ctx.getImageData(0, 0, SZ, SZ).data;

    // 12 hue buckets (30deg each), weighted toward saturated, mid-lightness pixels
    const buckets = new Array(12).fill(null).map(() => ({ r:0, g:0, b:0, w:0 }));
    let favR=0, favG=0, favB=0, favN=0;

    for (let p = 0; p < d.length; p += 4){
      const r = d[p], g = d[p+1], b = d[p+2], a = d[p+3];
      if (a < 40) continue;
      favR += r; favG += g; favB += b; favN++;

      const max = Math.max(r,g,b), min = Math.min(r,g,b), dlt = max - min;
      const l = (max + min) / 2 / 255;
      if (l < 0.07 || l > 0.93 || dlt < 18) continue; // skip near-black/near-white/gray pixels

      const s = l > 0.5 ? dlt / (510 - max - min) : dlt / (max + min);
      let h;
      if (max === r) h = ((g - b) / dlt) % 6;
      else if (max === g) h = (b - r) / dlt + 2;
      else h = (r - g) / dlt + 4;
      h *= 60; if (h < 0) h += 360;

      const weight = s * (1 - Math.abs(l - 0.5) * 1.3);
      if (weight <= 0) continue;
      const bi = Math.min(11, Math.floor(h / 30));
      buckets[bi].r += r * weight;
      buckets[bi].g += g * weight;
      buckets[bi].b += b * weight;
      buckets[bi].w += weight;
    }

    const ranked = buckets
      .filter(bk => bk.w > 0.05)
      .map(bk => ({ r: Math.round(bk.r/bk.w), g: Math.round(bk.g/bk.w), b: Math.round(bk.b/bk.w), w: bk.w }))
      .sort((x,y) => y.w - x.w);

    if (ranked.length === 0){
      if (favN === 0) return null;
      const r = Math.round(favR/favN), g = Math.round(favG/favN), b = Math.round(favB/favN);
      const solo = `rgb(${r},${g},${b})`;
      return [solo, solo, solo, solo];
    }
    // top 4 distinct hues from the cover, most-dominant first; repeats the last
    // one found if the cover doesn't have four separate hues to offer
    const top = ranked.slice(0, 4).map(bk => `rgb(${bk.r},${bk.g},${bk.b})`);
    while (top.length < 4) top.push(top[top.length - 1]);
    return top;
  } catch(e){
    return null;
  }
}

var _lastLayout = '';
function layoutCoversAt(pos){
  const wraps = flow.children;
  // measure once per frame (not once per cover), and rest when nothing has changed
  const vw = window.innerWidth / 100;
  const coverW = flow.firstElementChild ? flow.firstElementChild.getBoundingClientRect().width : 200;
  const key = pos + '|' + wraps.length + '|' + window.innerWidth + '|' + coverW;
  if (key === _lastLayout) return;
  _lastLayout = key;
  for (let i = 0; i < wraps.length; i++){
    const wrap = wraps[i];
    const offset = i - pos;
    const abs = Math.abs(offset);
    const dir = offset === 0 ? 0 : (offset > 0 ? 1 : -1);
    const t = Math.min(abs, 1); // 0 at center -> 1 at first neighbor

    const ry = -dir * t * 42;
    const scale = 1 - 0.18 * t;
    const tz = -90 * t - 40 * Math.max(abs - 1, 0);
    const opacity = abs > 6 ? 0 : 1 - 0.05 * Math.max(abs - 1, 0);
    // Use vw-based spread so positioning is always relative to screen width,
    // not cover size -- this fixes mobile portrait AND landscape
    // convert vw spread to percentage of cover width (since transform uses %)
    const spreadVW = window.innerWidth < 600 ? 22 : 40; // vw units
    const extraVW  = window.innerWidth < 600 ? 8  : 14;
    const spreadPct = (spreadVW * vw) / coverW * 100;
    const extraPct  = (extraVW  * vw) / coverW * 100;
    const pxOffset = dir * (spreadPct * t + extraPct * Math.max(abs - 1, 0));

    wrap.style.transform =
      `translate(-50%,-50%) translateX(${pxOffset}%) translateZ(${tz}px) rotateY(${ry}deg) scale(${scale})`;
    wrap.style.zIndex = Math.round(200 - abs * 10);
    wrap.style.opacity = Math.max(0, opacity);
  }

let alWhooshBuf = null;
function alWhooshNoise(ctx){
  if (alWhooshBuf && alWhooshBuf.sampleRate === ctx.sampleRate) return alWhooshBuf;
  const sr = ctx.sampleRate, buf = ctx.createBuffer(1, sr * 2, sr), d = buf.getChannelData(0);
  let b0 = 0, b1 = 0, b2 = 0;
  for (let i = 0; i < d.length; i++){
    const w = Math.random() * 2 - 1;
    b0 = 0.99765 * b0 + w * 0.0990460;
    b1 = 0.96300 * b1 + w * 0.2965164;
    b2 = 0.57000 * b2 + w * 1.0526913;
    d[i] = (b0 + b1 + b2 + w * 0.1848) * 0.18;
  }
  return (alWhooshBuf = buf);
}
function playRolodexClick(evenWhilePlaying){
  if (!audioCtx) return;
  // while a song is actually playing, flipping albums stays peaceful -- the tock
  // stays quiet. But scrolling an album's song list keeps its awesome dook-dook
  // even while the music plays (those callers pass evenWhilePlaying = true).
  if (!evenWhilePlaying && typeof audio !== 'undefined' && audio && !audio.paused && !audio.ended) return;
  // resume() is async, so right after a fast flick the context can still say
  // "suspended" for a beat -- rather than silently dropping the tock, wait
  // for the resume to land and then play it (still lands quickly / feels instant)
  if (audioCtx.state === 'suspended'){
    audioCtx.resume().then(() => playRolodexClick(evenWhilePlaying)).catch(() => {});
    return;
  }
  if (audioCtx.state !== 'running') return;
  try {
    const now = audioCtx.currentTime;
    // how thin the dook is right now (0 = the full 432 dook, 1 = the thinnest tick),
    // flowing around a 16-second cycle
    const thin = alDookThinness();
    // a little whoosh, like the back arrow's sound, but tuned: smooth noise run
    // through a ringing filter at A=432 (the full, round whoosh) and two octaves
    // up at 1728 Hz, still an A in 432 tuning (the thin, bright whoosh) -- the
    // 16-second cycle blends between them
    const noise = alWhooshNoise(audioCtx);
    const voice = (freq, peak, len) => {
      if (peak < 0.003) return;
      const src = audioCtx.createBufferSource();
      src.buffer = noise;
      const bp = audioCtx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.Q.value = 7;                                       // rings at the note, so it's in tune
      bp.frequency.setValueAtTime(freq * 1.06, now);
      bp.frequency.exponentialRampToValueAtTime(freq, now + len * 0.6);   // settles onto the A
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(peak, now + len * 0.35);    // a soft swell in...
      gain.gain.exponentialRampToValueAtTime(0.0001, now + len);         // ...and a soft fade away
      src.connect(bp); bp.connect(gain); gain.connect(alSfxOut(audioCtx));
      const off = Math.random() * (noise.duration - len - 0.05);
      src.start(now, Math.max(0, off), len + 0.02);
    };
    // as it thins it gets shorter and brighter
    const len = 0.17 - 0.11 * thin;             // 170 ms -> 60 ms
    voice(432, 8.5 * (1 - thin), len);
    voice(1728, 5.5 * thin, len);
  } catch(err){ /* purely decorative -- fail silently */ }
}

/* prime/unlock the click-sound AudioContext on the very first genuine gesture
   anywhere on the page. This matters because browsers don't count trackpad
   or mouse-wheel scrolling as a gesture that's allowed to unlock audio, so if
   someone's first interaction with the cover flow is a wheel-swipe (very
   common on laptops), the click sound stays silently muted until some other
   real click/tap/keypress happens -- which is exactly the "works after I
   click a song" symptom. Listening broadly here means it unlocks immediately
   on whatever the user does first, instead of depending on which specific
   control happens to catch that first gesture. Safari (particularly iOS) can
   also be picky about exactly which gesture type it credits, so several are
   covered rather than relying on just one.                    */
['pointerdown', 'touchend', 'mousedown', 'keydown', 'click'].forEach((evt) => {
  document.addEventListener(evt, ensureAudioCtx, { passive: true });
});

/* ---------- nearest-cover content sync (crossfade) ---------- */
let fadeTimer = null;
function syncNearest(){
  const n = Math.max(0, Math.min(MAX_IDX, Math.round(flowPos)));
  if (n === activeIndex) return;
  const isFirstSync = (activeIndex === -1);
  activeIndex = n;
  setGlow(albumColors[n]);
  // if a story happens to be open while the covers get browsed underneath
  // it, keep its small header cover (and glow) in sync with whichever
  // album is now active, instead of it silently going stale
  if (typeof restartStoryCoverGlowIfOpen === 'function') restartStoryCoverGlowIfOpen();
  if (!isFirstSync) playRolodexClick();
  // moving the carousel always drops you back into normal album view
  if (showingFavorites){
    showingFavorites = false;
    if (favoritesBtn) favoritesBtn.classList.remove('active');
    trackPanel.classList.remove('favorites-open');
  }
  infoCard.classList.add('content-fading');
  trackPanel.classList.add('content-fading');
  clearTimeout(fadeTimer);
  fadeTimer = setTimeout(() => {
    renderInfo();
    renderTracks();
    infoCard.classList.remove('content-fading');
    trackPanel.classList.remove('content-fading');
  }, 170);
}

/* ---------- physics loop ---------- */
const SPRING = 0.14;
const FRICTION = 0.94;

function clampPos(p){ return Math.max(0, Math.min(MAX_IDX, p)); }

function tick(){
  if (!isDragging){
    if (targetPos !== null){
      const diff = targetPos - flowPos;
      flowPos += diff * SPRING;
      if (Math.abs(diff) < 0.002){
        flowPos = targetPos;
        targetPos = null;
      }
    } else if (Math.abs(velocity) > 0.0004){
      flowPos += velocity;
      velocity *= FRICTION;
      if (flowPos <= 0 || flowPos >= MAX_IDX){
        flowPos = clampPos(flowPos);
        velocity = 0;
        targetPos = Math.round(flowPos);
      } else if (Math.abs(velocity) < 0.006){
        velocity = 0;
        targetPos = Math.round(flowPos);
      }
    }
  }

  layoutCoversAt(flowPos);
  syncNearest();
  homeTrackTick();
  requestAnimationFrame(tick);
}

/* ---------- global play counters ---------- */
const COUNTER_API = "https://awesome-plays.awesomeahsum.workers.dev";

const totalPlaysEl = document.getElementById('totalPlays');
let playCounts = {};

function origRel(rel){ return rel && rel._orig ? rel._orig : rel; }
function masterIdxOf(relIdx){
  const m = ALL_RELEASES.indexOf(origRel(releases[relIdx]));
  return m === -1 ? relIdx : m;
}
// a loved-songs album only holds some of the album's tracks, so find each
// track's real position on the full album by the track itself
function masterTrackIdxOf(relIdx, trackIdx){
  const rel = releases[relIdx];
  if (!rel || !rel._orig) return trackIdx;
  const t = rel._orig.tracks.indexOf(rel.tracks[trackIdx]);
  return t === -1 ? trackIdx : t;
}
function playKey(relIdx, trackIdx){ return masterPlayKey(masterIdxOf(relIdx), masterTrackIdxOf(relIdx, trackIdx)); }
// renamed releases/songs keep their ORIGINAL name as a hidden save key, so
// everyone's play counts and loved songs carry over through a rename
function savedName(o){ return (o && o.keyTitle) || o.title; }
function masterPlayKey(relIdx, trackIdx){
  const naive = savedName(ALL_RELEASES[relIdx]) + '::' + savedName(ALL_RELEASES[relIdx].tracks[trackIdx]);
  const myYear = Number(ALL_RELEASES[relIdx].year) || 0;
  // guard against two different songs sharing the exact same "release title :: track
  // title" combo (e.g. the new "Awesome" single vs. the track "Awesome" on the 2022
  // Awesome album) and silently sharing/inheriting each other's play counts.
  // whichever release is OLDER keeps the plain key (and its real accumulated
  // history); only the newer one gets a unique suffix so it starts its own
  // fresh count instead of stepping on the older song's plays. That suffix is
  // the track's own mp3 URL -- a permanent identifier for the file -- rather
  // than its position in the ALL_RELEASES array, since the array's order can
  // (and does) change whenever a release gets added or reordered, which
  // would otherwise silently reset this song's plays back to zero every time.
  for (let r = 0; r < ALL_RELEASES.length; r++){
    for (let t = 0; t < ALL_RELEASES[r].tracks.length; t++){
      if (r === relIdx && t === trackIdx) continue;
      if (savedName(ALL_RELEASES[r]) + '::' + savedName(ALL_RELEASES[r].tracks[t]) !== naive) continue;
      const otherYear = Number(ALL_RELEASES[r].year) || 0;
      const otherIsOlder = otherYear < myYear
        || (otherYear === myYear && r < relIdx)
        || (otherYear === myYear && r === relIdx && t < trackIdx);
      if (otherIsOlder) return naive + '::' + ALL_RELEASES[relIdx].tracks[trackIdx].src;
    }
  }
  return naive;
}
function fmtPlays(n){
  if (!n) return '0';
  if (n >= 1e6) return (n/1e6).toFixed(1).replace(/\.0$/,'') + 'M';
  if (n >= 1e3) return (n/1e3).toFixed(1).replace(/\.0$/,'') + 'k';
  return String(n);
}
function trackPlays(r,t){ return playCounts[playKey(r,t)] || 0; }
function albumPlays(r){ return releases[r].tracks.reduce((s,_,t) => s + trackPlays(r,t), 0); }
function totalPlays(){ return ALL_RELEASES.reduce((s,rel,m) => s + rel.tracks.reduce((a,_,t) => a + (playCounts[masterPlayKey(m,t)] || 0), 0), 0); }

/* keeps the rainbow play count next to the playhead's song name in sync
   with whichever track is actually loaded up right now */
function updatePlayheadPlays(){
  if (!playheadPlays) return;
  const numEl = document.getElementById('phPlaysNum');
  const has = currentTrack.relIdx !== -1;
  playheadPlays.classList.toggle('no-track', !has);
  if (numEl) numEl.textContent = has ? fmtPlays(trackPlays(currentTrack.relIdx, currentTrack.trackIdx)) : '';
}

function loadCounts(){
  loadLocalCounts();
  if (COUNTER_API){
    fetch(COUNTER_API + '/counts', {mode:'cors', cache:'no-store'})
      .then(r => { if(!r.ok) throw new Error('status '+r.status); return r.json(); })
      .then(d => {
        playCounts = d || {};
        saveLocalCounts();
        refreshPlayUI();
      })
      .catch(err => { console.warn('Worker fetch failed:', err); });
  }
}
function loadLocalCounts(){
  try { playCounts = JSON.parse(localStorage.getItem('al_plays') || '{}'); } catch(e){ playCounts = {}; }
  refreshPlayUI();
}
function saveLocalCounts(){
  try { localStorage.setItem('al_plays', JSON.stringify(playCounts)); } catch(e){}
}

function recordPlay(relIdx, trackIdx){
  const key = playKey(relIdx, trackIdx);
  playCounts[key] = (playCounts[key] || 0) + 1;
  saveLocalCounts();
  refreshPlayUI();
  if (COUNTER_API){
    fetch(COUNTER_API + '/play?key=' + encodeURIComponent(key), { method: 'POST' })
      .then(r => r.json())
      .then(d => { if (d && typeof d.count === 'number'){ playCounts[key] = d.count; refreshPlayUI(); } })
      .catch(() => {});
  }
}

function refreshPlayUI(){
  if (showingFavorites) { renderFavorites(); } else { renderInfo(); renderTracks(); }
  const playsCountNum = document.getElementById('playsCountNum');
  if (playsCountNum) playsCountNum.textContent = fmtPlays(totalPlays());
  updatePlayheadPlays();
}

/* the PLAYS wordmark sits there breathing/sparkling with no number showing --
   tapping it fades the wordmark away to reveal the play count in its place
   for 10 seconds, then fades back to the wordmark */
let exactRevealTimer = null;


/* ---------- the TOP plays number: tapped, it leaps out and bounces its way
   across the whole screen -- slow, medium, fast, medium, slow, then one super
   slow bounce -- growing bigger the whole way, and finishing in a burst of rich,
   rainbow-shifting color as it fades away ---------- */
const alFlyPlaysAcrossScreen = (function(){
  // [seconds per bounce, how many bounces, how high (share of the screen height)]
  const PHASES = [
    [1.20, 2, 0.20],   // slow
    [0.70, 2, 0.13],   // medium
    [0.35, 4, 0.06],   // fast
    [0.70, 2, 0.13],   // medium
    [1.20, 1, 0.20],   // slow
    [2.20, 1, 0.30],   // super slow -- the finale
  ];
  const TOTAL = PHASES.reduce((a, p) => a + p[0] * p[1], 0);       // 10 seconds
  const FINALE_START = TOTAL - PHASES[PHASES.length - 1][0];
  const smooth = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);
  let layer = null, raf = null;
  // a smooth curve through a few points (Catmull-Rom)
  function along(pts, u){
    const n = pts.length - 1;
    const seg = Math.min(n - 1, Math.floor(u * n));
    const lt = u * n - seg;
    const p0 = pts[Math.max(0, seg - 1)], p1 = pts[seg], p2 = pts[seg + 1], p3 = pts[Math.min(n, seg + 2)];
    const c = (a, b, c2, d) => 0.5 * ((2 * b) + (-a + c2) * lt + (2 * a - 5 * b + 4 * c2 - d) * lt * lt + (-a + 3 * b - 3 * c2 + d) * lt * lt * lt);
    return [c(p0[0], p1[0], p2[0], p3[0]), c(p0[1], p1[1], p2[1], p3[1])];
  }
  return function fly(fromEl, text, opts){
    opts = opts || {};
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return false;
    if (raf) cancelAnimationFrame(raf);
    if (layer) layer.remove();
    layer = document.createElement('div');
    layer.className = 'al-plays-flyer';
    layer.setAttribute('aria-hidden', 'true');
    layer.innerHTML = '<span class="al-plays-flyer-num">' + alHandText(text) + '</span>';
    document.body.appendChild(layer);
    const numEl = layer.firstChild;
    const W = window.innerWidth, H = window.innerHeight;
    const r = fromEl.getBoundingClientRect();
    const w0 = numEl.offsetWidth || 40, h0 = numEl.offsetHeight || 20;
    // as big as it can get while still fitting on the screen
    const maxGrow = Math.max(1.5, Math.min(14, (W * 0.9) / w0, (H * 0.38) / h0));
    // when it comes out of the big PLAYS, it starts as big as PLAYS was and melts into its dance
    const startScale = opts.startWidth ? Math.min(maxGrow, Math.max(1, opts.startWidth / w0, 0)) : 0;
    const fadeIn = startScale ? 0.7 : 0.35;
    // its trip: out from the top, down and across to the left, all the way over to
    // the right, then back toward the middle for the finale
    const pts = [
      [r.left + r.width / 2, r.top + r.height / 2 + (startScale ? h0 * startScale / 2 : 0)],
      [W * 0.22, H * 0.62],
      [W * 0.78, H * 0.66],
      [W * 0.50, H * 0.55],
    ];
    const t0 = performance.now();
    function frame(now){
      const t = (now - t0) / 1000;
      if (t >= TOTAL){ raf = null; layer.remove(); layer = null; return; }
      let acc = 0, height = 0, inB = 0;
      for (const [d, n, hgt] of PHASES){
        if (t < acc + d * n){ inB = ((t - acc) % d) / d; height = hgt; break; }
        acc += d * n;
      }
      const lift = Math.sin(Math.PI * inB);
      const land = Math.max(0, 1 - Math.min(inB, 1 - inB) / 0.08);
      const squash = 1 - 0.12 * land;
      let grow = 1 + (maxGrow - 1) * (0.8 * smooth(t / FINALE_START) + 0.2 * smooth((t - FINALE_START) / (TOTAL - FINALE_START)));
      if (startScale) grow = startScale + (Math.max(maxGrow, startScale) - startScale) * (0.8 * smooth(t / FINALE_START) + 0.2 * smooth((t - FINALE_START) / (TOTAL - FINALE_START)));
      // the ground it bounces on travels the path; the first bounce eases it in from the top
      const [gx, gy] = along(pts, smooth(t / TOTAL * 0.98 + 0.01));
      const ease = startScale ? smooth((t - 0.4) / 1.6) : smooth(t / 0.6);
      // bounce high, but never past the top of the screen
      const y = Math.max(h0 * grow * squash + 8, gy - height * H * lift * ease);
      // and never past the left or right edge either, however big it has grown
      const halfW = w0 * grow / squash / 2 + 8;
      const x = Math.max(halfW, Math.min(W - halfW, gx));
      layer.style.transform = 'translate(' + x.toFixed(1) + 'px, ' + y.toFixed(1) + 'px) translate(-50%, -100%)';
      numEl.style.transform = 'scale(' + (grow / squash).toFixed(3) + ', ' + (grow * squash).toFixed(3) + ')';
      const f = smooth((t - FINALE_START) / (TOTAL - FINALE_START));
      layer.style.opacity = f > 0 ? (1 - smooth((t - FINALE_START - 0.4) / (TOTAL - FINALE_START - 0.4))).toFixed(3) : smooth(Math.min(1, t / fadeIn)).toFixed(3);
      numEl.style.filter = 'saturate(' + (1.4 + 2.4 * f).toFixed(2) + ') brightness(' + (0.95 + 0.5 * f).toFixed(2) + ') hue-rotate(' + (f * 360).toFixed(0) + 'deg) drop-shadow(0 0 ' + (0.04 + 0.3 * f).toFixed(2) + 'em rgba(255,255,255,' + (0.15 + 0.45 * f).toFixed(2) + '))';
      raf = requestAnimationFrame(frame);
    }
    raf = requestAnimationFrame(frame);
    return true;
  };
})();

/* ---------- tapping either PLAYS button: the PLAYS drawing leaps out, grows
   to about half the screen, dances for a moment, then pops in a little shower
   of hearts -- and out of that pop comes the plays number, dancing full screen ---------- */
let alPlaysShowOn = false;
function alPlaysGrowThenDance(imgEl, text, onDone){
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce || !imgEl || !imgEl.animate) return false;
  if (alPlaysShowOn) return true;   // already out dancing
  alPlaysShowOn = true;
  const W = window.innerWidth, H = window.innerHeight;
  const r = imgEl.getBoundingClientRect();
  const ratio = (imgEl.naturalHeight || 240) / (imgEl.naturalWidth || 353);
  // about half the screen: wide on a phone, never taller than half the height
  const tw = Math.min(W * 0.82, (H * 0.5) / ratio, 640);
  const big = document.createElement('img');
  big.className = 'al-plays-big';
  big.src = imgEl.src;
  big.alt = '';
  big.style.width = tw + 'px';
  document.body.appendChild(big);
  const dx = (r.left + r.width / 2) - W / 2, dy = (r.top + r.height / 2) - H / 2;
  const s0 = Math.max(0.02, r.width / tw);
  const at = (x, y, sc, rot) => 'translate(-50%,-50%) translate(' + x + 'px,' + y + 'px) scale(' + sc + ') rotate(' + rot + 'deg)';
  const glow = (h, g) => 'hue-rotate(' + h + 'deg) saturate(1.5) drop-shadow(0 0 ' + g + 'px rgba(255,255,255,0.55))';
  // 1) leap out and grow, with a happy overshoot
  const grow = big.animate([
    { transform: at(dx, dy, s0, 0),     filter: glow(0, 0),  offset: 0 },
    { transform: at(0, 0, 1.04, -3),    filter: glow(0, 16), offset: 0.75 },
    { transform: at(0, 0, 1, 0),        filter: glow(0, 14), offset: 1 }
  ], { duration: 1600, easing: 'cubic-bezier(.45,0,.2,1)', fill: 'forwards' });
  grow.onfinish = () => {
    // 2) a little dance: sway, bob and glow through the rainbow
    const dance = big.animate([
      { transform: at(0, 0, 1, 0),        filter: glow(0, 14) },
      { transform: at(-10, -14, 1.06, -7), filter: glow(90, 24) },
      { transform: at(0, 0, 1, 0),        filter: glow(180, 14) },
      { transform: at(10, -14, 1.06, 7),  filter: glow(270, 24) },
      { transform: at(0, 0, 1, 0),        filter: glow(360, 14) }
    ], { duration: 1500, easing: 'ease-in-out', fill: 'forwards' });
    dance.onfinish = () => {
      // 3) pop! hearts burst out and the number starts its full-screen dance
      if (typeof spawnHeartBurst === 'function' && typeof ALL_HEARTS_IMG_SRCS !== 'undefined'){
        // a HUGE explosion: four waves of hearts, close, middle, far and all the way out
        try {
          const far = Math.max(W, H);
          spawnHeartBurst(W / 2, H / 2, { imgSrcs: ALL_HEARTS_IMG_SRCS, count: 30, minDist: 40,  maxDist: far * 0.25, minSize: 16, maxSize: 40 });
          spawnHeartBurst(W / 2, H / 2, { imgSrcs: ALL_HEARTS_IMG_SRCS, count: 30, minDist: far * 0.2, maxDist: far * 0.45, minSize: 22, maxSize: 56 });
          setTimeout(() => spawnHeartBurst(W / 2, H / 2, { imgSrcs: ALL_HEARTS_IMG_SRCS, count: 26, minDist: far * 0.35, maxDist: far * 0.7, minSize: 26, maxSize: 70 }), 120);
          setTimeout(() => spawnHeartBurst(W / 2, H / 2, { imgSrcs: ALL_HEARTS_IMG_SRCS, count: 18, minDist: far * 0.5, maxDist: far * 0.9, minSize: 34, maxSize: 90 }), 260);
          if (typeof spawnRainbowBurst === 'function') spawnRainbowBurst(W / 2, H / 2);
        } catch(e){}
      }
      const centre = { getBoundingClientRect: () => ({ left: W / 2 - 1, top: H / 2 - 1, width: 2, height: 2 }) };
      if (typeof alFlyPlaysAcrossScreen === 'function') alFlyPlaysAcrossScreen(centre, text, { startWidth: tw * 0.85 });
      const pop = big.animate([
        { transform: at(0, 0, 1, 0),    opacity: 1, filter: glow(0, 14) + ' blur(0px)' },
        { transform: at(0, 0, 1.08, 0), opacity: 0.5, filter: glow(0, 22) + ' blur(4px)', offset: 0.5 },
        { transform: at(0, 0, 1.15, 0), opacity: 0, filter: glow(0, 30) + ' blur(12px)' }
      ], { duration: 900, easing: 'ease-in-out', fill: 'forwards' });
      pop.onfinish = () => big.remove();
      // the number dances for 10 seconds, then everything settles back home
      setTimeout(() => { alPlaysShowOn = false; if (onDone) onDone(); }, 10000);
    };
  };
  return true;
}

function revealPlaysCount(){
  const topWrap = document.getElementById('playsWordWrap');
  const topImg = topWrap && topWrap.querySelector('.plays-word-img');
  if (topWrap && !alPlaysShowOn && alPlaysGrowThenDance(topImg, totalPlays().toLocaleString(), () => topWrap.classList.remove('al-plays-out'))){
    topWrap.classList.add('al-plays-out');
    return;
  }
  if (alPlaysShowOn) return;
  alRevealPlaysCountOld();
}
function alRevealPlaysCountOld(){
  const wrap = document.getElementById('playsWordWrap');
  const playsCountNum = document.getElementById('playsCountNum');
  if (!wrap || !playsCountNum) return;
  clearTimeout(exactRevealTimer);
  playsCountNum.textContent = totalPlays().toLocaleString();
  wrap.classList.add('revealing');
  exactRevealTimer = setTimeout(() => wrap.classList.remove('revealing', 'flying'), 10000);
  if (typeof alFlyPlaysAcrossScreen === 'function' && alFlyPlaysAcrossScreen(wrap, totalPlays().toLocaleString())){
    wrap.classList.add('flying');   // the number is off on its trip, so its spot stays empty
  }
}
if (totalPlaysEl){
  totalPlaysEl.addEventListener('click', revealPlaysCount);
}

/* ---------- favorites (saved / loved songs) ---------- */
let favorites = {}; // key: "relIdx::trackIdx" -> true

/* Loved songs used to be remembered by their POSITION in the discography
   ("album #12, song #3"). Every time a new release is added at the top, every
   position shifts, so hearts ended up on the wrong songs. Now each loved song
   is remembered by the song itself (album + song title, same key as plays). */
function favKey(relIdx, trackIdx){ return playKey(relIdx, trackIdx); }

function loadFavorites(){
  try { favorites = JSON.parse(localStorage.getItem('al_loved_v2') || 'null'); } catch(e){ favorites = null; }
  if (!favorites){
    // one-time move from the old position-based hearts to song-based hearts,
    // keeping whatever each visitor currently sees as loved
    favorites = {};
    let old = {};
    try { old = JSON.parse(localStorage.getItem('al_favorites') || '{}'); } catch(e){}
    Object.keys(old).forEach(k => {
      const [m, t] = k.split('::').map(Number);
      if (ALL_RELEASES[m] && ALL_RELEASES[m].tracks[t]) favorites[masterPlayKey(m, t)] = true;
    });
    saveFavorites();
  }
}
function saveFavorites(){
  try { localStorage.setItem('al_loved_v2', JSON.stringify(favorites)); } catch(e){}
}
function isFavorite(relIdx, trackIdx){ return !!favorites[favKey(relIdx, trackIdx)]; }

function toggleFavorite(relIdx, trackIdx, heartEl){
  const key = favKey(relIdx, trackIdx);
  const wasSaved = !!favorites[key];
  if (wasSaved) delete favorites[key];
  else favorites[key] = true;
  saveFavorites();
  if (heartEl){
    heartEl.classList.add('pulse');
    setTimeout(() => heartEl.classList.remove('pulse'), 350);
    if (!wasSaved){
      const r = heartEl.getBoundingClientRect();
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      spawnHeartBurst(cx, cy, { imgSrcs: ALL_HEARTS_IMG_SRCS });
    }
  }
  if (showingFavorites) renderFavorites(); else renderTracks();
  if (lovedViewOn) setTimeout(refreshLovedView, 450);  // let the heart animation play first
}

/* ---------- heart burst animation (fires when a song is loved) ---------- */
let burstLayer = null;
const BURST_DUR = 4; // seconds -- how long each burst heart drifts before fading
function spawnHeartBurst(cx, cy, opts){
  opts = opts || {};
  if (!burstLayer){
    burstLayer = document.createElement('div');
    burstLayer.className = 'burst-layer';
    document.body.appendChild(burstLayer);
  }
  const COUNT = opts.count || 12;
  const minDist = opts.minDist != null ? opts.minDist : 90;
  const maxDist = opts.maxDist != null ? opts.maxDist : 240;
  const minSize = opts.minSize != null ? opts.minSize : 18;
  const maxSize = opts.maxSize != null ? opts.maxSize : 44;
  const dur = opts.dur || BURST_DUR;
  const imgSrcs = opts.imgSrcs || [HEART_IMG_SRC];
  for (let i = 0; i < COUNT; i++){
    const el = document.createElement('img');
    el.className = 'burst-particle burst-heart';
    el.src = imgSrcs[Math.floor(Math.random() * imgSrcs.length)];
    el.alt = '';
    const angle = (Math.PI * 2 * i) / COUNT + (Math.random() * 0.5 - 0.25);
    const dist = minDist + Math.random() * (maxDist - minDist);
    const tx = Math.cos(angle) * dist;
    const ty = Math.sin(angle) * dist - dist * 0.15; // gentle upward float
    const size = minSize + Math.random() * (maxSize - minSize);
    const delay = Math.random() * 0.25; // slight stagger so the burst doesn't feel too uniform
    el.style.left = cx + 'px';
    el.style.top = cy + 'px';
    el.style.width = size + 'px';
    el.style.height = 'auto';
    el.style.setProperty('--tx', tx + 'px');
    el.style.setProperty('--ty', ty + 'px');
    el.style.setProperty('--rot', (Math.random() * 140 - 70) + 'deg');
    el.style.setProperty('--dur', dur + 's');
    el.style.animationDelay = delay + 's';
    burstLayer.appendChild(el);
    setTimeout(() => el.remove(), (dur + delay) * 1000 + 80);
  }
}

/* ---------- rainbow burst (fires alongside the heart burst) ---------- */
function spawnRainbowBurst(cx, cy, opts){
  opts = opts || {};
  if (!burstLayer){
    burstLayer = document.createElement('div');
    burstLayer.className = 'burst-layer';
    document.body.appendChild(burstLayer);
  }
  const dur = opts.dur || BURST_DUR;
  const flashSize = opts.flashSize || 150;

  // colorful flash ring that blooms and dissolves over the burst
  const flash = document.createElement('div');
  flash.className = 'rainbow-flash';
  if (Math.random() < 0.5) flash.style.animationName = 'rainbowFlashRev';   // swirls either way
  flash.style.left = cx + 'px';
  flash.style.top = cy + 'px';
  flash.style.width = flashSize + 'px';
  flash.style.height = flashSize + 'px';
  flash.style.marginLeft = (-flashSize / 2) + 'px';
  flash.style.marginTop = (-flashSize / 2) + 'px';
  flash.style.setProperty('--dur', dur + 's');
  burstLayer.appendChild(flash);
  setTimeout(() => flash.remove(), dur * 1000 + 80);

  // rainbow-hued sparks radiating outward alongside the hearts
  const COUNT = opts.count || 16;
  const minDist = opts.minDist != null ? opts.minDist : 80;
  const maxDist = opts.maxDist != null ? opts.maxDist : 230;
  const minSize = opts.minSize != null ? opts.minSize : 5;
  const maxSize = opts.maxSize != null ? opts.maxSize : 12;
  for (let i = 0; i < COUNT; i++){
    const el = document.createElement('div');
    el.className = 'burst-particle burst-spark';
    const hue = Math.round((360 / COUNT) * i);
    el.style.background = 'hsl(' + hue + ', 88%, 60%)';
    el.style.color = 'hsl(' + hue + ', 88%, 60%)'; // drives the glow via currentColor
    const angle = (Math.PI * 2 * i) / COUNT + (Math.random() * 0.3 - 0.15);
    const dist = minDist + Math.random() * (maxDist - minDist);
    const tx = Math.cos(angle) * dist;
    const ty = Math.sin(angle) * dist - dist * 0.1;
    const size = minSize + Math.random() * (maxSize - minSize);
    const delay = Math.random() * 0.25;
    el.style.left = cx + 'px';
    el.style.top = cy + 'px';
    el.style.width = size + 'px';
    el.style.height = size + 'px';
    el.style.setProperty('--tx', tx + 'px');
    el.style.setProperty('--ty', ty + 'px');
    el.style.setProperty('--rot', (Math.random() * 180 - 90) + 'deg');
    el.style.setProperty('--dur', dur + 's');
    el.style.animationDelay = delay + 's';
    burstLayer.appendChild(el);
    setTimeout(() => el.remove(), (dur + delay) * 1000 + 80);
  }
}

/* ---------- size each home-screen track name as big as it can go while
   still showing the whole word on one line -- measured with a canvas,
   same idea as the fullscreen view's title fitting ---------- */
const HOME_TRACK_FIT_CANVAS = document.createElement('canvas');
const HOME_TRACK_FIT_CTX = HOME_TRACK_FIT_CANVAS.getContext('2d');
const HOME_TRACK_FONT_STACK = "'Awesome Love Notes', " + '-apple-system, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif';
function fitHomeTrackNameSize(text, maxWidthPx){

}

function getAllFavoriteEntries(){
